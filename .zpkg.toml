[package]
org = "opto-sync"
name = "opto-sync-clients"
# Deliberately retained while the immutable approved-release controller targets
# v0.2.0. A later version requires new approval evidence; never rewrite the
# existing v0.2.0 evidence to manufacture that approval.
version = "0.2.0"
description = "Pinned polyglot local-first sync clients for TypeScript, Dart, Rust, and Gleam"
license = "MIT"
keywords = ["sync", "local-first", "optimistic", "indexeddb", "sqlite", "polyglot"]

[package.repository]
vcs = "git"
url = "https://github.com/opto-sync/opto-sync-clients"

# Cross-organization interfaces and structured logging remain injected at the
# native SDK boundary: installing this Zed package never configures a global
# OpenTelemetry provider. The SDK API contract pins their coordinates and the
# package check rejects undeclared/renamed dependencies.
[dependencies]
"ores-otel/ores-interfaces" = "^0.1.0"
"oresoftware/next-loggers" = "^0.1.0"

# The engine relationship is represented by the committed syncer.c gitlink and
# .gitmodules URL, then verified by scripts/check-package-layout.py and
# scripts/check-dependency-boundary.py. Do not also declare it as an installable
# Zed dependency: the complete repository artifact already contains that exact
# pinned core, and a second resolution could introduce two engine revisions.

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "python3 \"$ZED_PKG_TEST_TARGET/scripts/check-package-layout.py\""
exclude = [
  ".gitmodules",
  ".zed/**",
  ".formal-artifacts/**",
  "syncer.c/.git",
  "syncer.c/.git/**",
  "syncer.c/.github/**",
  "syncer.c/.zed/**",
  "syncer.c/core/test/**",
  "syncer.c/test-differential/**",
  "syncer.c/fuzz-*.log",
  "syncer.c/bindings/beam/priv/native/**",
  "clients/**/test/**",
  "clients/**/tests/**",
  "**/node_modules/**",
  "**/dist/**",
  "**/target/**",
  "**/build/**",
  "**/_build/**",
  "**/deps/**",
  "**/.dart_tool/**",
  "**/__pycache__/**",
  "**/pubspec.lock",
]

[scripts]
test = "python3 scripts/check-package-layout.py"

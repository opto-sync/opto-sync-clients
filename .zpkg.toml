[package]
org = "opto-sync"
name = "opto-sync-clients"
# The lifecycle state-machine API and explicit cancelled desktop outcome are an
# additive but switch-exhaustiveness-sensitive SDK change. Keep this minor bump
# distinct from earlier immutable release evidence; publishing requires fresh
# approval and a reviewed tag.
version = "0.4.0"
description = "Pinned polyglot local-first sync clients for TypeScript, Dart, Rust, Gleam, C#, and F#"
license = "MIT"
keywords = ["sync", "local-first", "optimistic", "indexeddb", "sqlite", "polyglot"]

[package.repository]
vcs = "git"
url = "https://github.com/opto-sync/opto-sync-clients"

# Cross-organization interfaces and structured logging remain injected at the
# native SDK boundary. Their intended Zed coordinates are recorded by the SDK
# contract, but are deliberately absent here until immutable 0.1.0 packages
# exist in the public registry and a clean `zed install --frozen` can resolve
# them. Never seed a private registry and commit its result as release proof.

# The engine relationship is represented by the committed syncer.c gitlink and
# .gitmodules URL, then verified by scripts/check-package-layout.py and
# scripts/check-dependency-boundary.py. Do not also declare it as an installable
# Zed dependency: the complete repository artifact already contains that exact
# pinned core, and a second resolution could introduce two engine revisions.

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "python3 \"$ZED_PKG_TEST_TARGET/scripts/check-package-layout.py\""
exclude = [
  ".gitmodules",
  ".zed/**",
  ".formal-artifacts/**",
  "syncer.c/.git",
  "syncer.c/.git/**",
  "syncer.c/.github/**",
  "syncer.c/.zed/**",
  "syncer.c/core/test/**",
  "syncer.c/test-differential/**",
  "syncer.c/fuzz-*.log",
  "syncer.c/bindings/beam/priv/native/**",
  "clients/**/test/**",
  "clients/**/tests/**",
  "**/node_modules/**",
  "**/dist/**",
  "**/target/**",
  "**/build/**",
  "**/_build/**",
  "**/deps/**",
  "**/.dart_tool/**",
  "**/__pycache__/**",
  "**/pubspec.lock",
]

[scripts]
test = "python3 scripts/check-package-layout.py"

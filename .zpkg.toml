[package]
org = "opto-sync"
name = "opto-sync-clients"
# The lifecycle and protocol-scheduler state-machine APIs are additive but
# switch-exhaustiveness-sensitive SDK changes. Keep this minor bump distinct
# from earlier immutable release evidence; publishing requires fresh approval
# and a reviewed tag.
version = "0.4.0"
description = "Pinned polyglot local-first sync clients for TypeScript, Dart, Rust, Gleam, PHP, C#, and F#"
license = "MIT"
keywords = ["sync", "local-first", "optimistic", "indexeddb", "sqlite", "polyglot"]

[package.repository]
vcs = "git"
url = "https://github.com/opto-sync/opto-sync-clients"

[dependencies]
# The API contract records opto-sync/opto-sync-interfaces@^0.1.0 as its schema
# source, but that repository has no immutable public release and explicitly
# disables publication. Keep it out of install resolution until a clean public
# registry can satisfy the coordinate; a locally seeded registry is not release
# evidence.

# Cross-organization interfaces and structured logging remain injected at the
# native SDK boundary. Their intended Zed coordinates are recorded by the SDK
# contract, but are deliberately absent here until immutable 0.1.0 packages
# exist in the public registry and a clean `zed install --frozen` can resolve
# them. Never seed a private registry and commit its result as release proof.

# The engine relationship is represented by the committed syncer.c gitlink and
# .gitmodules URL, then verified by scripts/check-package-layout.py and
# scripts/check-dependency-boundary.py. Do not also declare it as an installable
# Zed dependency: the complete repository artifact already contains that exact
# pinned core, and a second resolution could introduce two engine revisions.

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "python3 \"$ZED_PKG_TEST_TARGET/scripts/check-package-layout.py\""
exclude = [
  ".gitmodules",
  ".zed/**",
  ".formal-artifacts/**",
  "_apalache-out/**",
  "syncer.c/.git",
  "syncer.c/.git/**",
  "syncer.c/.github/**",
  "syncer.c/.zed/**",
  "syncer.c/core/test/**",
  "syncer.c/test-differential/**",
  "syncer.c/fuzz-*.log",
  "syncer.c/bindings/beam/priv/native/**",
  "clients/**/test/**",
  "clients/**/tests/**",
  "clients/php/composer.lock",
  "clients/php/vendor/**",
  "**/node_modules/**",
  "**/dist/**",
  "**/target/**",
  "**/build/**",
  "**/_build/**",
  "**/deps/**",
  "**/.dart_tool/**",
  "**/__pycache__/**",
  "**/pubspec.lock",
]

[scripts]
test = "python3 scripts/check-package-layout.py"

# Per-language capabilities remain canonical in clients/sdk-matrix.toml. They
# are API/conformance targets, not independently publishable Zed slices: the
# native manifests still reach the one root syncer.c gitlink. Publish only the
# complete repository until each extracted target is self-contained.

[install]
dir = ".vendor/.zed"

[targets.repository]
dir = "."

[package]
org = "opto-sync"
name = "opto-sync-clients"
version = "0.2.0"
description = "Pinned polyglot local-first sync clients for TypeScript, Dart, Rust, and Gleam"
license = "MIT"
keywords = ["sync", "local-first", "optimistic", "indexeddb", "sqlite", "polyglot"]

[package.repository]
vcs = "git"
url = "https://github.com/opto-sync/opto-sync-clients"

# The engine relationship is represented by the committed syncer.c gitlink and
# .gitmodules URL, then verified by scripts/check-package-layout.py and
# scripts/check-dependency-boundary.py. Do not also declare it as an installable
# Zed dependency: the complete repository artifact already contains that exact
# pinned core, and a second resolution could introduce two engine revisions.

[dependencies]
"opto-sync/opto-sync-interfaces" = "^0.1.0"

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "python3 \"$ZED_PKG_TEST_TARGET/scripts/check-package-layout.py\""
exclude = [
  ".zed/**",
  "syncer.c/.git",
  "syncer.c/.git/**",
  "syncer.c/.github/**",
  "syncer.c/.zed/**",
  "syncer.c/core/test/**",
  "syncer.c/test-differential/**",
  "syncer.c/fuzz-*.log",
  "clients/**/test/**",
  "clients/**/tests/**",
  "**/node_modules/**",
  "**/target/**",
  "**/build/**",
  "**/_build/**",
  "**/deps/**",
  "**/.dart_tool/**",
]

[scripts]
test = "python3 scripts/check-package-layout.py"

[targets.repository]
dir = "."

[targets.nodejs]
dir = "clients/typescript"
adapter = "node"

[targets.python]
dir = "clients/python3"
adapter = "python"

[targets.golang]
dir = "clients/golang"
adapter = "go"

[targets.rust]
dir = "clients/rust"
adapter = "rust"

[targets.dart]
dir = "clients/dart"
adapter = "dart"

[targets.gleam]
dir = "clients/gleamlang"
adapter = "none"

[targets.erlang]
dir = "clients/erlang"
adapter = "none"

[targets.elixir]
dir = "clients/elixir"
adapter = "none"

[targets.java]
dir = "clients/java"
adapter = "java"

[targets.kotlin]
dir = "clients/kotlin"
adapter = "java"

[targets.ruby]
dir = "clients/ruby"
adapter = "none"

[targets.php]
dir = "clients/php"
adapter = "none"

[targets.swift]
dir = "clients/swift"

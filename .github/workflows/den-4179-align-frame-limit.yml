name: DEN-4179 align websocket frame limit

on:
  push:
    branches:
      - fix/den-4179-websocket-generation-state
    paths:
      - '.github/workflows/den-4179-align-frame-limit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true

      - name: Install contract generator dependencies
        run: >-
          python3 -m pip install --disable-pip-version-check
          jsonschema==4.25.1 tomlkit==0.13.3

      - name: Align protocol quota and regenerate evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('clients/ts/src/transport/ws.ts'): [
                  ('const MAX_INBOUND_FRAME_BYTES = 1024 * 1024;',
                   'const MAX_INBOUND_FRAME_BYTES = 32 * 1024 * 1024;'),
              ],
              Path('clients/ts/test/ws-transport.test.mjs'): [
                  ("'x'.repeat(1024 * 1024 + 1)",
                   "'x'.repeat(32 * 1024 * 1024 + 1)"),
              ],
          }
          for path, edits in replacements.items():
              source = path.read_text(encoding='utf-8')
              for old, new in edits:
                  count = source.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected one match, found {count}')
                  source = source.replace(old, new)
              path.write_text(source, encoding='utf-8')
          PY

          python3 scripts/harden_client_contract.py \
            --root . \
            --schema clients/client-api.schema.json \
            --org opto-sync \
            --repo opto-sync-clients \
            --prefix opto-sync \
            --write

          git rm .github/workflows/den-4179-align-frame-limit.yml
          git add -- \
            clients/ts/src/transport/ws.ts \
            clients/ts/test/ws-transport.test.mjs \
            clients/contract-manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'align-websocket-frame-limit'
          git push origin "HEAD:${GITHUB_REF_NAME}"

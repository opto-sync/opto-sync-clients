name: DEN-1684 repair materializer quoting

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/den-1684-repair-materializer.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1684-cli-rpc-report-bundles
          fetch-depth: 0
          persist-credentials: true

      - name: Preserve Rust escape sequences and permit the follow-up bot push
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/den-1684-materialize.yml')
          source = path.read_text(encoding='utf-8')
          replacements = {
              "    if: github.actor != 'github-actions[bot]'\n": "    if: true\n",
              "old_print = '''fn print_outcome": "old_print = r'''fn print_outcome",
              "new_print = '''fn print_execution": "new_print = r'''fn print_execution",
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f'expected one materializer repair target: {old!r}')
              source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          PY
          git diff --check

      - name: Commit repair and remove this one-shot workflow
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/den-1684-materialize.yml
          git rm .github/workflows/den-1684-repair-materializer.yml
          git commit -m 'DEN-1684 preserve Rust escapes in materializer'
          git push origin "HEAD:${BRANCH}"

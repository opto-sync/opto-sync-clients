name: DEN-4179 fix websocket close ownership

on:
  push:
    branches:
      - fix/den-4179-websocket-generation-state
    paths:
      - '.github/workflows/den-4179-fix-close.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true

      - name: Install contract generator dependencies
        run: >-
          python3 -m pip install --disable-pip-version-check
          jsonschema==4.25.1 tomlkit==0.13.3

      - name: Patch close ownership and regenerate exact evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('clients/ts/src/transport/ws.ts')
          source = path.read_text(encoding='utf-8')

          replacements = [
              (
                  """      (\n        timeout as ReturnType<typeof setTimeout> & { unref?: () => void }\n      ).unref?.();\n\n      const clearDialTimeout = () => clearTimeoutFn(timeout);\n""",
                  """      const clearDialTimeout = () => clearTimeoutFn(timeout);\n""",
              ),
              (
                  """        const generationCurrent = generation === this.socketGeneration;\n        const active = this.isActiveSocket(socket, generation);\n        if (active) {\n""",
                  """        const generationCurrent = generation === this.socketGeneration;\n        const owning = this.isOwningSocket(socket, generation);\n        if (owning) {\n""",
              ),
              (
                  """  private isActiveSocket(socket: WebSocketLike, generation: number): boolean {\n    return (\n      !this.disposed &&\n      generation === this.socketGeneration &&\n      this.socket?.generation === generation &&\n      this.socket.socket === socket &&\n      socket.readyState === OPEN\n    );\n  }\n""",
                  """  private isOwningSocket(socket: WebSocketLike, generation: number): boolean {\n    return (\n      !this.disposed &&\n      generation === this.socketGeneration &&\n      this.socket?.generation === generation &&\n      this.socket.socket === socket\n    );\n  }\n\n  private isActiveSocket(socket: WebSocketLike, generation: number): boolean {\n    return this.isOwningSocket(socket, generation) && socket.readyState === OPEN;\n  }\n""",
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one websocket replacement, found {count}')
              source = source.replace(old, new)

          path.write_text(source, encoding='utf-8')
          PY

          python3 scripts/harden_client_contract.py \
            --root . \
            --schema clients/client-api.schema.json \
            --org opto-sync \
            --repo opto-sync-clients \
            --prefix opto-sync \
            --write

          git rm .github/workflows/den-4179-fix-close.yml
          git add -- clients/ts/src/transport/ws.ts clients/contract-manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix-websocket-close-ownership'
          git push origin "HEAD:${GITHUB_REF_NAME}"

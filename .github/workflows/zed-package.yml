name: Zed package contract

on:
  pull_request:
    paths:
      - '.zpkg.toml'
      - '.zpkg.lock'
      - '.gitmodules'
      - 'LICENSE'
      - 'clients/**'
      - 'schema/**'
      - 'syncer.c'
      - 'scripts/check-dependency-boundary.py'
      - 'scripts/check-package-layout.py'
      - 'scripts/check-zed-packaging.py'
      - 'docs/ZED_PACKAGE.md'
      - 'docs/SDK_API_CONTRACT.md'
      - '.github/workflows/zed-package.yml'
  push:
    branches: [main]
    paths:
      - '.zpkg.toml'
      - '.zpkg.lock'
      - '.gitmodules'
      - 'LICENSE'
      - 'clients/**'
      - 'schema/**'
      - 'syncer.c'
      - 'scripts/check-dependency-boundary.py'
      - 'scripts/check-package-layout.py'
      - 'scripts/check-zed-packaging.py'
      - 'docs/ZED_PACKAGE.md'
      - 'docs/SDK_API_CONTRACT.md'
      - '.github/workflows/zed-package.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZED_CLI_SHA: 14bc2fb1bdc2b85e5545e60e70fc94f047188662
  ZED_INTERFACES_SHA: 60a8ab55f8a55eb212a72dcb334c1c118047c7ef

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout package and pinned reconciliation core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: package
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Checkout pinned Zed CLI
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: zed-pkg/zed-cli
          ref: ${{ env.ZED_CLI_SHA }}
          path: zed-cli
          persist-credentials: false

      - name: Checkout pinned Zed interfaces
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: zed-pkg/zed-interfaces
          ref: ${{ env.ZED_INTERFACES_SHA }}
          path: zed-interfaces
          persist-credentials: false

      - name: Verify gitlink and Zed package boundaries
        run: |
          set -euo pipefail
          python3 package/scripts/check-dependency-boundary.py
          python3 package/scripts/check-zed-packaging.py

      - name: Build pinned Zed CLI
        run: cargo build --locked --release --manifest-path zed-cli/Cargo.toml --bin zed

      - name: Pack twice and prove byte-for-byte determinism
        shell: bash
        run: |
          set -euo pipefail
          zed="$GITHUB_WORKSPACE/zed-cli/target/release/zed"
          version="$(python3 -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("package/.zpkg.toml").read_text())["package"]["version"])')"
          archive="opto-sync-opto-sync-clients-${version}.tar.gz"
          echo "ZPKG_ARCHIVE=$archive" >> "$GITHUB_ENV"
          one="$RUNNER_TEMP/zpkg-one"
          two="$RUNNER_TEMP/zpkg-two"
          mkdir -p "$one" "$two"

          (cd package && "$zed" pack --out "$one")
          (cd package && "$zed" pack --out "$two")
          test "$(find "$one" -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1
          test "$(find "$two" -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1
          sha256sum "$one/$archive" "$two/$archive"
          cmp "$one/$archive" "$two/$archive"

      - name: Audit and execute the extracted source artifact
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zpkg-one/$ZPKG_ARCHIVE"
          listing="$RUNNER_TEMP/zpkg-files.txt"
          smoke_root="$RUNNER_TEMP/zpkg-smoke"
          tar -tzf "$archive" | sort > "$listing"

          required=(
            'pkg/.zpkg.toml'
            'pkg/LICENSE'
            'pkg/README.md'
            'pkg/clients/ts/package.json'
            'pkg/clients/ts/package-lock.json'
            'pkg/clients/dart/pubspec.yaml'
            'pkg/clients/rust/Cargo.toml'
            'pkg/clients/gleam/gleam.toml'
            'pkg/clients/sdk-matrix.toml'
            'pkg/schema/opto-sync-envelope.schema.json'
            'pkg/schema/opto-sync-sdk-api.schema.json'
            'pkg/schema/opto-sync-sdk-api.v1.json'
            'pkg/schema/opto-sync-sdk-values.v1.schema.json'
            'pkg/schema/opto-sync-telemetry.schema.json'
            'pkg/schema/check-sdk-api-contract.mjs'
            'pkg/schema/check-telemetry-corpus.mjs'
            'pkg/scripts/check-package-layout.py'
            'pkg/scripts/check-zed-packaging.py'
            'pkg/syncer.c/core/include/syncer.h'
            'pkg/syncer.c/core/src/syncer.c'
            'pkg/syncer.c/bindings/typescript/package.json'
            'pkg/syncer.c/bindings/wasm/package.json'
            'pkg/syncer.c/bindings/rust/Cargo.toml'
          )
          for path in "${required[@]}"; do
            grep -Fqx "$path" "$listing" || {
              echo "::error title=missing package file::$path is absent from the Zed artifact"
              exit 1
            }
          done

          if grep -Fqx 'pkg/.gitmodules' "$listing"; then
            echo '::error title=VCS metadata leaked into package::.gitmodules must stay in the source repository; the artifact carries the materialized syncer.c source instead'
            exit 1
          fi
          if grep -Fqx 'pkg/.zpkg.lock' "$listing"; then
            echo '::error title=source lock leaked into package::.zpkg.lock must stay outside the published artifact'
            exit 1
          fi
          if grep -Eq '(^|/)(\.git|\.github|\.zed)(/|$)|/(node_modules|target|build|_build|deps|\.dart_tool)(/|$)' "$listing"; then
            echo '::error title=generated state leaked into package::Unexpected VCS, CI, cache, dependency, or build output in artifact'
            grep -E '(^|/)(\.git|\.github|\.zed)(/|$)|/(node_modules|target|build|_build|deps|\.dart_tool)(/|$)' "$listing"
            exit 1
          fi

          mkdir -p "$smoke_root"
          tar -xzf "$archive" -C "$smoke_root"
          python3 "$smoke_root/pkg/scripts/check-zed-packaging.py" "$smoke_root/pkg"

      - name: Dry-run publish
        working-directory: package
        shell: bash
        run: |
          set -euo pipefail
          ../zed-cli/target/release/zed publish \
            --dry-run \
            --allow-dirty \
            --skip-vcs-checks | tee ../zed-dry-run.txt
          grep -F 'opto-sync/opto-sync-clients@0.3.0' ../zed-dry-run.txt
          test "$(grep -c '^dry run: would publish opto-sync/' ../zed-dry-run.txt)" -eq 1

      - name: Run a clean local registry/install roundtrip
        working-directory: package
        env:
          ZED_PKG_HOME: ${{ runner.temp }}/zed-home
          ZED_PKG_R2G_ROOT: ${{ runner.temp }}/zed-r2g
        run: ${{ github.workspace }}/zed-cli/target/release/zed r2g --clean

      - name: Upload deterministic package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opto-sync-clients-zed-package
          path: ${{ runner.temp }}/zpkg-one/${{ env.ZPKG_ARCHIVE }}
          if-no-files-found: error
          retention-days: 7

name: Zed package contract

on:
  pull_request:
    paths:
      - '.zpkg.toml'
      - '.zpkg.lock'
      - 'LICENSE'
      - 'clients/**'
      - 'scripts/check-zed-packaging.py'
      - '.github/workflows/zed-package.yml'
  push:
    branches: [main]
    paths:
      - '.zpkg.toml'
      - '.zpkg.lock'
      - 'LICENSE'
      - 'clients/**'
      - 'scripts/check-zed-packaging.py'
      - '.github/workflows/zed-package.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout package
        uses: actions/checkout@v4
        with:
          path: package
          persist-credentials: false

      - name: Checkout pinned Zed CLI
        uses: actions/checkout@v4
        with:
          repository: zed-pkg/zed-cli
          ref: c636fb8f6b08695c6b4fe94e2481f4d57270b2d7
          path: zed-cli
          persist-credentials: false

      - name: Checkout pinned Zed interfaces
        uses: actions/checkout@v4
        with:
          repository: zed-pkg/zed-interfaces
          ref: 415e871b1fb3dd97744c134351408a3224805dfb
          path: zed-interfaces
          persist-credentials: false

      - name: Build pinned Zed CLI
        run: cargo build --locked --manifest-path zed-cli/Cargo.toml --bin zed

      - name: Validate the native and Zed package boundaries
        working-directory: package
        run: python3 scripts/check-zed-packaging.py

      - name: Pack and dry-run publish
        working-directory: package
        run: |
          set -euo pipefail
          ../zed-cli/target/debug/zed pack
          ../zed-cli/target/debug/zed publish \
            --dry-run \
            --allow-dirty \
            --skip-vcs-checks | tee ../zed-dry-run.txt

          grep -F 'opto-sync/opto-sync-clients@0.2.0' ../zed-dry-run.txt
          test "$(grep -c '^dry run: would publish opto-sync/' ../zed-dry-run.txt)" -eq 1

      - name: Inspect the exact packed source artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact=package/.zed/pack/opto-sync-opto-sync-clients-0.2.0.tar.gz
          listing="${RUNNER_TEMP}/opto-sync-clients-files.txt"
          smoke_root="${RUNNER_TEMP}/opto-sync-clients-smoke"

          test -f "${artifact}"
          tar -tzf "${artifact}" | tee "${listing}"
          grep -Fx 'pkg/.zpkg.toml' "${listing}"
          grep -Fx 'pkg/LICENSE' "${listing}"
          grep -Fx 'pkg/clients/ts/package.json' "${listing}"
          grep -Fx 'pkg/clients/dart/pubspec.yaml' "${listing}"
          grep -Fx 'pkg/clients/rust/Cargo.toml' "${listing}"
          grep -Fx 'pkg/clients/gleam/gleam.toml' "${listing}"
          ! grep -E '(^|/)(node_modules|target|\.dart_tool|_build|\.zed)(/|$)' "${listing}"

          mkdir -p "${smoke_root}"
          tar -xzf "${artifact}" -C "${smoke_root}"
          python3 package/scripts/check-zed-packaging.py "${smoke_root}/pkg"

      - name: Upload deterministic package artifact
        uses: actions/upload-artifact@v4
        with:
          name: opto-sync-clients-zed-package
          path: package/.zed/pack/
          if-no-files-found: error
          retention-days: 7

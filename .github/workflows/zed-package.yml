name: Zed package contract

on:
  pull_request:
    paths:
      - '.zpkg.toml'
      - '.zpkg.lock'
      - 'LICENSE'
      - 'clients/**'
      - 'scripts/check-zed-packaging.py'
      - '.github/workflows/zed-package.yml'
  push:
    branches: [main]
    paths:
      - '.zpkg.toml'
      - '.zpkg.lock'
      - 'LICENSE'
      - 'clients/**'
      - 'scripts/check-zed-packaging.py'
      - '.github/workflows/zed-package.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZED_CLI_SHA: c636fb8f6b08695c6b4fe94e2481f4d57270b2d7
  ZED_INTERFACES_SHA: 415e871b1fb3dd97744c134351408a3224805dfb

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout package
        uses: actions/checkout@v4
        with:
          path: package
          persist-credentials: false

      - name: Checkout pinned Zed CLI
        uses: actions/checkout@v4
        with:
          repository: zed-pkg/zed-cli
          ref: ${{ env.ZED_CLI_SHA }}
          path: zed-cli
          persist-credentials: false

      - name: Checkout pinned Zed interfaces
        uses: actions/checkout@v4
        with:
          repository: zed-pkg/zed-interfaces
          ref: ${{ env.ZED_INTERFACES_SHA }}
          path: zed-interfaces
          persist-credentials: false

      - name: Validate the current source-package boundary
        working-directory: package
        run: python3 scripts/check-zed-packaging.py

      - name: Build pinned Zed CLI
        run: cargo build --locked --release --manifest-path zed-cli/Cargo.toml --bin zed

      - name: Pack twice, inspect, and dry-run publish
        working-directory: package
        env:
          ZED: ${{ github.workspace }}/zed-cli/target/release/zed
        run: |
          set -euo pipefail
          first="$RUNNER_TEMP/opto-sync-clients-zpkg-first"
          mkdir -p "$first"

          rm -rf .zed
          "$ZED" pack
          cp .zed/pack/*.tar.gz "$first/"
          first_archives=("$first"/*.tar.gz)
          test "${#first_archives[@]}" -eq 1

          rm -rf .zed
          "$ZED" pack
          second_archives=(.zed/pack/*.tar.gz)
          test "${#second_archives[@]}" -eq 1
          test "$(basename "${first_archives[0]}")" = "$(basename "${second_archives[0]}")"
          sha256sum "${first_archives[0]}" "${second_archives[0]}"
          cmp "${first_archives[0]}" "${second_archives[0]}"
          tar -tzf "${second_archives[0]}" | grep -Fx 'pkg/LICENSE'

          "$ZED" publish \
            --dry-run \
            --allow-dirty \
            --skip-vcs-checks | tee "$RUNNER_TEMP/zed-dry-run.txt"

          grep -F 'opto-sync/opto-sync-clients@0.2.0' "$RUNNER_TEMP/zed-dry-run.txt"
          test "$(grep -c '^dry run: would publish opto-sync/' "$RUNNER_TEMP/zed-dry-run.txt")" -eq 1
          echo "ZPKG_ARCHIVE=${first_archives[0]}" >> "$GITHUB_ENV"

      - name: Upload deterministic package artifact
        uses: actions/upload-artifact@v4
        with:
          name: opto-sync-clients-zed-package
          path: ${{ env.ZPKG_ARCHIVE }}
          if-no-files-found: error
          retention-days: 7

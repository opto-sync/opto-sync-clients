name: Zed package contract

on:
  pull_request:
    paths:
      - '.zpkg.toml'
      - '.zpkg.lock'
      - 'LICENSE'
      - 'clients/**'
      - 'scripts/check-zed-packaging.py'
      - '.github/workflows/zed-package.yml'
  push:
    branches: [main]
    paths:
      - '.zpkg.toml'
      - '.zpkg.lock'
      - 'LICENSE'
      - 'clients/**'
      - 'scripts/check-zed-packaging.py'
      - '.github/workflows/zed-package.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZED_CLI_SHA: c636fb8f6b08695c6b4fe94e2481f4d57270b2d7
  ZED_INTERFACES_SHA: 415e871b1fb3dd97744c134351408a3224805dfb

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout package
        uses: actions/checkout@v4
        with:
          path: package
          persist-credentials: false

      - name: Checkout pinned Zed CLI
        uses: actions/checkout@v4
        with:
          repository: zed-pkg/zed-cli
          ref: ${{ env.ZED_CLI_SHA }}
          path: zed-cli
          persist-credentials: false

      - name: Checkout pinned Zed interfaces
        uses: actions/checkout@v4
        with:
          repository: zed-pkg/zed-interfaces
          ref: ${{ env.ZED_INTERFACES_SHA }}
          path: zed-interfaces
          persist-credentials: false

      - name: Validate the source package boundary
        working-directory: package
        run: python3 scripts/check-zed-packaging.py

      - name: Build pinned Zed CLI
        run: cargo build --locked --release --manifest-path zed-cli/Cargo.toml --bin zed

      - name: Pack twice and dry-run publish
        working-directory: package
        env:
          ZED: ${{ github.workspace }}/zed-cli/target/release/zed
        run: |
          set -euo pipefail
          archive_name=opto-sync-opto-sync-clients-0.2.0.tar.gz
          first="$RUNNER_TEMP/opto-sync-clients-zpkg-first"
          mkdir -p "$first"

          rm -rf .zed
          "$ZED" pack
          test -f ".zed/pack/$archive_name"
          cp ".zed/pack/$archive_name" "$first/$archive_name"

          rm -rf .zed
          "$ZED" pack
          test -f ".zed/pack/$archive_name"
          test "$(find .zed/pack -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1
          sha256sum "$first/$archive_name" ".zed/pack/$archive_name"
          cmp "$first/$archive_name" ".zed/pack/$archive_name"

          "$ZED" publish \
            --dry-run \
            --allow-dirty \
            --skip-vcs-checks | tee "$RUNNER_TEMP/zed-dry-run.txt"

          grep -F 'opto-sync/opto-sync-clients@0.2.0' "$RUNNER_TEMP/zed-dry-run.txt"
          test "$(grep -c '^dry run: would publish opto-sync/' "$RUNNER_TEMP/zed-dry-run.txt")" -eq 1
          echo "ZPKG_ARCHIVE=$first/$archive_name" >> "$GITHUB_ENV"

      - name: Inspect the exact packed source artifact
        shell: bash
        run: |
          set -euo pipefail
          listing="${RUNNER_TEMP}/opto-sync-clients-files.txt"
          smoke_root="${RUNNER_TEMP}/opto-sync-clients-smoke"

          tar -tzf "$ZPKG_ARCHIVE" | tee "$listing"
          grep -Fx 'pkg/.zpkg.toml' "$listing"
          grep -Fx 'pkg/LICENSE' "$listing"
          grep -Fx 'pkg/clients/ts/package.json' "$listing"
          grep -Fx 'pkg/clients/dart/pubspec.yaml' "$listing"
          grep -Fx 'pkg/clients/rust/Cargo.toml' "$listing"
          grep -Fx 'pkg/clients/gleam/gleam.toml' "$listing"
          ! grep -E '(^|/)(node_modules|target|\.dart_tool|_build|\.zed)(/|$)' "$listing"

          mkdir -p "$smoke_root"
          tar -xzf "$ZPKG_ARCHIVE" -C "$smoke_root"
          python3 package/scripts/check-zed-packaging.py "$smoke_root/pkg"
          ZED_PKG_TEST_TARGET="$smoke_root/pkg" sh -c \
            'test -f "$ZED_PKG_TEST_TARGET/LICENSE" && test -f "$ZED_PKG_TEST_TARGET/clients/ts/package.json" && test -f "$ZED_PKG_TEST_TARGET/clients/dart/pubspec.yaml" && test -f "$ZED_PKG_TEST_TARGET/clients/rust/Cargo.toml" && test -f "$ZED_PKG_TEST_TARGET/clients/gleam/gleam.toml"'

      - name: Upload deterministic package artifact
        uses: actions/upload-artifact@v4
        with:
          name: opto-sync-clients-zed-package
          path: ${{ env.ZPKG_ARCHIVE }}
          if-no-files-found: error
          retention-days: 7

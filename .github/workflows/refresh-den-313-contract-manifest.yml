name: Refresh DEN-313 form connector fingerprint

on:
  push:
    branches:
      - DEN-313-form-connectors
    paths:
      - clients/ts/browser/forms/sanitize.js
      - .github/workflows/refresh-den-313-contract-manifest.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-den-313-contract-manifest
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Recompute only the extension-ts implementation evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.verify_client_contract import implementation_evidence

          manifest_path = Path('clients/contract-manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          target = next(
              item for item in manifest['targets']
              if item.get('target') == 'extension-ts'
          )
          count, digest = implementation_evidence(Path(target['dir']))
          target['implementationFileCount'] = count
          target['implementationSha256'] = digest
          manifest_path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          print(f'extension-ts count={count} sha256={digest}')
          PY
          python3 -m json.tool clients/contract-manifest.json >/dev/null
          git diff --check

      - name: Commit the exact fingerprint when it changed
        run: |
          set -euo pipefail
          if git diff --quiet -- clients/contract-manifest.json; then
            echo 'Fingerprint already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add clients/contract-manifest.json
          git commit -m 'fix(DEN-313): refresh standalone connector fingerprint'
          git push origin HEAD:DEN-313-form-connectors

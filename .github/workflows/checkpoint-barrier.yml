name: checkpoint-barrier

on:
  pull_request:
    paths:
      - 'contract/checkpoint-barrier.v1.tsp'
      - 'schema/opto-sync-checkpoint-barrier.v1.schema.json'
      - 'schema/check-checkpoint-barrier-parity.mjs'
      - 'formal/checkpoint_barrier_vectors.v1.json'
      - 'clients/ts/src/caught-up.ts'
      - 'clients/ts/src/index.ts'
      - 'clients/ts/src/browser.ts'
      - 'clients/ts/test/caught-up.test.mjs'
      - 'clients/dart/lib/caught_up.dart'
      - 'clients/dart/test/caught_up_test.dart'
      - 'clients/rust/src/caught_up.rs'
      - 'clients/rust/tests/caught_up_compile.rs'
      - '.github/workflows/checkpoint-barrier.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checkpoint-barrier-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node schema/check-checkpoint-barrier-parity.mjs

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: clients/ts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: clients/ts/package-lock.json
      - name: Install pinned syncer TypeScript binding dependencies
        working-directory: syncer.c/bindings/typescript
        run: npm ci
      - run: npm ci
      - run: npm run build
      - run: node --test test/caught-up.test.mjs

  dart:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: clients/dart
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: stable
      - name: Install pinned syncer TypeScript binding dependencies
        working-directory: syncer.c/bindings/typescript
        run: npm ci
      - run: dart pub get
      - name: Check checkpoint-barrier Dart formatting without mutating the checkout
        run: dart format --output=none --set-exit-if-changed lib/caught_up.dart lib/src/state_machine/caught_up.dart test/caught_up_test.dart
      - run: dart analyze lib/caught_up.dart lib/src/state_machine/caught_up.dart test/caught_up_test.dart
      - run: dart test test/caught_up_test.dart

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: clients/rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Ensure rustfmt is available from the runner toolchain
        run: rustup component add rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --test caught_up_compile

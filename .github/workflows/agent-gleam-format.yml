name: Agent Gleam format fix

on:
  push:
    branches: [agent/harden-envelope-validation]
    paths:
      - clients/gleam/src/opto_sync_ingest.gleam
      - clients/gleam/test/opto_sync_ingest_provider_test.gleam
      - .github/workflows/agent-gleam-format.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/harden-envelope-validation
          fetch-depth: 0
          persist-credentials: true
      - name: Install pinned Gleam formatter
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLO https://github.com/gleam-lang/gleam/releases/download/v1.16.0/gleam-v1.16.0-x86_64-unknown-linux-musl.tar.gz
          curl -fsSLO https://github.com/gleam-lang/gleam/releases/download/v1.16.0/gleam-v1.16.0-x86_64-unknown-linux-musl.tar.gz.sha256
          sha256sum -c gleam-v1.16.0-x86_64-unknown-linux-musl.tar.gz.sha256
          sudo tar -xzf gleam-v1.16.0-x86_64-unknown-linux-musl.tar.gz -C /usr/local/bin gleam
      - name: Format only the Gleam validation changes
        working-directory: clients/gleam
        run: gleam format src test
      - name: Commit formatted Gleam sources
        shell: bash
        run: |
          set -euo pipefail
          git add clients/gleam/src/opto_sync_ingest.gleam clients/gleam/test/opto_sync_ingest_provider_test.gleam
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'format Gleam validation adapters'
          git push origin HEAD:agent/harden-envelope-validation

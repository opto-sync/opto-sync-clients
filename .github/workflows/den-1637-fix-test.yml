name: DEN-1637 fix SARIF exit-code assertion type

on:
  push:
    branches:
      - agent/den-1637-report-bundle
    paths:
      - '.github/workflows/den-1637-fix-test.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out report branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1637-report-bundle
          fetch-depth: 0
          persist-credentials: true

      - name: Install repository Nix toolchain
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Fix the typed SARIF assertion and certify it
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/fmctl/tests/report_bundle.rs')
          source = path.read_text(encoding='utf-8')
          old = '            assert_eq!(invocation["exitCode"], outcome.exit_code);\n'
          new = '''            assert_eq!(
                  invocation["exitCode"],
                  serde_json::to_value(outcome.exit_code).expect("exit-code JSON")
              );
          '''
          if source.count(old) != 1:
              raise SystemExit('expected one SARIF exit-code assertion')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          nix develop --command cargo fmt \
            --manifest-path tools/fmctl/Cargo.toml
          nix develop --command cargo clippy \
            --locked \
            --manifest-path tools/fmctl/Cargo.toml \
            --all-targets \
            --all-features \
            -- -D warnings
          nix develop --command cargo test \
            --locked \
            --manifest-path tools/fmctl/Cargo.toml \
            --test report_bundle
          git diff --check

      - name: Commit the assertion repair
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/fmctl/tests/report_bundle.rs
          git commit -m 'DEN-1637 fix SARIF exit-code assertion type'
          git push origin "HEAD:${BRANCH}"

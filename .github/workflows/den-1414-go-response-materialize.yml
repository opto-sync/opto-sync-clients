name: DEN-1414 close direct Go response encoding gap

on:
  push:
    branches:
      - agent/den-1414-capability-registry-core
    paths:
      - '.github/workflows/den-1414-go-response-materialize.yml'

permissions:
  contents: write

concurrency:
  group: den-1414-go-response-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout the DEN-1414 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1414-capability-registry-core
          fetch-depth: 0
          persist-credentials: true

      - name: Install Go from the module contract
        uses: actions/setup-go@c0137caad775660c0844396c52da96e560aba63d # v6
        with:
          go-version-file: formal/sdk/go/go.mod
          cache: false

      - name: Tighten response validation and add the encoder regression
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          protocol = Path('formal/sdk/go/protocol.go')
          source = protocol.read_text(encoding='utf-8')
          old = '''func (response Response) Validate() error {
          	if err := validateEnvelope(response.Protocol, response.ProtocolVersion, response.RequestID, response.Machine); err != nil {
          		return err
          	}
          	if err := validateGeneration(response.Generation); err != nil {
          		return err
          	}
          	if !validOperationName(response.Operation) {
          		return fmt.Errorf("unsupported response operation %q", response.Operation)
          	}
          	return response.Outcome.Validate()
          }
          '''
          new = '''func (response Response) Validate() error {
          	if err := validateEnvelope(response.Protocol, response.ProtocolVersion, response.RequestID, response.Machine); err != nil {
          		return err
          	}
          	if err := validateGeneration(response.Generation); err != nil {
          		return err
          	}
          	if !validOperationName(response.Operation) {
          		return fmt.Errorf("unsupported response operation %q", response.Operation)
          	}
          	if err := response.Outcome.Validate(); err != nil {
          		return err
          	}
          	if response.Operation == "hello" && response.Outcome.Kind == "ok" {
          		hello, err := decodeHelloResult(response.Outcome.Value)
          		if err != nil {
          			return err
          		}
          		_, err = validateCapabilities(hello.Capabilities)
          		return err
          	}
          	return nil
          }
          '''
          if source.count(old) != 1:
              raise SystemExit('expected one exact Response.Validate implementation')
          protocol.write_text(source.replace(old, new, 1), encoding='utf-8')

          tests = Path('formal/sdk/go/capabilities_test.go')
          source = tests.read_text(encoding='utf-8')
          marker = 'func helloValueWithCapabilities(capabilities []string) map[string]any {\n'
          addition = '''func TestEncodeMessageRejectsNoncanonicalHello(t *testing.T) {
          	response := Response{
          		Protocol: Protocol, ProtocolVersion: ProtocolVersion,
          		RequestID: "1", Machine: "lease", Generation: 0,
          		Operation: "hello",
          		Outcome: OK(helloValueWithCapabilities([]string{
          			"reset", "apply", "observe", "snapshot", "settle", "close",
          		})),
          	}
          	_, err := EncodeMessage(Message{Kind: "response", Response: &response})
          	if err == nil || !strings.Contains(err.Error(), "canonical v1 order") {
          		t.Fatalf("expected direct encoder rejection, got %v", err)
          	}
          }

          '''
          if source.count(marker) != 1:
              raise SystemExit('expected one helloValueWithCapabilities marker')
          tests.write_text(source.replace(marker, addition + marker, 1), encoding='utf-8')
          PY

          gofmt -w formal/sdk/go/protocol.go formal/sdk/go/capabilities_test.go
          (
            cd formal/sdk/go
            go test ./...
          )
          git diff --check

      - name: Commit the complete Go validation boundary
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add formal/sdk/go/protocol.go formal/sdk/go/capabilities_test.go
          git commit -m 'DEN-1414 reject noncanonical hello at Go encode boundary'
          git push origin "HEAD:${BRANCH}"

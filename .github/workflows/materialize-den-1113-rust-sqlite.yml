name: DEN-1113 materialize Rust SQLite

on:
  push:
    branches:
      - agent/den-1113-rust-sqlite-coordinator
    paths:
      - 'clients/desktop-rust/**'
      - 'docs/RUST_SQLITE_DESKTOP_COORDINATION.md'
      - '.github/workflows/materialize-den-1113-rust-sqlite.yml'
  pull_request:
    branches:
      - agent/den-1113-validation-base
    paths:
      - 'clients/desktop-rust/**'
      - 'docs/RUST_SQLITE_DESKTOP_COORDINATION.md'
      - '.github/workflows/materialize-den-1113-rust-sqlite.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: den-1113-rust-sqlite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-materialize:
    if: >-
      github.repository == 'opto-sync/opto-sync-clients' &&
      (github.event_name != 'pull_request' || github.head_ref == 'agent/den-1113-rust-sqlite-coordinator')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
        with:
          components: rustfmt, clippy

      - name: Integrate the module and harden the child-process handshake
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lib = Path('clients/desktop-rust/src/lib.rs')
          content = lib.read_text()
          declaration = 'pub mod sqlite;\n\n'
          if declaration not in content:
              marker = 'use std::collections::BTreeMap;\n'
              if marker not in content:
                  raise SystemExit('could not locate stable lib.rs insertion point')
              content = content.replace(marker, declaration + marker, 1)
              lib.write_text(content)

          tests = Path('clients/desktop-rust/tests/sqlite_coordination.rs')
          content = tests.read_text()
          old_command = '''    command
                  .arg("--ignored")
                  .arg("--nocapture")
                  .arg("sqlite_child_process")
          '''
          new_command = '''    command
                  .arg("sqlite_child_process")
                  .arg("--exact")
                  .arg("--ignored")
                  .arg("--nocapture")
                  .arg("--test-threads=1")
          '''
          if old_command not in content:
              raise SystemExit('could not locate child test command')
          content = content.replace(old_command, new_command, 1)

          old_handshake = '''    let mut line = String::new();
              reader.read_line(&mut line).expect("read holder acquisition");
              assert!(line.starts_with("acquired:"), "holder output: {line:?}");
              child
          '''
          new_handshake = '''    let mut transcript = String::new();
              loop {
                  let mut line = String::new();
                  let read = reader
                      .read_line(&mut line)
                      .expect("read holder acquisition");
                  if read == 0 {
                      panic!("holder exited before acquisition: {transcript:?}");
                  }
                  transcript.push_str(&line);
                  if line.contains("acquired:") {
                      break;
                  }
                  if line.contains("busy:") {
                      panic!("holder unexpectedly found a busy lease: {transcript:?}");
                  }
              }
              child
          '''
          if old_handshake not in content:
              raise SystemExit('could not locate child acquisition handshake')
          tests.write_text(content.replace(old_handshake, new_handshake, 1))
          PY

      - name: Generate the lockfile and validate the product tree
        env:
          RUST_BACKTRACE: '1'
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path clients/desktop-rust/Cargo.toml
          cargo fmt --manifest-path clients/desktop-rust/Cargo.toml
          cargo clippy --locked --manifest-path clients/desktop-rust/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path clients/desktop-rust/Cargo.toml

      - name: Commit only validated product files and remove this one-shot workflow
        env:
          BRANCH_NAME: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-den-1113-rust-sqlite.yml
          git add -A -- \
            .github/workflows/materialize-den-1113-rust-sqlite.yml \
            clients/desktop-rust/Cargo.lock \
            clients/desktop-rust/src/lib.rs \
            clients/desktop-rust/src/sqlite.rs \
            clients/desktop-rust/tests/sqlite_coordination.rs

          changed="$(git diff --cached --name-only)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(.github/workflows/materialize-den-1113-rust-sqlite.yml|clients/desktop-rust/(Cargo.lock|src/lib.rs|src/sqlite.rs|tests/sqlite_coordination.rs))$' || true)"
          if [ -n "$unexpected" ]; then
            echo "unexpected materialized paths:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          if git diff --cached --quiet; then
            echo 'validator produced no materialized changes' >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'DEN-1113 validate Rust SQLite coordinator'
          git push origin "HEAD:${BRANCH_NAME}"

name: DEN-4179 normalize websocket contract

on:
  push:
    branches:
      - fix/den-4179-websocket-generation-state
    paths:
      - '.github/workflows/den-4179-normalize.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true

      - name: Install contract generator dependencies
        run: >-
          python3 -m pip install --disable-pip-version-check
          jsonschema==4.25.1 tomlkit==0.13.3

      - name: Regenerate and commit canonical evidence
        run: |
          set -euo pipefail
          python3 scripts/harden_client_contract.py \
            --root . \
            --schema clients/client-api.schema.json \
            --org opto-sync \
            --repo opto-sync-clients \
            --prefix opto-sync \
            --write
          git add -- clients/contract-manifest.json
          if git diff --cached --quiet; then
            echo 'No generated contract changes remain.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'normalize-websocket-contract'
          git push origin "HEAD:${GITHUB_REF_NAME}"

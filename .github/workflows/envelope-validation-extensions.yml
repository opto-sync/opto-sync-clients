name: Envelope validation extensions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-envelope-validation:
    name: clients/go — shared envelope corpus
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout opto-sync-clients
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Format and test
        working-directory: clients/go
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...

  java-envelope-validation:
    name: clients/java — shared envelope corpus
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout opto-sync-clients
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile with warnings-as-errors and test
        working-directory: clients/java
        run: ./test.sh

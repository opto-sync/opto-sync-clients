name: Refresh TypeScript lock (DEN-35)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches:
      - agent/DEN-35-pinned-core-zpkg
    paths:
      - '.github/workflows/refresh-ts-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: den-35-refresh-ts-lock
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'agent/DEN-35-pinned-core-zpkg')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch with pinned core
        uses: actions/checkout@v4
        with:
          ref: agent/DEN-35-pinned-core-zpkg
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # npm preserves local-link package keys from an existing lock even after
      # package.json moves. Migrate only the reviewed sibling prefix first, then
      # let npm normalize versions/link entries without running native scripts.
      - name: Regenerate package-lock without running native scripts
        working-directory: clients/ts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('package-lock.json')
          text = path.read_text(encoding='utf-8')
          old = '../../../syncer.c'
          new = '../../syncer.c'
          count = text.count(old)
          if count == 0:
              print('no legacy sibling-link keys remained')
          else:
              path.write_text(text.replace(old, new), encoding='utf-8')
              print(f'migrated {count} legacy sibling-link reference(s)')
          PY
          npm install --package-lock-only --ignore-scripts

      - name: Verify the dependency boundary
        run: python3 scripts/check-dependency-boundary.py

      - name: Commit the generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- clients/ts/package-lock.json; then
            echo 'package-lock.json was already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add clients/ts/package-lock.json
          git commit -m 'DEN-35 refresh TypeScript lock for pinned core'
          git push origin HEAD:agent/DEN-35-pinned-core-zpkg

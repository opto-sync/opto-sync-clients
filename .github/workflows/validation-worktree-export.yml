name: Validation hardening bootstrap

on:
  push:
    branches:
      - agent/validation-hardening-go-java
    paths:
      - .validation-bootstrap-ready

permissions:
  contents: write

concurrency:
  group: validation-hardening-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/validation-hardening-go-java
          fetch-depth: 0
          persist-credentials: true

      - name: Verify and apply audited implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .validation-bootstrap/part-* \
            | tr -d '\r\n' \
            | base64 -d \
            > "$RUNNER_TEMP/validation-hardening.patch.gz"
          printf '%s  %s\n' \
            '220cdd0d284efd80024396a8b2a685abf1b1bdde8d652b1d96dc2a885707f86e' \
            "$RUNNER_TEMP/validation-hardening.patch.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/validation-hardening.patch.gz" \
            > "$RUNNER_TEMP/validation-hardening.patch"
          git apply --check "$RUNNER_TEMP/validation-hardening.patch"
          git apply "$RUNNER_TEMP/validation-hardening.patch"

      - name: Smoke-test generated sources
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool schema/opto-sync-envelope.schema.json >/dev/null
          node --check schema/check-corpus.mjs
          node --check validation/typescript/src/guard.mjs
          node --check validation/typescript/src/ajv.mjs
          node --check validation/typescript/test/corpus.test.mjs
          (cd clients/go && go test ./... && go vet ./...)

      - name: Commit and push product sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .validation-bootstrap .validation-bootstrap-ready
          rm .github/workflows/validation-worktree-export.yml
          git config user.name 'opto-sync validation automation'
          git config user.email 'validation-automation@users.noreply.github.com'
          git add -A
          git commit -m 'feat(validation): harden polyglot envelope validation'
          git push origin HEAD:agent/validation-hardening-go-java

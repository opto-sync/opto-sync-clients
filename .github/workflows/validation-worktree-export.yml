name: Polyglot validation hardening bootstrap

on:
  push:
    branches:
      - agent/validation-hardening-polyglot-20260804
    paths:
      - .validation-bootstrap-ready
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: polyglot-validation-hardening-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize-and-validate:
    if: github.actor == 'ORESoftware'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out isolated feature branch and pinned core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/validation-hardening-polyglot-20260804
          fetch-depth: 0
          persist-credentials: true
          submodules: recursive

      - name: Materialize audited product source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'opto-sync validation automation'
          git config user.email 'validation-automation@users.noreply.github.com'
          if [[ -d .validation-bootstrap ]]; then
            cat .validation-bootstrap/part-* \
              | tr -d '\r\n' \
              | base64 -d \
              > "$RUNNER_TEMP/validation-hardening.patch.xz"
            printf '%s  %s\n' \
              'faca3d443312f7b53207488d91f2ec851eb8fbbbee9e84e4a495ac80d8aa63da' \
              "$RUNNER_TEMP/validation-hardening.patch.xz" | sha256sum -c -
            xz -dc "$RUNNER_TEMP/validation-hardening.patch.xz" \
              | patch -p1 --batch --forward
            chmod 0755 scripts/generate-validation-schema-copies.py
            python3 scripts/generate-validation-schema-copies.py --check
            rm -rf .validation-bootstrap .validation-bootstrap-ready
            git add -A
            git commit -m 'feat(validation): harden polyglot envelope validation'
            git push origin HEAD:agent/validation-hardening-polyglot-20260804
          else
            rm -f .validation-bootstrap-ready
          fi

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Set up Rust 1.91
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.91.0'
          components: rustfmt,clippy

      - name: Set up Dart
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: stable

      - name: Set up Erlang, Elixir, and Gleam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: '27.3.4'
          elixir-version: '1.18.4'
          gleam-version: '1.16.0'

      - name: Set up Go 1.24
        uses: actions/setup-go@c0137caad775660c0844396c52da96e560aba63d # v6
        with:
          go-version: '1.24.x'
          cache: false

      - name: Set up Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: clients/java/pom.xml

      - name: Lock and format all validation modules
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate-validation-schema-copies.py
          (cd schema && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
          (cd clients/ts && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
          (cd clients/rust && cargo generate-lockfile && cargo fmt)
          (cd clients/dart && dart pub get && dart format lib/src/clock.dart lib/src/schema test/clock_test.dart test/schema_ingest_test.dart)
          rm -rf clients/dart/.dart_tool clients/dart/pubspec.lock
          (cd clients/gleam && gleam deps download && gleam format src test)
          (cd clients/go && go mod tidy && gofmt -w .)
          python3 scripts/generate-validation-schema-copies.py --check
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore(validation): lock and format validator backends'
            git push origin HEAD:agent/validation-hardening-polyglot-20260804
          fi

      - name: Validate shared schema and package boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate-validation-schema-copies.py --check
          python3 scripts/check-dependency-boundary.py
          python3 scripts/check-package-layout.py --source-root .
          (cd schema && npm ci --ignore-scripts && npm test)

      - name: Validate TypeScript backends
        shell: bash
        run: |
          set -euo pipefail
          cd clients/ts
          npm ci --ignore-scripts
          npm run build
          node --test test/schema-ingest.test.mjs

      - name: Validate Rust backends
        working-directory: clients/rust
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo test --locked --all-features --test schema_ingest
          cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Validate Dart backends
        working-directory: clients/dart
        shell: bash
        run: |
          set -euo pipefail
          dart pub get
          dart analyze
          dart test test/schema_ingest_test.dart

      - name: Validate Gleam backends
        working-directory: clients/gleam
        shell: bash
        run: |
          set -euo pipefail
          gleam deps download
          gleam format --check src test
          gleam test

      - name: Validate Go backends
        working-directory: clients/go
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go vet ./...
          go test ./...

      - name: Validate Java backends
        working-directory: clients/java
        run: mvn --batch-mode --no-transfer-progress test

      - name: Require clean generated state and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rm -rf clients/dart/.dart_tool clients/dart/pubspec.lock
          git diff --exit-code
          git rm .github/workflows/validation-worktree-export.yml
          git commit -m 'chore(validation): remove completed bootstrap'
          git push origin HEAD:agent/validation-hardening-polyglot-20260804

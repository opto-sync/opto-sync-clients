name: Validation hardening bootstrap

on:
  push:
    branches:
      - agent/validation-hardening-go-java
    paths:
      - .validation-bootstrap-ready
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validation-hardening-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize-and-validate:
    if: github.actor == 'ORESoftware'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact feature branch and pinned core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/validation-hardening-go-java
          fetch-depth: 0
          persist-credentials: true
          submodules: recursive

      - name: Apply audited validation implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .validation-bootstrap/part-* \
            | tr -d '\r\n' \
            | base64 -d \
            > "$RUNNER_TEMP/validation-hardening.patch.xz"
          printf '%s  %s\n' \
            'faca3d443312f7b53207488d91f2ec851eb8fbbbee9e84e4a495ac80d8aa63da' \
            "$RUNNER_TEMP/validation-hardening.patch.xz" | sha256sum -c -
          xz -dc "$RUNNER_TEMP/validation-hardening.patch.xz" \
            | patch -p1 --batch --forward
          chmod 0755 scripts/generate-validation-schema-copies.py
          python3 scripts/generate-validation-schema-copies.py --check
          rm -rf .validation-bootstrap .validation-bootstrap-ready

      - name: Commit and push product source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'opto-sync validation automation'
          git config user.email 'validation-automation@users.noreply.github.com'
          git add -A
          git commit -m 'feat(validation): harden polyglot envelope validation'
          git push origin HEAD:agent/validation-hardening-go-java

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Set up Rust 1.88
        uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
        with:
          components: rustfmt,clippy

      - name: Set up Dart
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: stable

      - name: Set up OTP and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: '27.3'
          elixir-version: '1.18.4'

      - name: Set up Go 1.24
        uses: actions/setup-go@c0137caad775660c0844396c52da96e560aba63d # v6
        with:
          go-version: '1.24.x'
          cache: false

      - name: Set up Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: clients/java/pom.xml

      - name: Install Gleam 1.16
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLO https://github.com/gleam-lang/gleam/releases/download/v1.16.0/gleam-v1.16.0-x86_64-unknown-linux-musl.tar.gz
          curl -fsSLO https://github.com/gleam-lang/gleam/releases/download/v1.16.0/gleam-v1.16.0-x86_64-unknown-linux-musl.tar.gz.sha256
          sha256sum -c gleam-v1.16.0-x86_64-unknown-linux-musl.tar.gz.sha256
          sudo tar -xzf gleam-v1.16.0-x86_64-unknown-linux-musl.tar.gz -C /usr/local/bin gleam

      - name: Materialize locks and canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate-validation-schema-copies.py
          (cd schema && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
          (cd clients/ts && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
          (cd clients/rust && cargo generate-lockfile && cargo fmt)
          (cd clients/dart && dart pub get && dart format lib/src/clock.dart lib/src/schema test/clock_test.dart test/schema_ingest_test.dart)
          rm -rf clients/dart/.dart_tool clients/dart/pubspec.lock
          (cd clients/gleam && gleam deps download && gleam format src test)
          (cd clients/go && go mod tidy && gofmt -w .)
          python3 scripts/generate-validation-schema-copies.py --check
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore(validation): lock and format validator backends'
            git push origin HEAD:agent/validation-hardening-go-java
          fi

      - name: Export generated worktree before diagnostics
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=syncer.c \
            --exclude=node_modules \
            --exclude=target \
            --exclude=build \
            --exclude=.dart_tool \
            --exclude=.gleam \
            -czf "$RUNNER_TEMP/opto-sync-clients-generated.tar.gz" .

      - name: Upload generated worktree
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-hardening-generated-${{ github.sha }}
          path: ${{ runner.temp }}/opto-sync-clients-generated.tar.gz
          if-no-files-found: error
          retention-days: 2

      - name: Validate package and schema contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate-validation-schema-copies.py --check
          python3 scripts/check-dependency-boundary.py
          python3 scripts/check-package-layout.py --source-root .
          (cd schema && npm ci && npm test)

      - name: Validate TypeScript backends
        shell: bash
        run: |
          set -euo pipefail
          (cd syncer.c/bindings/typescript && npm ci)
          (cd clients/ts && npm ci && npm run build)
          (cd clients/ts && node --test test/schema-ingest.test.mjs test/clock.test.js)

      - name: Validate Rust backends
        working-directory: clients/rust
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo test --locked --all-features --test schema_ingest
          cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Validate Dart backends
        shell: bash
        run: |
          set -euo pipefail
          (cd syncer.c/core && cmake -S . -B build && cmake --build build --target syncer)
          cd clients/dart
          dart pub get
          dart analyze
          SYNCER_LIB_PATH="$GITHUB_WORKSPACE/syncer.c/core/build/libsyncer.so" \
            dart test test/schema_ingest_test.dart test/clock_test.dart

      - name: Validate Gleam backends
        shell: bash
        run: |
          set -euo pipefail
          (cd syncer.c/bindings/beam && mix local.hex --force && mix local.rebar --force && mix deps.get && mix compile)
          cd clients/gleam
          gleam deps download
          gleam format --check src test
          OPTO_SYNC_BEAM_EBIN=../../syncer.c/bindings/beam/_build/dev/lib/opto_sync_nif/ebin \
          OPTO_SYNC_ELIXIR_EBIN="$(elixir -e 'IO.puts(Path.join(:code.lib_dir(:elixir), "ebin"))')" \
            gleam test

      - name: Validate Go backends
        working-directory: clients/go
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go vet ./...
          go test ./...

      - name: Validate Java backends
        working-directory: clients/java
        run: mvn --batch-mode --no-transfer-progress test

      - name: Require a clean generated tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf clients/dart/.dart_tool clients/dart/pubspec.lock
          git diff --exit-code

      - name: Remove bootstrap workflow after successful diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/validation-worktree-export.yml
          git commit -m 'chore(validation): remove bootstrap workflow'
          git push origin HEAD:agent/validation-hardening-go-java

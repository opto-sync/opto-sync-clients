name: DEN-1623 materialize execution work budgets

on:
  push:
    branches:
      - agent/den-1623-execution-work-budgets
    paths:
      - '.github/workflows/den-1623-materialize.yml'

permissions:
  contents: write

concurrency:
  group: den-1623-materialize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout the DEN-1623 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1623-execution-work-budgets
          fetch-depth: 0
          persist-credentials: true

      - name: Install the repository's Nix toolchain
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Materialize, format, lint, and test execution budgets
        run: |
          set -euo pipefail
          python3 scripts/den-1623-materialize.py
          nix develop --command cargo fmt \
            --manifest-path tools/fmctl/Cargo.toml
          nix develop --command cargo clippy \
            --locked \
            --manifest-path tools/fmctl/Cargo.toml \
            --all-targets \
            --all-features \
            -- -D warnings
          nix develop --command cargo test \
            --locked \
            --manifest-path tools/fmctl/Cargo.toml \
            manifest::tests
          git diff --check

      - name: Commit the checked Rust implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/fmctl/src/manifest.rs
          git commit -m 'DEN-1623 bound execution and trace work'
          git push origin HEAD:agent/den-1623-execution-work-budgets

name: DEN-1631 materialize local policy runtime enforcement

on:
  push:
    branches:
      - agent/den-1631-enforce-local-resource-policy
    paths:
      - '.github/workflows/den-1631-materialize.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/den-1631-materialize.yml'
      - 'formal/RESOURCE_POLICY_RUNTIME.md'
      - 'scripts/den-1631-materialize.py'
      - 'tools/fmctl/src/lib.rs'
      - 'tools/fmctl/src/plan.rs'
      - 'tools/fmctl/src/runner.rs'

permissions:
  contents: write

concurrency:
  group: den-1631-materialize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout the DEN-1631 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1631-enforce-local-resource-policy
          fetch-depth: 0
          persist-credentials: true

      - name: Install the repository's Nix toolchain
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Materialize, format, lint, and test local policy enforcement
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/den-1631-materialize.py')
          source = path.read_text(encoding='utf-8')
          old = '''    use crate::manifest::LoadedManifest;\n'''
          new = '''    use crate::manifest::{LoadedManifest, MAX_TIMEOUT_SECONDS};\n    use crate::resource::ResourceProfileName;\n'''
          if source.count(old) != 1:
              raise SystemExit(f'expected one plan test import anchor, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          python3 scripts/den-1631-materialize.py
          nix develop --command cargo fmt \
            --manifest-path tools/fmctl/Cargo.toml
          nix develop --command cargo clippy \
            --locked \
            --manifest-path tools/fmctl/Cargo.toml \
            --all-targets \
            --all-features \
            -- -D warnings
          nix develop --command cargo test \
            --locked \
            --manifest-path tools/fmctl/Cargo.toml \
            plan::tests
          nix develop --command cargo test \
            --locked \
            --manifest-path tools/fmctl/Cargo.toml \
            runner::tests
          git diff --check

      - name: Commit only runtime policy implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/fmctl/src/lib.rs \
            tools/fmctl/src/plan.rs \
            tools/fmctl/src/runner.rs
          git commit -m 'DEN-1631 enforce local resource policy in plans and outcomes'
          git push origin HEAD:agent/den-1631-enforce-local-resource-policy

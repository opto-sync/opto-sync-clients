name: DEN-1071 apply exact Dart 3.12.2 desktop formatting

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/agent-den-1071-dart-3-12-2-format.yml'
      - 'clients/reactive-dart/lib/src/desktop_sync.dart'
      - 'clients/reactive-dart/tool/desktop_self_test.dart'

permissions:
  contents: write

concurrency:
  group: den-1071-dart-3-12-2-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format-validate-and-clean:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: '3.12.2'
      - name: Format and validate only the desktop Dart contract
        working-directory: clients/reactive-dart
        shell: bash
        run: |
          set -euo pipefail
          dart pub get
          dart format lib/src/desktop_sync.dart tool/desktop_self_test.dart
          dart format --output=none --set-exit-if-changed \
            lib/src/desktop_sync.dart tool/desktop_self_test.dart
          dart analyze
          dart run tool/desktop_self_test.dart
      - name: Commit the canonical desktop files and remove repair carriers
        shell: bash
        run: |
          set -euo pipefail

          # Dependency resolution is needed only to establish the package's
          # language version. Do not modify the reviewed dependency graph.
          if git ls-files --error-unmatch clients/reactive-dart/pubspec.lock >/dev/null 2>&1; then
            git restore --source=HEAD -- clients/reactive-dart/pubspec.lock
          else
            rm -f clients/reactive-dart/pubspec.lock
          fi

          git rm \
            .github/workflows/agent-den-1071-dart-3-12-2-format.yml \
            .github/workflows/agent-den-1071-dart-format-v2.yml

          changed="$(git status --short | cut -c4- | sort)"
          printf '%s\n' "$changed" | grep -Fx '.github/workflows/agent-den-1071-dart-3-12-2-format.yml'
          printf '%s\n' "$changed" | grep -Fx '.github/workflows/agent-den-1071-dart-format-v2.yml'
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/agent-den-1071-dart-3-12-2-format.yml|\
              .github/workflows/agent-den-1071-dart-format-v2.yml|\
              clients/reactive-dart/lib/src/desktop_sync.dart|\
              clients/reactive-dart/tool/desktop_self_test.dart)
                ;;
              *)
                echo "unexpected final change: $path" >&2
                exit 1
                ;;
            esac
          done <<< "$changed"

          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'style: apply Dart 3.12.2 desktop formatting'
          git push origin HEAD:${{ github.head_ref }}

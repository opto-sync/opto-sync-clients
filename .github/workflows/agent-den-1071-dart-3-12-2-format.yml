name: DEN-1071 apply exact Dart 3.12.2 package formatting

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/agent-den-1071-dart-3-12-2-format.yml'
      - 'clients/reactive-dart/lib/**'
      - 'clients/reactive-dart/tool/**'
      - 'clients/reactive-dart/pubspec.yaml'

permissions:
  contents: write

concurrency:
  group: den-1071-dart-3-12-2-format-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  format-validate-and-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: '3.12.2'
      - name: Apply the exact package-aware formatter used by permanent CI
        working-directory: clients/reactive-dart
        shell: bash
        run: |
          set -euo pipefail
          dart pub get
          dart format lib tool
          dart format --output=none --set-exit-if-changed lib tool
      - name: Commit only canonical Dart source formatting
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --short | cut -c4- | sort)"
          if [ -z "$changed" ]; then
            echo 'Dart package sources are already canonical.'
            exit 0
          fi
          while IFS= read -r path; do
            case "$path" in
              clients/reactive-dart/lib/*.dart|\
              clients/reactive-dart/lib/src/*.dart|\
              clients/reactive-dart/tool/*.dart)
                ;;
              *)
                echo "unexpected formatter change: $path" >&2
                exit 1
                ;;
            esac
          done <<< "$changed"
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add clients/reactive-dart/lib clients/reactive-dart/tool
          git commit -m 'style: apply Dart 3.12.2 reactive package formatting'
          git push origin HEAD:${{ github.head_ref }}

name: DEN-1628 format resource policy module

on:
  push:
    branches:
      - agent/den-1628-resource-policy-provenance
    paths:
      - '.github/workflows/den-1628-format.yml'

permissions:
  contents: write

concurrency:
  group: den-1628-format-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout the DEN-1628 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1628-resource-policy-provenance
          fetch-depth: 0
          persist-credentials: true

      - name: Install the repository's Nix toolchain
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Format and lint the resource-policy target
        run: |
          set -euo pipefail
          nix develop --command cargo fmt \
            --manifest-path tools/fmctl/Cargo.toml
          nix develop --command cargo clippy \
            --locked \
            --manifest-path tools/fmctl/Cargo.toml \
            --all-targets \
            --all-features \
            -- -D warnings
          nix develop --command cargo test \
            --locked \
            --manifest-path tools/fmctl/Cargo.toml \
            resource
          git diff --check

      - name: Commit only canonical formatting
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/fmctl/src/resource.rs tools/fmctl/src/bin/fm-resource-policy.rs tools/fmctl/tests/resource_policy.rs
          if git diff --cached --quiet; then
            printf 'resource-policy sources were already canonical\n'
            exit 0
          fi
          git commit -m 'DEN-1628 apply canonical Rust formatting'
          git push origin HEAD:agent/den-1628-resource-policy-provenance

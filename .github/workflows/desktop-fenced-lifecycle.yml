name: Desktop fenced lifecycle

on:
  pull_request:
    paths:
      - 'clients/desktop-rust/fenced-lifecycle/**'
      - '.github/workflows/desktop-fenced-lifecycle.yml'
  push:
    branches: [main]
    paths:
      - 'clients/desktop-rust/fenced-lifecycle/**'
      - '.github/workflows/desktop-fenced-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: recursive
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
        with:
          components: rustfmt,clippy
      - name: Format
        run: cargo fmt --manifest-path clients/desktop-rust/fenced-lifecycle/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path clients/desktop-rust/fenced-lifecycle/Cargo.toml --all-targets -- -D warnings
      - name: Test generation fencing over shared reducer
        run: cargo test --manifest-path clients/desktop-rust/fenced-lifecycle/Cargo.toml --all-targets

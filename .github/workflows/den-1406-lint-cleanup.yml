name: DEN-1406 remove capped-reader warning

on:
  push:
    branches:
      - agent/den-1406-bound-manifest-input
    paths:
      - '.github/workflows/den-1406-lint-cleanup.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout the DEN-1406 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1406-bound-manifest-input
          fetch-depth: 0
          persist-credentials: true

      - name: Install the repository's Nix toolchain
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Remove the unnecessary mutable binding and lint
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/fmctl/src/manifest.rs')
          source = path.read_text(encoding='utf-8')
          old = '    let mut file = fs::File::open(path).map_err(|error| FmError::io(path, error))?;\n'
          new = '    let file = fs::File::open(path).map_err(|error| FmError::io(path, error))?;\n'
          if source.count(old) != 1:
              raise SystemExit('expected one mutable manifest file binding')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          nix develop --command cargo fmt \
            --manifest-path tools/fmctl/Cargo.toml
          nix develop --command cargo clippy \
            --locked \
            --manifest-path tools/fmctl/Cargo.toml \
            --all-targets \
            --all-features \
            -- -D warnings
          nix develop --command cargo test \
            --locked \
            --manifest-path tools/fmctl/Cargo.toml \
            manifest::tests
          git diff --check

      - name: Commit the lint-clean capped reader
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/fmctl/src/manifest.rs
          git commit -m 'DEN-1406 keep capped manifest reader warning-free'
          git push origin "HEAD:${BRANCH}"

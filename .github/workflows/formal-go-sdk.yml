name: Formal Go adapter SDK

on:
  pull_request:
    paths:
      - '.github/workflows/formal-go-sdk.yml'
      - 'formal/ADAPTER_STREAM_PROTOCOL.md'
      - 'formal/adapter-stream-protocol.schema.json'
      - 'formal/protocol-fixtures/stream/**'
      - 'formal/sdk/go/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/formal-go-sdk.yml'
      - 'formal/ADAPTER_STREAM_PROTOCOL.md'
      - 'formal/adapter-stream-protocol.schema.json'
      - 'formal/protocol-fixtures/stream/**'
      - 'formal/sdk/go/**'
  schedule:
    - cron: '29 8 * * 5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: formal-go-sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Go framing, canonicalization, race, and golden transcripts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: false

      - name: Install Go from module contract
        uses: actions/setup-go@c0137caad775660c0844396c52da96e560aba63d # v6
        with:
          go-version-file: formal/sdk/go/go.mod
          cache: false

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l formal/sdk/go)"
          if [[ -n "$unformatted" ]]; then
            printf 'unformatted Go files:\n%s\n' "$unformatted" >&2
            exit 1
          fi

      - name: Test shared golden transcripts and protocol state
        working-directory: formal/sdk/go
        run: go test ./...

      - name: Detect data races
        working-directory: formal/sdk/go
        run: go test -race ./...

      - name: Vet SDK and reference adapter
        working-directory: formal/sdk/go
        run: go vet ./...

      - name: Build reference adapter
        working-directory: formal/sdk/go
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../../.formal-artifacts/go
          go build -trimpath -o ../../../.formal-artifacts/go/fm-go-reference ./cmd/fm-go-reference

      - name: Record protocol provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .formal-artifacts/go
          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'go=' && go version
            sha256sum \
              formal/ADAPTER_STREAM_PROTOCOL.md \
              formal/adapter-stream-protocol.schema.json \
              formal/protocol-fixtures/stream/valid/happy.jsonl \
              formal/protocol-fixtures/stream/valid/unsupported.jsonl \
              formal/protocol-fixtures/stream/invalid/duplicate-request-id.jsonl \
              formal/protocol-fixtures/stream/invalid/stale-generation.jsonl \
              formal/sdk/go/go.mod \
              formal/sdk/go/canonical.go \
              formal/sdk/go/protocol.go \
              formal/sdk/go/transcript.go \
              formal/sdk/go/server.go \
              formal/sdk/go/lease_machine.go
          } > .formal-artifacts/go/provenance.txt

      - name: Upload reference binary and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: formal-go-adapter-sdk
          path: .formal-artifacts/go/
          if-no-files-found: error
          retention-days: 14

  materialize-den-1694:
    name: Materialize and certify active-publication leases
    if: github.head_ref == 'agent/den-1694-cross-platform-publication-leases' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-1694-cross-platform-publication-leases
          fetch-depth: 0
          persist-credentials: true

      - name: Install repository Nix toolchain
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Execute the checked-in lease implementation and full Rust gate
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /- name: Add OS-backed publication leases and cleanup probes/ { found=1; next }
            found && /run: \|/ { capture=1; next }
            capture && /^      - name: Commit publication lease implementation/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/den-1694-materialize.yml > /tmp/den-1694-apply.sh
          test -s /tmp/den-1694-apply.sh

          python3 - <<'PY'
          from pathlib import Path

          script = Path('/tmp/den-1694-apply.sh')
          source = script.read_text(encoding='utf-8')
          old = 'use std::path::{Path, PathBuf};\\n'
          new = 'use std::path::PathBuf;\\n'
          if source.count(old) != 1:
              raise SystemExit('expected one generated unused Path import')
          script.write_text(source.replace(old, new, 1), encoding='utf-8')

          tests = Path('tools/fmctl/tests/report_publish.rs')
          source = tests.read_text(encoding='utf-8')
          old = '''        })
        .collect::<Vec<_>>();
    assert!(
        names.is_empty(),
'''
          new = '''        })
        .filter(|name| name != ".fm-report-publication-guard")
        .collect::<Vec<_>>();
    assert!(
        names.is_empty(),
'''
          if source.count(old) != 1:
              raise SystemExit('expected one partial-state name collection')
          tests.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

          bash -n /tmp/den-1694-apply.sh
          bash /tmp/den-1694-apply.sh

      - name: Commit only the tested production change
        env:
          BRANCH: agent/den-1694-cross-platform-publication-leases
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout origin/main -- .github/workflows/formal-go-sdk.yml
          rm -f \
            .github/workflows/den-1694-materialize.yml \
            .github/workflows/den-1694-pr-materializer.yml \
            .github/workflows/den-1694-pr-materializer-v2.yml
          git add \
            .github/workflows/formal-go-sdk.yml \
            .github/workflows/den-1694-materialize.yml \
            .github/workflows/den-1694-pr-materializer.yml \
            .github/workflows/den-1694-pr-materializer-v2.yml \
            tools/fmctl/Cargo.toml \
            tools/fmctl/Cargo.lock \
            tools/fmctl/src/report_publish.rs \
            tools/fmctl/tests/report_publish.rs \
            formal/ATOMIC_REPORT_PUBLICATION.md
          git commit -m 'DEN-1694 protect active report publications with OS leases'
          git push origin "HEAD:${BRANCH}"

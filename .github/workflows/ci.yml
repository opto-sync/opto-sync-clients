name: CI

# Runs the TypeScript, Dart, Rust, and Gleam client suites on Linux. Dart is
# tested twice: against native SQLite/FFI and in Chromium against IndexedDB/WASM.
#
# DEPENDENCY LAYOUT: syncer.c is a pinned git submodule at the repository root.
# Every client resolves its native path dependency through that exact gitlink:
#
#   opto-sync-clients/
#     syncer.c/       <- pinned commit, initialized by actions/checkout
#     clients/ts/     -> ../../syncer.c/bindings/{typescript,wasm}
#     clients/dart/   -> ../../syncer.c/bindings/dart
#     clients/rust/   -> ../../syncer.c/bindings/rust
#     clients/gleam/  -> ../../syncer.c/bindings/gleam
#
# This removes the former mutable sibling checkout of syncer.c@main: a client
# revision now names the exact reconciliation engine it was tested and packed
# with.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  packaging-contract:
    name: Gitlink and Zed package boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout opto-sync-clients and pinned core
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Verify source, gitlink, lock, and artifact layout contracts
        run: |
          set -euo pipefail
          python3 scripts/check-dependency-boundary.py
          python3 scripts/check-zed-packaging.py

  clients:
    name: clients/${{ matrix.client }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - client: ts
            node: true
          - client: dart
            dart: true
            core_shared_lib: true
          - client: rust
            rust: true
          - client: gleam
            gleam: true
    steps:
      - name: Checkout opto-sync-clients and pinned core
        uses: actions/checkout@v4
        with:
          path: opto-sync-clients
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Verify dependency and submodule boundary
        shell: bash
        run: |
          set -euo pipefail
          git -C opto-sync-clients submodule status --cached syncer.c
          test -f opto-sync-clients/syncer.c/core/include/syncer.h
          python3 opto-sync-clients/scripts/check-dependency-boundary.py

      - uses: actions/setup-node@v4
        if: matrix.client == 'ts' || matrix.client == 'dart'
        with:
          node-version: '22'
          # ~/.npm tarball cache only. node_modules and the compiled
          # build/Release/syncer.node are never cached, so the native addon is
          # always rebuilt from the pinned core C sources.
          cache: npm
          cache-dependency-path: opto-sync-clients/clients/ts/package-lock.json

      - uses: dart-lang/setup-dart@v1
        if: matrix.dart
        with:
          sdk: stable

      - name: Install pinned OTP and Elixir for Gleam
        if: matrix.gleam
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3'
          elixir-version: '1.18.4'

      - name: Install libsqlite3 (Drift/sqlite3 FFI)
        if: matrix.dart
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsqlite3-0

      - name: Cache cargo registry (downloads only, never target/)
        if: matrix.rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('opto-sync-clients/clients/rust/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-

      - name: Build syncer.c core shared library
        if: matrix.core_shared_lib
        working-directory: opto-sync-clients/syncer.c/core
        run: |
          mkdir -p build
          cd build
          cmake ..
          make syncer
          ls -l libsyncer.so

      # Local npm links do not install the linked package's own dependencies.
      - name: Install locked syncer.c TypeScript binding dependencies first
        if: matrix.client == 'ts' || matrix.client == 'dart'
        working-directory: opto-sync-clients/syncer.c/bindings/typescript
        run: npm ci

      - name: clients/ts — clean locked install
        if: matrix.client == 'ts' || matrix.client == 'dart'
        working-directory: opto-sync-clients/clients/ts
        run: npm ci

      - name: clients/ts — npm run build
        if: matrix.client == 'ts'
        working-directory: opto-sync-clients/clients/ts
        run: npm run build

      - name: clients/ts — npm test
        if: matrix.client == 'ts'
        working-directory: opto-sync-clients/clients/ts
        run: npm test

      - name: clients/dart — analyze and native SQLite/FFI tests
        if: matrix.client == 'dart'
        working-directory: opto-sync-clients/clients/dart
        env:
          SYNCER_LIB_PATH: ${{ github.workspace }}/opto-sync-clients/syncer.c/core/build/libsyncer.so
        run: |
          dart pub get
          dart analyze
          dart test

      - name: Install Chromium for Dart IndexedDB/WASM test
        if: matrix.client == 'dart'
        working-directory: opto-sync-clients/clients/ts
        run: npx playwright install --with-deps chromium

      - name: clients/dart — real Chromium IndexedDB/WASM test
        if: matrix.client == 'dart'
        working-directory: opto-sync-clients/clients/dart
        run: node tool/web_e2e.mjs

      - name: clients/rust — formatting
        if: matrix.client == 'rust'
        working-directory: opto-sync-clients/clients/rust
        run: cargo fmt --check

      - name: clients/rust — default SQLite tests
        if: matrix.client == 'rust'
        working-directory: opto-sync-clients/clients/rust
        run: cargo test --locked --all-targets

      - name: clients/rust — core-only tests
        if: matrix.client == 'rust'
        working-directory: opto-sync-clients/clients/rust
        run: cargo test --locked --no-default-features --all-targets

      - name: clients/rust — Clippy with all features
        if: matrix.client == 'rust'
        working-directory: opto-sync-clients/clients/rust
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Install Gleam/BEAM toolchain
        if: matrix.client == 'gleam'
        run: |
          curl -fsSLO https://github.com/gleam-lang/gleam/releases/download/v1.16.0/gleam-v1.16.0-x86_64-unknown-linux-musl.tar.gz
          curl -fsSLO https://github.com/gleam-lang/gleam/releases/download/v1.16.0/gleam-v1.16.0-x86_64-unknown-linux-musl.tar.gz.sha256
          sha256sum -c gleam-v1.16.0-x86_64-unknown-linux-musl.tar.gz.sha256
          sudo tar -xzf gleam-v1.16.0-x86_64-unknown-linux-musl.tar.gz -C /usr/local/bin gleam

      - name: Build the BEAM reconciliation NIF for Gleam
        if: matrix.client == 'gleam'
        working-directory: opto-sync-clients/syncer.c/bindings/beam
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix compile

      - name: clients/gleam — protocol and native reconciliation tests
        if: matrix.client == 'gleam'
        working-directory: opto-sync-clients/clients/gleam
        env:
          OPTO_SYNC_BEAM_EBIN: ../../syncer.c/bindings/beam/_build/dev/lib/opto_sync_nif/ebin
        run: |
          gleam deps download
          gleam format --check src test
          OPTO_SYNC_ELIXIR_EBIN="$(
            elixir -e 'IO.puts(Path.join(:code.lib_dir(:elixir), "ebin"))'
          )" gleam test

      - name: Which suite broke
        if: failure()
        run: |
          echo "::error title=opto-sync-clients clients/${{ matrix.client }} FAILED::The ${{ matrix.client }} client suite broke. Reproduce from a recursive clone so the pinned syncer.c submodule is initialized, then see the README Building section."

name: CI

# Runs TypeScript, Dart, Rust, and Gleam client suites on Linux. Every client
# path-depends on a sibling syncer.c checkout, so ordinary CI pins one exact
# compatible engine commit; workflow_dispatch may override it deliberately.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      syncer_ref:
        description: 'Optional syncer.c ref for forward-compatibility testing'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SYNCER_C_REF: 94324ecb8a4e1e05b07d6723e57433fe30ebc820

jobs:
  packaging-contract:
    name: Zed packaging boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout opto-sync-clients
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate whole-repository package and target safety
        run: python3 scripts/check-zed-packaging.py

  clients:
    name: clients/${{ matrix.client }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - client: ts
          - client: dart
            dart: true
            core_shared_lib: true
          - client: rust
            rust: true
          - client: gleam
            gleam: true
    steps:
      - name: Checkout opto-sync-clients
        uses: actions/checkout@v4
        with:
          path: opto-sync-clients
          persist-credentials: false

      - name: Checkout syncer.c (pinned sibling dependency)
        uses: actions/checkout@v4
        with:
          repository: opto-sync/syncer.c
          ref: ${{ github.event.inputs.syncer_ref || env.SYNCER_C_REF }}
          path: syncer.c
          persist-credentials: false

      - uses: actions/setup-node@v4
        if: matrix.client == 'ts' || matrix.client == 'dart'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: opto-sync-clients/clients/ts/package-lock.json

      - uses: dart-lang/setup-dart@v1
        if: matrix.dart
        with:
          sdk: stable

      - name: Install pinned OTP and Elixir for Gleam
        if: matrix.gleam
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3'
          elixir-version: '1.18.4'

      - name: Install libsqlite3 (Drift/sqlite3 FFI)
        if: matrix.dart
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsqlite3-0

      - name: Cache cargo registry (downloads only, never target/)
        if: matrix.rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('opto-sync-clients/clients/rust/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-

      - name: Build syncer.c core shared library
        if: matrix.core_shared_lib
        working-directory: syncer.c/core
        run: |
          mkdir -p build
          cd build
          cmake ..
          make syncer
          ls -l libsyncer.so

      - name: Install locked syncer.c TypeScript binding dependencies first
        if: matrix.client == 'ts' || matrix.client == 'dart'
        working-directory: syncer.c/bindings/typescript
        run: npm ci

      - name: clients/ts — clean locked install
        if: matrix.client == 'ts' || matrix.client == 'dart'
        working-directory: opto-sync-clients/clients/ts
        run: npm ci

      - name: clients/ts — build and test
        if: matrix.client == 'ts'
        working-directory: opto-sync-clients/clients/ts
        run: |
          npm run build
          npm test

      - name: clients/dart — analyze and native SQLite/FFI tests
        if: matrix.client == 'dart'
        working-directory: opto-sync-clients/clients/dart
        env:
          SYNCER_LIB_PATH: ${{ github.workspace }}/syncer.c/core/build/libsyncer.so
        run: |
          dart pub get
          dart analyze
          dart test

      - name: Install Chromium for Dart IndexedDB/WASM test
        if: matrix.client == 'dart'
        working-directory: opto-sync-clients/clients/ts
        run: npx playwright install --with-deps chromium

      - name: clients/dart — real Chromium IndexedDB/WASM test
        if: matrix.client == 'dart'
        working-directory: opto-sync-clients/clients/dart
        run: node tool/web_e2e.mjs

      - name: clients/rust — SQLite, core-only, format, and lint
        if: matrix.client == 'rust'
        working-directory: opto-sync-clients/clients/rust
        run: |
          cargo fmt --check
          cargo test --all-targets
          cargo test --no-default-features --all-targets
          cargo clippy --all-targets --all-features -- -D warnings

      - name: Install Gleam/BEAM toolchain
        if: matrix.client == 'gleam'
        run: |
          curl -fsSLO https://github.com/gleam-lang/gleam/releases/download/v1.16.0/gleam-v1.16.0-x86_64-unknown-linux-musl.tar.gz
          curl -fsSLO https://github.com/gleam-lang/gleam/releases/download/v1.16.0/gleam-v1.16.0-x86_64-unknown-linux-musl.tar.gz.sha256
          sha256sum -c gleam-v1.16.0-x86_64-unknown-linux-musl.tar.gz.sha256
          sudo tar -xzf gleam-v1.16.0-x86_64-unknown-linux-musl.tar.gz -C /usr/local/bin gleam

      - name: Build the BEAM reconciliation NIF for Gleam
        if: matrix.client == 'gleam'
        working-directory: syncer.c/bindings/beam
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix compile

      - name: clients/gleam — protocol and native reconciliation tests
        if: matrix.client == 'gleam'
        working-directory: opto-sync-clients/clients/gleam
        env:
          OPTO_SYNC_BEAM_EBIN: ../../../syncer.c/bindings/beam/_build/dev/lib/opto_sync_nif/ebin
        run: |
          gleam deps download
          gleam format --check src test
          OPTO_SYNC_ELIXIR_EBIN="$(
            elixir -e 'IO.puts(Path.join(:code.lib_dir(:elixir), "ebin"))'
          )" gleam test

      - name: Which suite broke
        if: failure()
        run: |
          echo "::error title=opto-sync-clients clients/${{ matrix.client }} FAILED::The ${{ matrix.client }} client library suite broke. Reproduce with syncer.c checked out as a sibling."

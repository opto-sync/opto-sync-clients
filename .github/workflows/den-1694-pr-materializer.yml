name: DEN-1694 run lease materializer from pull request

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/den-1694-pr-materializer.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1694-cross-platform-publication-leases
          fetch-depth: 0
          persist-credentials: true

      - name: Install repository Nix toolchain
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Execute the checked-in lease materializer
        run: |
          set -euo pipefail
          awk '
            /- name: Add OS-backed publication leases and cleanup probes/ { found=1; next }
            found && /run: \|/ { capture=1; next }
            capture && /^      - name: Commit publication lease implementation/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/den-1694-materialize.yml > /tmp/den-1694-apply.sh
          test -s /tmp/den-1694-apply.sh
          bash -n /tmp/den-1694-apply.sh
          bash /tmp/den-1694-apply.sh

      - name: Commit the tested implementation
        env:
          BRANCH: agent/den-1694-cross-platform-publication-leases
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/fmctl/Cargo.toml \
            tools/fmctl/Cargo.lock \
            tools/fmctl/src/report_publish.rs \
            tools/fmctl/tests/report_publish.rs \
            formal/ATOMIC_REPORT_PUBLICATION.md
          git commit -m 'DEN-1694 protect active report publications with OS leases'
          git push origin "HEAD:${BRANCH}"

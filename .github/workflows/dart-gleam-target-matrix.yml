name: Dart Flutter and Gleam BEAM clean-room targets

on:
  pull_request:
    paths:
      - 'clients/dart/**'
      - 'clients/gleam/**'
      - 'schema/fixtures/**'
      - 'syncer.c'
      - 'targets/layouts.v1.json'
      - 'scripts/check-dart-target.py'
      - 'scripts/check-gleam-target.py'
      - 'scripts/stage-dart-target.py'
      - 'scripts/stage-gleam-target.py'
      - 'docs/DART_ZED_TARGET.md'
      - 'docs/GLEAM_ZED_TARGET.md'
      - '.github/workflows/dart-gleam-target-matrix.yml'
  push:
    branches: [main]
    paths:
      - 'clients/dart/**'
      - 'clients/gleam/**'
      - 'schema/fixtures/**'
      - 'syncer.c'
      - 'targets/layouts.v1.json'
      - 'scripts/check-dart-target.py'
      - 'scripts/check-gleam-target.py'
      - 'scripts/stage-dart-target.py'
      - 'scripts/stage-gleam-target.py'
      - 'docs/DART_ZED_TARGET.md'
      - 'docs/GLEAM_ZED_TARGET.md'
      - '.github/workflows/dart-gleam-target-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dart-gleam-targets-${{ github.ref }}
  cancel-in-progress: true

env:
  ZED_CLI_SHA: d8763b8dcc3bd5c5b6b4b1d13519065a6a2cb99a

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout clients and exact core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Install Python with TOML and safe-extraction support
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Stage and validate both isolated targets
        working-directory: source
        run: |
          set -euo pipefail
          python3 scripts/check-target-layouts.py
          python3 scripts/stage-dart-target.py "$RUNNER_TEMP/dart-target"
          python3 scripts/stage-gleam-target.py "$RUNNER_TEMP/gleam-target"

      - name: Prove second-core identities fail closed
        shell: bash
        run: |
          set -euo pipefail
          for target in dart gleam; do
            release="$RUNNER_TEMP/$target-target/release-set.json"
            cp "$release" "$RUNNER_TEMP/$target-release-set.json"
            python3 - "$release" <<'PY'
          import json, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          value = json.loads(path.read_text(encoding="utf-8"))
          value["syncerSourceSha"] = "0" * 40
          path.write_text(json.dumps(value, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
            if python3 "$RUNNER_TEMP/$target-target/scripts/check-$target-target.py" "$RUNNER_TEMP/$target-target"; then
              echo "::error title=two-core preflight failed open::$target accepted a mismatched core"
              exit 1
            fi
            mv "$RUNNER_TEMP/$target-release-set.json" "$release"
            python3 "$RUNNER_TEMP/$target-target/scripts/check-$target-target.py" "$RUNNER_TEMP/$target-target"
          done

      - name: Checkout pinned Zed CLI
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: zed-pkg/zed-cli
          ref: ${{ env.ZED_CLI_SHA }}
          path: zed-cli
          persist-credentials: false

      - name: Build pinned Zed CLI
        run: cargo build --locked --release --manifest-path zed-cli/Cargo.toml --bin zed

      - name: Validate, double-pack, and audit both targets
        shell: bash
        run: |
          set -euo pipefail
          zed="$GITHUB_WORKSPACE/zed-cli/target/release/zed"
          for target in dart gleam; do
            stage="$RUNNER_TEMP/$target-target"
            first="$RUNNER_TEMP/$target-pack-one"
            second="$RUNNER_TEMP/$target-pack-two"
            mkdir -p "$first" "$second"
            (cd "$stage" && "$zed" validate --require-lock --json)
            (cd "$stage" && "$zed" pack --out "$first")
            (cd "$stage" && "$zed" pack --out "$second")
            archive="$(find "$first" -maxdepth 1 -type f -name '*.tar.gz' -printf '%f\n')"
            test -n "$archive"
            test -f "$second/$archive"
            cmp "$first/$archive" "$second/$archive"
            sha256sum "$first/$archive" "$second/$archive"
            tar -tzf "$first/$archive" | sort > "$RUNNER_TEMP/$target-target-files.txt"
            if grep -Eq '(^|/)(\.git|\.github|\.zed)(/|$)|/(node_modules|target|build|_build|deps|\.dart_tool|\.tmp)(/|$)' "$RUNNER_TEMP/$target-target-files.txt"; then
              echo "::error title=$target target leaked generated or VCS state"
              exit 1
            fi
            forbidden='dart|ts|rust'
            if [ "$target" = dart ]; then forbidden='gleam|ts|rust'; fi
            if grep -Eq "^pkg/clients/($forbidden)(/|$)" "$RUNNER_TEMP/$target-target-files.txt"; then
              echo "::error title=$target target leaked another client"
              exit 1
            fi
          done

      - name: Upload exact target archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opto-sync-dart-and-gleam-targets
          path: |
            ${{ runner.temp }}/dart-pack-one/*.tar.gz
            ${{ runner.temp }}/gleam-pack-one/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  dart-consumer:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            library: libsyncer.so
            mobile: android
            browser: true
          - os: macos-14
            library: libsyncer.dylib
            mobile: ios
            browser: false
          - os: windows-2022
            library: Release/syncer.dll
            mobile: none
            browser: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Install Python with TOML and safe-extraction support
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Download both packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: opto-sync-dart-and-gleam-targets
          path: ${{ runner.temp }}/packages

      - name: Extract the exact Dart package without Git metadata
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find "$RUNNER_TEMP/packages" -type f -name '*dart*.tar.gz')"
          extracted="$RUNNER_TEMP/dart-target-extracted"
          mkdir -p "$extracted"
          python3 - "$archive" "$extracted" <<'PY'
          import sys, tarfile
          with tarfile.open(sys.argv[1], "r:gz") as package:
              package.extractall(sys.argv[2], filter="data")
          PY
          test ! -e "$extracted/pkg/.git"
          python3 "$extracted/pkg/scripts/check-dart-target.py" "$extracted/pkg"
          echo "EXTRACTED_TARGET=$extracted/pkg" >> "$GITHUB_ENV"

      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: '3.12.1'

      - name: Build and test the bundled C core
        shell: bash
        run: |
          set -euo pipefail
          cmake -S "$EXTRACTED_TARGET/syncer.c/core" -B "$EXTRACTED_TARGET/syncer.c/core/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$EXTRACTED_TARGET/syncer.c/core/build" --config Release
          ctest --test-dir "$EXTRACTED_TARGET/syncer.c/core/build" -C Release --output-on-failure

      - name: Run the extracted native Dart suite
        shell: bash
        env:
          SYNCER_LIB_PATH: ${{ env.EXTRACTED_TARGET }}/syncer.c/core/build/${{ matrix.library }}
        run: |
          set -euo pipefail
          cd "$EXTRACTED_TARGET/clients/dart"
          dart pub get
          dart format --output=none --set-exit-if-changed lib test tool
          dart analyze
          dart test

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: matrix.browser
        with:
          node-version: '22'

      - name: Run the extracted real-Chromium IndexedDB and WASM suite
        if: matrix.browser
        shell: bash
        run: |
          set -euo pipefail
          cd "$EXTRACTED_TARGET"
          npm install --no-save playwright@1.62.0
          npx playwright install --with-deps chromium
          cd clients/dart
          node tool/web_e2e.mjs

      - name: Install pinned Flutter for the explicit mobile consumer
        if: matrix.mobile != 'none'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Create the blank Flutter mobile consumer
        if: matrix.mobile != 'none'
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/opto_sync_flutter_consumer"
          flutter create --platforms=${{ matrix.mobile }} "$app"
          python3 - "$EXTRACTED_TARGET/clients/dart" "$app" <<'PY'
          import json, pathlib, sys
          dependency = pathlib.Path(sys.argv[1]).resolve().as_posix()
          app = pathlib.Path(sys.argv[2])
          (app / "pubspec.yaml").write_text(
              "name: opto_sync_clean_room\n"
              "publish_to: none\n"
              "version: 0.0.0+1\n"
              "environment:\n  sdk: ^3.12.1\n"
              "dependencies:\n"
              "  flutter:\n    sdk: flutter\n"
              f"  opto_sync_client:\n    path: {json.dumps(dependency)}\n"
              "dev_dependencies:\n"
              "  flutter_test:\n    sdk: flutter\n",
              encoding="utf-8",
          )
          (app / "lib/main.dart").write_text(
              "import 'package:flutter/widgets.dart';\n"
              "import 'package:opto_sync_client/opto_sync_client.dart';\n"
              "void main() {\n"
              "  final pending = defaultMaxPendingMutations.toString();\n"
              "  runApp(Directionality(textDirection: TextDirection.ltr, child: Text(pending)));\n"
              "}\n",
              encoding="utf-8",
          )
          # The generated template's lint include and widget test describe the
          # deleted template application, not this clean-room consumer.
          (app / "analysis_options.yaml").unlink(missing_ok=True)
          (app / "test/widget_test.dart").unlink(missing_ok=True)
          PY
          cd "$app"
          flutter pub get
          flutter analyze
          if [ "${{ matrix.mobile }}" = android ]; then
            flutter build apk --debug
          else
            flutter build ios --simulator --no-codesign
          fi

  gleam-consumer:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Install Python with TOML and safe-extraction support
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Download both packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: opto-sync-dart-and-gleam-targets
          path: ${{ runner.temp }}/packages

      - name: Extract the exact Gleam package without Git metadata
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find "$RUNNER_TEMP/packages" -type f -name '*gleam*.tar.gz')"
          extracted="$RUNNER_TEMP/gleam-target-extracted"
          mkdir -p "$extracted"
          python3 - "$archive" "$extracted" <<'PY'
          import sys, tarfile
          with tarfile.open(sys.argv[1], "r:gz") as package:
              package.extractall(sys.argv[2], filter="data")
          PY
          test ! -e "$extracted/pkg/.git"
          python3 "$extracted/pkg/scripts/check-gleam-target.py" "$extracted/pkg"
          echo "EXTRACTED_TARGET=$extracted/pkg" >> "$GITHUB_ENV"

      - name: Install pinned OTP, Elixir, and Gleam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: '27.3'
          elixir-version: '1.18.4'
          gleam-version: '1.16.0'

      - name: Install pinned Rust toolchain for the Rustler NIF
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.91.0'

      - name: Build the bundled NIF and prove exact core identity
        shell: bash
        run: |
          set -euo pipefail
          cd "$EXTRACTED_TARGET/syncer.c/bindings/beam"
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix compile
          mix run "$EXTRACTED_TARGET/smoke/core_identity.exs"

      - name: Run the extracted Gleam suite
        shell: bash
        run: |
          set -euo pipefail
          cd "$EXTRACTED_TARGET/clients/gleam"
          gleam deps download
          gleam format --check src test
          OPTO_SYNC_BEAM_EBIN="$EXTRACTED_TARGET/syncer.c/bindings/beam/_build/dev/lib/opto_sync_nif/ebin" \
          OPTO_SYNC_ELIXIR_EBIN="$(elixir -e 'IO.puts(Path.join(:code.lib_dir(:elixir), "ebin"))')" \
            gleam test

      - name: Prove dependency locks stayed byte-identical
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$EXTRACTED_TARGET" <<'PY'
          import pathlib, shutil, sys

          root = pathlib.Path(sys.argv[1]).resolve()
          for relative in (
              "clients/gleam/build",
              "syncer.c/bindings/beam/_build",
              "syncer.c/bindings/beam/deps",
          ):
              generated = (root / relative).resolve()
              if root not in generated.parents:
                  raise SystemExit(f"refusing to clean outside target: {generated}")
              shutil.rmtree(generated, ignore_errors=True)
          PY
          python3 "$EXTRACTED_TARGET/scripts/check-gleam-target.py" "$EXTRACTED_TARGET"

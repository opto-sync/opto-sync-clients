name: DEN-587 Gleam format oracle

on:
  pull_request:
    branches:
      - agent/den-587-test-format-validation-base

permissions:
  contents: read

concurrency:
  group: den-587-format-oracle-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  canonical-format:
    if: github.head_ref == 'agent/den-587-test-format-materializer'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install repository-pinned Gleam
        run: |
          set -euo pipefail
          curl -fsSLO https://github.com/gleam-lang/gleam/releases/download/v1.16.0/gleam-v1.16.0-x86_64-unknown-linux-musl.tar.gz
          curl -fsSLO https://github.com/gleam-lang/gleam/releases/download/v1.16.0/gleam-v1.16.0-x86_64-unknown-linux-musl.tar.gz.sha256
          sha256sum -c gleam-v1.16.0-x86_64-unknown-linux-musl.tar.gz.sha256
          sudo tar -xzf gleam-v1.16.0-x86_64-unknown-linux-musl.tar.gz -C /usr/local/bin gleam

      - name: Print canonical product file
        working-directory: clients/gleam
        run: |
          set -euo pipefail
          gleam format test/opto_sync_formal_adapter_test.gleam
          gleam format --check test/opto_sync_formal_adapter_test.gleam
          echo 'DEN587_FORMATTED_BASE64_BEGIN'
          base64 -w0 test/opto_sync_formal_adapter_test.gleam
          echo
          echo 'DEN587_FORMATTED_BASE64_END'

name: DEN-1657 apply canonical publisher formatting

on:
  push:
    branches:
      - agent/den-1657-atomic-report-publisher
    paths:
      - '.github/workflows/den-1657-format.yml'

permissions:
  contents: write

concurrency:
  group: den-1657-format-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out publisher branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1657-atomic-report-publisher
          fetch-depth: 0
          persist-credentials: true

      - name: Install repository Nix toolchain
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Format and test publisher core
        run: |
          set -euo pipefail
          nix develop --command cargo fmt \
            --manifest-path tools/fmctl/Cargo.toml
          nix develop --command cargo clippy \
            --locked \
            --manifest-path tools/fmctl/Cargo.toml \
            --all-targets \
            --all-features \
            -- -D warnings
          nix develop --command cargo test \
            --locked \
            --manifest-path tools/fmctl/Cargo.toml \
            --test report_bundle \
            --test report_publish
          git diff --check

      - name: Commit canonical formatting
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/fmctl/src/report_publish.rs \
            tools/fmctl/src/result.rs \
            tools/fmctl/tests/report_publish.rs
          if git diff --cached --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git commit -m 'DEN-1657 apply canonical publisher formatting'
          git push origin "HEAD:${BRANCH}"

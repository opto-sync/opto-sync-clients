name: DEN-1406 cap manifest reads during growth races

on:
  push:
    branches:
      - agent/den-1406-bound-manifest-input
    paths:
      - '.github/workflows/den-1406-capped-read-materialize.yml'

permissions:
  contents: write

concurrency:
  group: den-1406-capped-read-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout the DEN-1406 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1406-bound-manifest-input
          fetch-depth: 0
          persist-credentials: true

      - name: Install the repository's Nix toolchain
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Replace full-file allocation with a capped read
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/fmctl/src/manifest.rs')
          source = path.read_text(encoding='utf-8')
          replacements = [
              (
                  'use std::fs;\nuse std::path::{Component, Path, PathBuf};\n',
                  'use std::fs;\nuse std::io::Read;\nuse std::path::{Component, Path, PathBuf};\n',
              ),
              (
                  '''    let source = fs::read(path).map_err(|error| FmError::io(path, error))?;
              validate_bounded_file_size(label, path, reported_bytes, source.len(), maximum)?;
              String::from_utf8(source).map_err(|error| {
          ''',
                  '''    let mut file = fs::File::open(path).map_err(|error| FmError::io(path, error))?;
              let read_limit = u64::try_from(maximum)
                  .unwrap_or(u64::MAX)
                  .saturating_add(1);
              let mut source = Vec::with_capacity(reported_bytes.min(maximum));
              file.take(read_limit)
                  .read_to_end(&mut source)
                  .map_err(|error| FmError::io(path, error))?;
              validate_bounded_file_size(label, path, reported_bytes, source.len(), maximum)?;
              String::from_utf8(source).map_err(|error| {
          ''',
              ),
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f'expected one exact manifest replacement: {old[:80]!r}')
              source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')

          doc = Path('formal/RESOURCE_LIMITS.md')
          source = doc.read_text(encoding='utf-8')
          old = '''4. reads bytes rather than an unbounded UTF-8 string;
          5. checks the actual byte count again after reading, closing a growth race; and
          6. validates UTF-8 before TOML parsing.
          '''
          new = '''4. opens the file and reads at most the ceiling plus one sentinel byte;
          5. checks the actual byte count again after the capped read, detecting growth without unbounded allocation; and
          6. validates UTF-8 before TOML parsing.
          '''
          if source.count(old) != 1:
              raise SystemExit('expected one resource-limit documentation block')
          doc.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

          nix develop --command cargo fmt \
            --manifest-path tools/fmctl/Cargo.toml
          nix develop --command cargo test \
            --locked \
            --manifest-path tools/fmctl/Cargo.toml \
            manifest::tests
          git diff --check

      - name: Commit the capped manifest read
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/fmctl/src/manifest.rs formal/RESOURCE_LIMITS.md
          git commit -m 'DEN-1406 cap manifest reads during file growth'
          git push origin "HEAD:${BRANCH}"

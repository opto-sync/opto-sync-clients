name: DEN-1694 branch workflow diagnostic

on:
  push:
    branches:
      - agent/den-1694-cross-platform-publication-leases
    paths:
      - '.github/workflows/den-1694-main-materializer.yml'

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact push
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Commit scheduling marker
        env:
          BRANCH: agent/den-1694-cross-platform-publication-leases
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'workflow=%s\nsha=%s\n' "$GITHUB_WORKFLOW" "$EXPECTED_SHA" > .den-1694-workflow-ran
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .den-1694-workflow-ran
          git commit -m 'DEN-1694 confirm branch workflow scheduling'
          git push origin "HEAD:${BRANCH}"

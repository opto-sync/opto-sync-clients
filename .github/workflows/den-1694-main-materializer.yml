name: DEN-1694 exact-branch lease materializer

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: den-1694-main-materializer-pr-63
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.event.issue.number == 63 &&
      github.event.issue.pull_request &&
      github.actor == 'ORESoftware' &&
      github.event.comment.user.login == 'ORESoftware' &&
      github.event.comment.body == '/materialize-den-1694'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Resolve and verify the exact same-repository PR head
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_API_URL: ${{ github.event.issue.pull_request.url }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_BRANCH: agent/den-1694-cross-platform-publication-leases
        run: |
          set -euo pipefail
          response="$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$PR_API_URL")"
          head_repository="$(jq -er '.head.repo.full_name' <<<"$response")"
          head_branch="$(jq -er '.head.ref' <<<"$response")"
          head_sha="$(jq -er '.head.sha' <<<"$response")"
          test "$head_repository" = "$EXPECTED_REPOSITORY"
          test "$head_branch" = "$EXPECTED_BRANCH"
          test "${#head_sha}" -eq 40
          printf 'head_sha=%s\n' "$head_sha" >> "$GITHUB_OUTPUT"

      - name: Check out the immutable feature head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install repository Nix toolchain
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Materialize and certify publication leases
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ steps.pr.outputs.head_sha }}'
          awk '
            /- name: Add OS-backed publication leases and cleanup probes/ { found=1; next }
            found && /run: \|/ { capture=1; next }
            capture && /^      - name: Commit publication lease implementation/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/den-1694-materialize.yml > /tmp/den-1694-apply.sh
          test -s /tmp/den-1694-apply.sh

          python3 - <<'PY'
          from pathlib import Path

          script = Path('/tmp/den-1694-apply.sh')
          source = script.read_text(encoding='utf-8')
          old = 'use std::path::{Path, PathBuf};\\n'
          new = 'use std::path::PathBuf;\\n'
          if source.count(old) != 1:
              raise SystemExit('expected one generated unused Path import')
          script.write_text(source.replace(old, new, 1), encoding='utf-8')

          tests = Path('tools/fmctl/tests/report_publish.rs')
          source = tests.read_text(encoding='utf-8')
          old = '''        })
        .collect::<Vec<_>>();
    assert!(
        names.is_empty(),
'''
          new = '''        })
        .filter(|name| name != ".fm-report-publication-guard")
        .collect::<Vec<_>>();
    assert!(
        names.is_empty(),
'''
          if source.count(old) != 1:
              raise SystemExit('expected one partial-state name collection')
          tests.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

          bash -n /tmp/den-1694-apply.sh
          bash /tmp/den-1694-apply.sh

      - name: Commit only tested production code, tests, lockfile, and docs
        env:
          BRANCH: agent/den-1694-cross-platform-publication-leases
          EXPECTED_SHA: ${{ steps.pr.outputs.head_sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          remote_sha="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          test "$remote_sha" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout origin/main -- \
            .github/workflows/formal-go-sdk.yml \
            .github/workflows/den-1694-main-materializer.yml
          rm -f \
            .github/workflows/den-1694-materialize.yml \
            .github/workflows/den-1694-pr-materializer.yml \
            .github/workflows/den-1694-pr-materializer-v2.yml \
            .den-1694-trigger
          git add -A
          git commit -m 'DEN-1694 protect active report publications with OS leases'
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:${BRANCH}"

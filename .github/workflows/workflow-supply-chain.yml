name: Workflow supply-chain contract

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/check-workflow-supply-chain.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/check-workflow-supply-chain.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Reject moving actions, refs, and persisted checkout credentials
        run: python3 scripts/check-workflow-supply-chain.py

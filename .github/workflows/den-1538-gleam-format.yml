name: DEN-1538 apply pinned Gleam formatting

on:
  push:
    branches:
      - agent/den-1538-polyglot-capabilities
    paths:
      - '.github/workflows/den-1538-gleam-format.yml'
      - 'formal/sdk/gleam/**'

concurrency:
  group: den-1538-gleam-format-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'opto-sync/opto-sync-clients'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout the branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1538-polyglot-capabilities
          fetch-depth: 0

      - name: Install pinned Gleam compiler
        run: |
          set -euo pipefail
          curl -fsSLO https://github.com/gleam-lang/gleam/releases/download/v1.16.0/gleam-v1.16.0-x86_64-unknown-linux-musl.tar.gz
          curl -fsSLO https://github.com/gleam-lang/gleam/releases/download/v1.16.0/gleam-v1.16.0-x86_64-unknown-linux-musl.tar.gz.sha256
          sha256sum -c gleam-v1.16.0-x86_64-unknown-linux-musl.tar.gz.sha256
          sudo tar -xzf gleam-v1.16.0-x86_64-unknown-linux-musl.tar.gz -C /usr/local/bin gleam

      - name: Apply and commit Gleam formatter output
        run: |
          set -euo pipefail
          gleam format formal/sdk/gleam/src formal/sdk/gleam/test
          if git diff --quiet -- formal/sdk/gleam; then
            echo 'Gleam sources are already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add formal/sdk/gleam
          git commit -m 'DEN-1538 apply Gleam 1.16.0 formatting'
          git push origin HEAD:agent/den-1538-polyglot-capabilities

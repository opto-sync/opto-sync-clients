name: DEN-1071 canonical source formatting repair

on:
  push:
    branches:
      - agent/den-1071-desktop-background-sync
    paths:
      - '.github/workflows/agent-den-1071-dart-format.yml'

permissions:
  contents: write

concurrency:
  group: den-1071-source-format-repair
  cancel-in-progress: false

jobs:
  format-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/den-1071-desktop-background-sync
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: stable
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Canonically format the Dart desktop contract
        working-directory: clients/reactive-dart
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/src/desktop_sync.dart tool/desktop_self_test.dart
          dart format --output=none --set-exit-if-changed lib/src/desktop_sync.dart tool/desktop_self_test.dart
      - name: Canonically format the existing Rust replay adapter
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2021 clients/rust/examples/quint_itf_replay.rs
          cargo fmt --manifest-path clients/rust/Cargo.toml -- --check
      - name: Commit only the bounded formatting delta and remove the repair workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/agent-den-1071-dart-format.yml
          changed="$(git status --short | cut -c4- | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/agent-den-1071-dart-format.yml' \
            'clients/reactive-dart/lib/src/desktop_sync.dart' \
            'clients/reactive-dart/tool/desktop_self_test.dart' \
            'clients/rust/examples/quint_itf_replay.rs' | sort)"
          test "$changed" = "$expected" || {
            echo 'unexpected final change set:' >&2
            printf '%s\n' "$changed" >&2
            exit 1
          }
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'style: canonically format DEN-1071 and replay sources'
          git push origin HEAD:agent/den-1071-desktop-background-sync

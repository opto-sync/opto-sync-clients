name: DEN-587 materialize projection format

on:
  push:
    branches:
      - alexanderdmills/den-587-gleam-itf-adapter
    paths:
      - 'clients/gleam/src/opto_sync_formal_projection.gleam'
      - '.github/workflows/materialize-den-587-projection-format.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: den-587-projection-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.repository == 'opto-sync/opto-sync-clients'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Gleam formatter
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: '27.3.4'
          gleam-version: '1.16.0'

      - name: Apply and verify canonical formatter output
        run: |
          set -euo pipefail
          gleam format clients/gleam/src/opto_sync_formal_projection.gleam
          gleam format --check clients/gleam/src/opto_sync_formal_projection.gleam
          rm .github/workflows/materialize-den-587-projection-format.yml

      - name: Commit only the formatted projection and remove the oracle
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git add -A -- \
            .github/workflows/materialize-den-587-projection-format.yml \
            clients/gleam/src/opto_sync_formal_projection.gleam
          changed="$(git diff --cached --name-only)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(.github/workflows/materialize-den-587-projection-format.yml|clients/gleam/src/opto_sync_formal_projection.gleam)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "unexpected formatted paths:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          if git diff --cached --quiet; then
            echo 'formatter produced no materialized change' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'DEN-587 apply canonical Gleam projection formatting'
          git push origin "HEAD:${BRANCH_NAME}"

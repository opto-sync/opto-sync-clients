name: DEN-4179 Dart formatter probe

on:
  pull_request:
    paths:
      - '.github/workflows/den-4179-dart-format-probe.yml'
      - 'clients/dart/test/ws_cleartext_host_policy_test.dart'

permissions:
  contents: read

jobs:
  exact-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          show-progress: false
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: '3.12.1'
      - name: Print the exact formatter delta
        shell: bash
        run: |
          set -euo pipefail
          file=clients/dart/test/ws_cleartext_host_policy_test.dart
          before=$(sha256sum "$file" | awk '{print $1}')
          dart format "$file"
          after=$(sha256sum "$file" | awk '{print $1}')
          printf 'before=%s\nafter=%s\n' "$before" "$after"
          git --no-pager diff -- "$file"
          test "$before" != "$after"

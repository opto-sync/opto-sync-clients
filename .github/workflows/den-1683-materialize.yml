name: DEN-1683 materialize portable report bundle IDs

on:
  push:
    branches:
      - agent/den-1683-portable-bundle-ids
    paths:
      - '.github/workflows/den-1683-materialize.yml'

permissions:
  contents: write

concurrency:
  group: den-1683-materialize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    # This one-shot branch workflow is removed after it commits the reviewed source/test diff.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out portable-ID branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1683-portable-bundle-ids
          fetch-depth: 0
          persist-credentials: true

      - name: Install repository Nix toolchain
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Implement and exhaust portable bundle-ID validation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          publisher = Path('tools/fmctl/src/report_publish.rs')
          source = publisher.read_text(encoding='utf-8')
          source = source.replace(
              'const MAX_BUNDLE_ID_BYTES: usize = 128;\n',
              'pub const MAX_REPORT_BUNDLE_ID_BYTES: usize = 128;\n',
              1,
          ).replace(
              '    validate_bundle_id(bundle_id)?;\n',
              '    validate_report_bundle_id(bundle_id)?;\n',
              1,
          )
          start = source.index('fn validate_bundle_id(bundle_id: &str) -> Result<(), FmError> {\n')
          replacement = '''pub fn validate_report_bundle_id(bundle_id: &str) -> Result<(), FmError> {
              if bundle_id.is_empty() || bundle_id.len() > MAX_REPORT_BUNDLE_ID_BYTES {
                  return invalid_bundle_id(bundle_id);
              }

              let reserved_basename = bundle_id.split('.').next().unwrap_or(bundle_id);
              if is_windows_device_basename(reserved_basename) {
                  return Err(FmError::Validation(format!(
                      "report bundle id uses a reserved Windows device basename: {bundle_id:?}"
                  )));
              }

              let bytes = bundle_id.as_bytes();
              let first = bytes[0];
              let last = bytes[bytes.len() - 1];
              if !is_lower_ascii_alphanumeric(first)
                  || !is_lower_ascii_alphanumeric(last)
                  || !bytes.iter().copied().all(|byte| {
                      is_lower_ascii_alphanumeric(byte) || matches!(byte, b'-' | b'_')
                  })
              {
                  return invalid_bundle_id(bundle_id);
              }
              Ok(())
          }

          fn is_lower_ascii_alphanumeric(byte: u8) -> bool {
              byte.is_ascii_lowercase() || byte.is_ascii_digit()
          }

          fn is_windows_device_basename(value: &str) -> bool {
              if value.eq_ignore_ascii_case("con")
                  || value.eq_ignore_ascii_case("prn")
                  || value.eq_ignore_ascii_case("aux")
                  || value.eq_ignore_ascii_case("nul")
                  || value.eq_ignore_ascii_case("clock$")
              {
                  return true;
              }
              let bytes = value.as_bytes();
              if bytes.len() != 4 || !matches!(bytes[3], b'1'..=b'9') {
                  return false;
              }
              bytes[..3].eq_ignore_ascii_case(b"com") || bytes[..3].eq_ignore_ascii_case(b"lpt")
          }

          fn invalid_bundle_id<T>(bundle_id: &str) -> Result<T, FmError> {
              Err(FmError::Validation(format!(
                  "invalid report bundle id {bundle_id:?}; use 1..={MAX_REPORT_BUNDLE_ID_BYTES} lower-case ASCII alphanumeric bytes with interior '-' or '_' only"
              )))
          }
          '''
          source = source[:start] + replacement
          publisher.write_text(source, encoding='utf-8')

          tests = Path('tools/fmctl/tests/report_bundle_id.rs')
          tests.write_text('''use fmctl::result::publish::{
              validate_report_bundle_id, MAX_REPORT_BUNDLE_ID_BYTES,
          };

          #[test]
          fn accepts_canonical_portable_identifiers() {
              for value in [
                  "a",
                  "0",
                  "verify-001",
                  "check_7f20c8f6",
                  "sha256-1f1d4f61e6ab",
              ] {
                  validate_report_bundle_id(value).unwrap_or_else(|error| {
                      panic!("canonical id {value:?} was rejected: {error}")
                  });
              }
              let maximum = format!("a{}z", "b".repeat(MAX_REPORT_BUNDLE_ID_BYTES - 2));
              assert_eq!(maximum.len(), MAX_REPORT_BUNDLE_ID_BYTES);
              validate_report_bundle_id(&maximum).expect("maximum-length canonical id");
          }

          #[test]
          fn rejects_length_case_punctuation_separator_control_and_unicode_aliases() {
              let too_long = format!("a{}z", "b".repeat(MAX_REPORT_BUNDLE_ID_BYTES - 1));
              let invalid = [
                  "",
                  ".",
                  "..",
                  "Verify-001",
                  "VERIFY-001",
                  "verify.001",
                  "verify ",
                  " verify",
                  "verify-",
                  "verify_",
                  "-verify",
                  "_verify",
                  "slash/value",
                  "back\\\\value",
                  "control\\n",
                  "café",
                  &too_long,
              ];
              for value in invalid {
                  assert!(
                      validate_report_bundle_id(value).is_err(),
                      "nonportable id was accepted: {value:?}"
                  );
              }
          }

          #[test]
          fn rejects_every_windows_device_basename_and_extension_form() {
              let mut reserved = vec![
                  "con".to_owned(),
                  "prn".to_owned(),
                  "aux".to_owned(),
                  "nul".to_owned(),
                  "clock$".to_owned(),
                  "CON".to_owned(),
                  "con.json".to_owned(),
              ];
              for prefix in ["com", "lpt"] {
                  for digit in 1..=9 {
                      reserved.push(format!("{prefix}{digit}"));
                      reserved.push(format!("{prefix}{digit}.json"));
                  }
              }
              for value in reserved {
                  let error = validate_report_bundle_id(&value)
                      .expect_err("reserved device name must fail");
                  assert!(
                      error.to_string().contains("reserved Windows device basename"),
                      "unexpected error for {value:?}: {error}"
                  );
              }
          }

          #[test]
          fn nearby_nondevice_names_remain_valid() {
              for value in [
                  "console",
                  "con-1",
                  "prn1",
                  "auxiliary",
                  "null",
                  "com0",
                  "com10",
                  "lpt0",
                  "lpt10",
                  "clock",
              ] {
                  validate_report_bundle_id(value).unwrap_or_else(|error| {
                      panic!("nearby portable id {value:?} was rejected: {error}")
                  });
              }
          }
          ''', encoding='utf-8')

          doc = Path('formal/ATOMIC_REPORT_PUBLICATION.md')
          source = doc.read_text(encoding='utf-8')
          source = source.replace(
              '1. Validate a caller-supplied bundle identifier against a narrow ASCII grammar.\n',
              '1. Validate a caller-supplied bundle identifier against the portable canonical grammar in `PORTABLE_REPORT_BUNDLE_IDS.md`, including case-alias and Windows device-name rejection.\n',
              1,
          )
          doc.write_text(source, encoding='utf-8')
          PY

          nix develop --command cargo fmt \
            --manifest-path tools/fmctl/Cargo.toml
          nix develop --command cargo clippy \
            --locked \
            --manifest-path tools/fmctl/Cargo.toml \
            --all-targets \
            --all-features \
            -- -D warnings
          nix develop --command cargo test \
            --locked \
            --manifest-path tools/fmctl/Cargo.toml \
            --test report_bundle_id \
            --test report_publish
          git diff --check

      - name: Commit portable-ID implementation
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            formal/ATOMIC_REPORT_PUBLICATION.md \
            tools/fmctl/src/report_publish.rs \
            tools/fmctl/tests/report_bundle_id.rs
          git commit -m 'DEN-1683 enforce portable report bundle IDs'
          git push origin "HEAD:${BRANCH}"

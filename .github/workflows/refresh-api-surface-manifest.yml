name: Refresh API surface manifest evidence

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - '.github/workflows/refresh-api-surface-manifest.yml'
      - 'clients/.api-surface.sha256'

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'automation/nightly-client-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: automation/nightly-client-hardening

      - name: Replace all stale manifest fingerprints under an exact-count guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('clients/contract-manifest.json')
          old = '09b49c4edf62be1aacefa10f64ecb0fd2d59c6c0cdb441cb481753f9c4cefa2b'
          new = '49fe9b15202a8d1ab3e1193df837d922fdcda9c486846cb2debdb7096e0adbf7'
          text = path.read_text()
          count = text.count(old)
          if count != 21:
              raise SystemExit(f'expected exactly 21 stale fingerprints, found {count}')
          updated = text.replace(old, new)
          parsed = json.loads(updated)
          if parsed['apiSurfaceSha256'] != new:
              raise SystemExit('root API-surface digest was not updated')
          if len(parsed['targets']) != 20:
              raise SystemExit(f"expected 20 targets, found {len(parsed['targets'])}")
          stale_targets = [item['target'] for item in parsed['targets'] if item['apiSurfaceSha256'] != new]
          if stale_targets:
              raise SystemExit('stale target fingerprints: ' + ', '.join(stale_targets))
          path.write_text(updated)
          PY
          git diff --check

      - name: Commit corrected generated evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'opto-sync automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add clients/contract-manifest.json
          git commit -m 'fix(ci): refresh API surface fingerprints in contract manifest'
          git push origin HEAD:automation/nightly-client-hardening

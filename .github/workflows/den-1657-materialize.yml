name: DEN-1657 sanitize and certify atomic report publisher

on:
  push:
    branches:
      - agent/den-1657-atomic-report-publisher
    paths:
      - '.github/workflows/den-1657-materialize.yml'

permissions:
  contents: write

concurrency:
  group: den-1657-materialize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out publisher branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1657-atomic-report-publisher
          fetch-depth: 0
          persist-credentials: true

      - name: Install repository Nix toolchain
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Materialize sanitized public result and adversarial tests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          publisher = Path('tools/fmctl/src/report_publish.rs')
          source = publisher.read_text(encoding='utf-8')
          source = source.replace(
              'use crate::runner::CommandOutcome;\n\nuse super::{\n    render_artifact_manifest_json, render_junit_xml, render_provenance_json, render_sarif_json,\n};\n',
              'use crate::resource::EffectiveResourcePolicy;\nuse crate::runner::CommandOutcome;\n\nuse super::{\n    render_artifact_manifest_json, render_junit_xml, render_provenance_json, render_sarif_json,\n    report_status, ArtifactEntry, ReportStatus,\n};\n',
              1,
          )
          marker = '''#[derive(Debug, Clone, Copy, PartialEq, Eq, Default)]
          pub struct CleanupReport {
              pub staging_directories_removed: usize,
              pub reservations_removed: usize,
          }

          '''
          addition = marker + '''#[derive(Debug, Serialize)]
          #[serde(rename_all = "snake_case")]
          struct PublishedResult<'a> {
              schema: &'static str,
              schema_version: u32,
              project: &'a str,
              model: &'a str,
              operation: &'a str,
              status: ReportStatus,
              command: PublishedCommand,
              result: PublishedResultEvidence,
              artifacts: Vec<ArtifactEntry>,
              resource_policy: &'a EffectiveResourcePolicy,
          }

          #[derive(Debug, Serialize)]
          #[serde(rename_all = "snake_case")]
          struct PublishedCommand {
              program: String,
              argument_count: usize,
          }

          #[derive(Debug, Serialize)]
          #[serde(rename_all = "snake_case")]
          struct PublishedResultEvidence {
              success: bool,
              timed_out: bool,
              exit_code: Option<i32>,
              duration_millis: u64,
              stdout_truncated: bool,
              stderr_truncated: bool,
          }

          '''
          if source.count(marker) != 1:
              raise SystemExit('expected one CleanupReport block')
          source = source.replace(marker, addition, 1)
          old = '    let result_json = serde_json::to_vec_pretty(outcome)?;\n'
          new = '    let result_json = render_public_result_json(outcome)?;\n'
          if source.count(old) != 1:
              raise SystemExit('expected one raw outcome serialization')
          source = source.replace(old, new, 1)

          marker = 'fn invoke_hook<F>(hook: &mut F, step: PublishStep) -> Result<(), FmError>\n'
          helpers = '''fn render_public_result_json(outcome: &CommandOutcome) -> Result<Vec<u8>, FmError> {
              let result = PublishedResult {
                  schema: "fm.result.v1",
                  schema_version: 1,
                  project: &outcome.project,
                  model: &outcome.model,
                  operation: &outcome.operation,
                  status: report_status(outcome),
                  command: PublishedCommand {
                      program: sanitized_program_name(&outcome.program),
                      argument_count: outcome.args.len(),
                  },
                  result: PublishedResultEvidence {
                      success: outcome.success,
                      timed_out: outcome.timed_out,
                      exit_code: outcome.exit_code,
                      duration_millis: outcome.duration_millis,
                      stdout_truncated: outcome.stdout_truncated,
                      stderr_truncated: outcome.stderr_truncated,
                  },
                  artifacts: public_artifacts(outcome),
                  resource_policy: &outcome.resource_policy,
              };
              Ok(serde_json::to_vec_pretty(&result)?)
          }

          fn public_artifacts(outcome: &CommandOutcome) -> Vec<ArtifactEntry> {
              let mut artifacts = vec![
                  ArtifactEntry {
                      kind: "result".to_owned(),
                      path: artifact_basename(&outcome.artifacts.result),
                  },
                  ArtifactEntry {
                      kind: "stderr".to_owned(),
                      path: artifact_basename(&outcome.artifacts.stderr),
                  },
                  ArtifactEntry {
                      kind: "stdout".to_owned(),
                      path: artifact_basename(&outcome.artifacts.stdout),
                  },
              ];
              if let Some(path) = &outcome.artifacts.trace_pattern {
                  artifacts.push(ArtifactEntry {
                      kind: "trace_pattern".to_owned(),
                      path: artifact_basename(path),
                  });
              }
              artifacts.sort_by(|left, right| left.kind.cmp(&right.kind));
              artifacts
          }

          fn artifact_basename(path: &Path) -> PathBuf {
              path.file_name()
                  .map(PathBuf::from)
                  .unwrap_or_else(|| PathBuf::from("artifact"))
          }

          fn sanitized_program_name(program: &str) -> String {
              Path::new(program)
                  .file_name()
                  .and_then(|name| name.to_str())
                  .unwrap_or("program")
                  .to_owned()
          }

          '''
          if source.count(marker) != 1:
              raise SystemExit('expected one invoke_hook marker')
          publisher.write_text(source.replace(marker, helpers + marker, 1), encoding='utf-8')

          tests = Path('tools/fmctl/tests/report_publish.rs')
          source = tests.read_text(encoding='utf-8')
          source = source.replace(
              'use tempfile::TempDir;\n\n',
              'use tempfile::TempDir;\n\nconst SECRET: &str = "publisher-must-not-leak-this";\n\n',
              1,
          )
          old = '''    let result: serde_json::Value =
                  serde_json::from_slice(&fs::read(&published.result).expect("result bytes"))
                      .expect("result JSON");
              assert_eq!(result["operation"], "verify");
          '''
          new = '''    let result: serde_json::Value =
                  serde_json::from_slice(&fs::read(&published.result).expect("result bytes"))
                      .expect("result JSON");
              assert_eq!(result["schema"], "fm.result.v1");
              assert_eq!(result["operation"], "verify");
              assert_eq!(result["command"]["program"], "npx");
              assert_eq!(result["command"]["argument_count"], 3);
              for path in [
                  &published.result,
                  &published.junit,
                  &published.sarif,
                  &published.artifact_manifest,
                  &published.provenance,
              ] {
                  let text = String::from_utf8(fs::read(path).expect("published report bytes"))
                      .expect("published report UTF-8");
                  assert!(!text.contains(SECRET), "{} leaked the fixture secret", path.display());
                  assert!(!text.contains("captured stdout"));
                  assert!(!text.contains("captured stderr"));
                  assert!(!text.contains("internal failure"));
              }
          '''
          if source.count(old) != 1:
              raise SystemExit('expected one published result assertion block')
          source = source.replace(old, new, 1)
          source = source.replace(
              'args: vec!["--yes".to_owned(), "quint".to_owned()],',
              'args: vec!["--yes".to_owned(), format!("--token={SECRET}"), "quint".to_owned()],',
              1,
          ).replace(
              'stdout: String::new(),\n        stderr: String::new(),',
              'stdout: format!("captured stdout {SECRET}"),\n        stderr: format!("captured stderr {SECRET}"),',
              1,
          ).replace(
              'failure: None,',
              'failure: Some(format!("internal failure {SECRET}")),',
              1,
          ).replace(
              'stdout: PathBuf::from(".formal-artifacts/stdout.log"),',
              'stdout: PathBuf::from(format!("/tmp/{SECRET}/stdout.log")),',
              1,
          ).replace(
              'stderr: PathBuf::from(".formal-artifacts/stderr.log"),',
              'stderr: PathBuf::from(format!("/tmp/{SECRET}/stderr.log")),',
              1,
          ).replace(
              'result: PathBuf::from(".formal-artifacts/result.json"),',
              'result: PathBuf::from(format!("/tmp/{SECRET}/result.json")),',
              1,
          ).replace(
              'trace_pattern: Some(PathBuf::from(".formal-artifacts/trace-{seq}.json")),',
              'trace_pattern: Some(PathBuf::from(format!("/tmp/{SECRET}/trace-{{seq}}.json"))),',
              1,
          )
          tests.write_text(source, encoding='utf-8')
          PY

          nix develop --command cargo fmt \
            --manifest-path tools/fmctl/Cargo.toml
          nix develop --command cargo clippy \
            --locked \
            --manifest-path tools/fmctl/Cargo.toml \
            --all-targets \
            --all-features \
            -- -D warnings
          nix develop --command cargo test \
            --locked \
            --manifest-path tools/fmctl/Cargo.toml \
            --test report_bundle \
            --test report_publish
          git diff --check

      - name: Commit certified publisher core
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/fmctl/src/report_publish.rs tools/fmctl/tests/report_publish.rs
          git commit -m 'DEN-1657 sanitize and certify atomic report publication'
          git push origin "HEAD:${BRANCH}"

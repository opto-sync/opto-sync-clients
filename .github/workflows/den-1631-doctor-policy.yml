name: DEN-1631 keep doctor probes policy-consistent

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/den-1631-doctor-policy.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1631-enforce-local-resource-policy
          fetch-depth: 0
          persist-credentials: true

      - name: Install repository Nix toolchain
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Resolve a probe-specific policy envelope and run all targets
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/fmctl/src/lib.rs')
          source = path.read_text(encoding='utf-8')
          old = 'use crate::plan::{build_plan, CommandPlan, Operation, ReplayRequest};\n'
          new = old + 'use crate::resource::ResourceProfile;\n'
          if source.count(old) != 1:
              raise SystemExit('expected one plan import')
          source = source.replace(old, new, 1)

          old = '''    plan.stdin = None;
              plan.timeout_seconds = plan.timeout_seconds.clamp(1, 120);
              plan.max_output_bytes = plan.max_output_bytes.clamp(1024, 64 * 1024);
              plan.artifacts.stdout = artifact_root.join(format!("doctor-{name}.stdout.log"));
          '''
          new = '''    plan.stdin = None;
              let probe_timeout = plan.timeout_seconds.clamp(1, 120);
              let probe_output = plan.max_output_bytes.clamp(1024, 64 * 1024);
              let mut request = plan.resource_policy.requested.clone();
              request.timeout_seconds = Some(probe_timeout);
              request.max_output_bytes = Some(u64::try_from(probe_output).unwrap_or(u64::MAX));
              let probe_policy = match ResourceProfile::local_v1().resolve(request) {
                  Ok(policy) => policy,
                  Err(error) => {
                      return ToolProbe {
                          name: name.to_owned(),
                          command,
                          available: false,
                          exit_code: None,
                          stdout: String::new(),
                          stderr: format!("failed to resolve doctor resource policy: {error}"),
                      };
                  }
              };
              let probe_output = match usize::try_from(
                  probe_policy.effective.scalar.max_output_bytes,
              ) {
                  Ok(value) => value,
                  Err(_) => {
                      return ToolProbe {
                          name: name.to_owned(),
                          command,
                          available: false,
                          exit_code: None,
                          stdout: String::new(),
                          stderr: "doctor output policy exceeds usize".to_owned(),
                      };
                  }
              };
              plan.timeout_seconds = probe_policy.effective.scalar.timeout_seconds;
              plan.max_output_bytes = probe_output;
              plan.resource_policy = probe_policy;
              plan.artifacts.stdout = artifact_root.join(format!("doctor-{name}.stdout.log"));
          '''
          if source.count(old) != 1:
              raise SystemExit('expected one doctor plan limit block')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

          nix develop --command cargo fmt \
            --manifest-path tools/fmctl/Cargo.toml
          nix develop --command cargo clippy \
            --locked \
            --manifest-path tools/fmctl/Cargo.toml \
            --all-targets \
            --all-features \
            -- -D warnings
          nix develop --command cargo test \
            --locked \
            --manifest-path tools/fmctl/Cargo.toml \
            --all-targets \
            --all-features
          git diff --check

      - name: Commit only the permanent doctor fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/fmctl/src/lib.rs
          git commit -m 'DEN-1631 keep doctor probes resource-policy consistent'
          git push origin HEAD:agent/den-1631-enforce-local-resource-policy

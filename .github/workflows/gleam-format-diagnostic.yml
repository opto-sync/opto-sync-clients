name: Gleam format diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/gleam-format-diagnostic.yml'
      - 'clients/gleam/src/opto_sync_formal_adapter.gleam'
      - 'clients/gleam/test/opto_sync_formal_adapter_test.gleam'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned Gleam formatter
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: '27.3.4'
          gleam-version: '1.16.0'

      - name: Print exact formatter diff
        working-directory: clients/gleam
        shell: bash
        run: |
          set -euo pipefail
          gleam format
          git diff -- \
            src/opto_sync_formal_adapter.gleam \
            test/opto_sync_formal_adapter_test.gleam
          git diff --exit-code -- \
            src/opto_sync_formal_adapter.gleam \
            test/opto_sync_formal_adapter_test.gleam

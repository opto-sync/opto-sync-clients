name: competitive sync parity

on:
  pull_request:
    paths:
      - 'conformance/competitive-sync-parity.v1.json'
      - 'conformance/check-competitive-sync-parity.mjs'
      - 'docs/COMPETITIVE_SYNC_PARITY.md'
      - '.github/workflows/competitive-sync-parity.yml'
  push:
    branches: [main]
    paths:
      - 'conformance/competitive-sync-parity.v1.json'
      - 'conformance/check-competitive-sync-parity.mjs'
      - 'docs/COMPETITIVE_SYNC_PARITY.md'

permissions:
  contents: read

jobs:
  parity-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: node conformance/check-competitive-sync-parity.mjs

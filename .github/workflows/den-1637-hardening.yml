name: DEN-1637 harden report privacy and utility inputs

on:
  push:
    branches:
      - agent/den-1637-report-bundle
    paths:
      - '.github/workflows/den-1637-hardening.yml'

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out report branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1637-report-bundle
          fetch-depth: 0
          persist-credentials: true

      - name: Install repository Nix toolchain
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Apply privacy hardening and adversarial tests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          report = Path('tools/fmctl/src/report.rs')
          source = report.read_text(encoding='utf-8')
          replacements = [
              (
                  '    let failures = usize::from(status != ReportStatus::Passed);\n',
                  '    let failures = if status == ReportStatus::Passed { 0 } else { 1 };\n',
              ),
              (
                  '                    "version": env!("CARGO_PKG_VERSION"),\n                    "informationUri": "https://github.com/opto-sync/opto-sync-clients"\n',
                  '                    "version": env!("CARGO_PKG_VERSION")\n',
              ),
              (
                  '            path: artifacts.result.clone(),\n',
                  '            path: report_artifact_path(&artifacts.result),\n',
              ),
              (
                  '            path: artifacts.stderr.clone(),\n',
                  '            path: report_artifact_path(&artifacts.stderr),\n',
              ),
              (
                  '            path: artifacts.stdout.clone(),\n',
                  '            path: report_artifact_path(&artifacts.stdout),\n',
              ),
              (
                  '            path: path.clone(),\n',
                  '            path: report_artifact_path(path),\n',
              ),
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f'expected one report replacement: {old!r}')
              source = source.replace(old, new, 1)
          marker = 'fn resource_properties(\n'
          helper = '''fn report_artifact_path(path: &Path) -> PathBuf {
              path.file_name()
                  .map(PathBuf::from)
                  .unwrap_or_else(|| PathBuf::from("artifact"))
          }

          '''
          if source.count(marker) != 1:
              raise SystemExit('expected one resource_properties marker')
          source = source.replace(marker, helper + marker, 1)
          report.write_text(source, encoding='utf-8')

          tests = Path('tools/fmctl/tests/report_bundle.rs')
          source = tests.read_text(encoding='utf-8')
          old = '''    assert_eq!(bundle.provenance.command.argument_count, 3);
              assert!(bundle.provenance.input_hashes.is_empty());
          }
          '''
          new = '''    assert_eq!(bundle.provenance.command.argument_count, 3);
              assert!(bundle.provenance.input_hashes.is_empty());
              let paths = bundle
                  .artifact_manifest
                  .artifacts
                  .iter()
                  .map(|artifact| artifact.path.as_path())
                  .collect::<Vec<_>>();
              assert_eq!(
                  paths,
                  [
                      PathBuf::from("result.json"),
                      PathBuf::from("stderr.log"),
                      PathBuf::from("stdout.log"),
                      PathBuf::from("trace-{seq}.json"),
                  ]
              );
          }
          '''
          if source.count(old) != 1:
              raise SystemExit('expected one artifact assertion block')
          source = source.replace(old, new, 1)

          marker = 'fn trim_newline(bytes: &[u8]) -> Vec<u8> {\n'
          additions = '''#[test]
          fn report_utility_rejects_directory_invalid_json_and_oversized_input() {
              let directory = TempDir::new().expect("tempdir");

              let directory_result = Command::new(env!("CARGO_BIN_EXE_fm-report-bundle"))
                  .arg(directory.path())
                  .output()
                  .expect("run utility with directory");
              assert!(!directory_result.status.success());
              assert!(directory_result.stdout.is_empty());
              assert!(String::from_utf8_lossy(&directory_result.stderr).contains("regular file"));

              let invalid = directory.path().join("invalid.json");
              fs::write(&invalid, b"{} trailing").expect("write invalid JSON");
              let invalid_result = Command::new(env!("CARGO_BIN_EXE_fm-report-bundle"))
                  .arg(&invalid)
                  .output()
                  .expect("run utility with invalid JSON");
              assert!(!invalid_result.status.success());
              assert!(invalid_result.stdout.is_empty());

              let oversized = directory.path().join("oversized.json");
              let file = fs::File::create(&oversized).expect("create sparse oversized input");
              file.set_len(64 * 1024 * 1024 + 1)
                  .expect("size sparse oversized input");
              let oversized_result = Command::new(env!("CARGO_BIN_EXE_fm-report-bundle"))
                  .arg(&oversized)
                  .output()
                  .expect("run utility with oversized input");
              assert!(!oversized_result.status.success());
              assert!(oversized_result.stdout.is_empty());
              assert!(String::from_utf8_lossy(&oversized_result.stderr).contains("exceeds"));
          }

          '''
          if source.count(marker) != 1:
              raise SystemExit('expected one trim_newline marker')
          source = source.replace(marker, additions + marker, 1)

          source = source.replace(
              'stdout: PathBuf::from(".formal-artifacts/stdout.log"),',
              'stdout: PathBuf::from(format!("/tmp/{SECRET}/stdout.log")),',
          ).replace(
              'stderr: PathBuf::from(".formal-artifacts/stderr.log"),',
              'stderr: PathBuf::from(format!("/tmp/{SECRET}/stderr.log")),',
          ).replace(
              'result: PathBuf::from(".formal-artifacts/result.json"),',
              'result: PathBuf::from(format!("/tmp/{SECRET}/result.json")),',
          ).replace(
              'trace_pattern: Some(PathBuf::from(".formal-artifacts/trace-{seq}.json")),',
              'trace_pattern: Some(PathBuf::from(format!("/tmp/{SECRET}/trace-{{seq}}.json"))),',
          )
          tests.write_text(source, encoding='utf-8')

          doc = Path('formal/REPORT_BUNDLE_V1.md')
          source = doc.read_text(encoding='utf-8')
          source = source.replace(
              '3. **Artifact manifest JSON** — operation identity, status, sorted artifact paths,\n   and the exact resource-policy envelope.\n',
              '3. **Artifact manifest JSON** — operation identity, status, sorted artifact basenames,\n   and the exact resource-policy envelope. Absolute runner/user directories are removed.\n',
          ).replace(
              '- generated trace payloads.\n',
              '- generated trace payloads; and\n- absolute artifact directory prefixes.\n',
          )
          doc.write_text(source, encoding='utf-8')
          PY

          nix develop --command cargo fmt \
            --manifest-path tools/fmctl/Cargo.toml
          nix develop --command cargo clippy \
            --locked \
            --manifest-path tools/fmctl/Cargo.toml \
            --all-targets \
            --all-features \
            -- -D warnings
          nix develop --command cargo test \
            --locked \
            --manifest-path tools/fmctl/Cargo.toml \
            --test report_bundle
          git diff --check

      - name: Commit hardening
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            formal/REPORT_BUNDLE_V1.md \
            tools/fmctl/src/report.rs \
            tools/fmctl/tests/report_bundle.rs
          git commit -m 'DEN-1637 harden report privacy and bounded inputs'
          git push origin "HEAD:${BRANCH}"

name: DEN-817 normalize reactive clients

on:
  push:
    branches:
      - fix/den-817-supabase-reactive-auth-reconnect
    paths:
      - '.github/workflows/den-817-normalize.yml'

permissions:
  contents: read

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Dart
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: '3.13.3'

      - name: Install contract generator dependencies
        run: >-
          python3 -m pip install --disable-pip-version-check
          jsonschema==4.25.1 tomlkit==0.13.3

      - name: Verify exact normalized outputs
        run: |
          set -euo pipefail
          (cd clients/reactive-dart && dart pub get && dart format --output=none --set-exit-if-changed lib tool)
          python3 scripts/harden_client_contract.py \
            --root . \
            --schema clients/client-api.schema.json \
            --org opto-sync \
            --repo opto-sync-clients \
            --prefix opto-sync \
            --check
          git diff --exit-code -- \
            clients/reactive-dart/lib/src/live_hints.dart \
            clients/reactive-dart/tool/supabase_auth_reconnect_self_test.dart \
            clients/contract-manifest.json

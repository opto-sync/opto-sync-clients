name: DEN-817 normalize reactive clients

on:
  push:
    branches:
      - fix/den-817-supabase-reactive-auth-reconnect
    paths:
      - '.github/workflows/den-817-normalize.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true

      - name: Install Dart
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: '3.13.3'

      - name: Install contract generator dependencies
        run: >-
          python3 -m pip install --disable-pip-version-check
          jsonschema==4.25.1 tomlkit==0.13.3

      - name: Normalize and commit exact generated outputs
        run: |
          set -euo pipefail
          (cd clients/reactive-dart && dart pub get && dart format lib tool)
          python3 scripts/harden_client_contract.py \
            --root . \
            --schema clients/client-api.schema.json \
            --org opto-sync \
            --repo opto-sync-clients \
            --prefix opto-sync \
            --write
          git add -- \
            clients/reactive-dart/lib/src/live_hints.dart \
            clients/reactive-dart/tool/supabase_auth_reconnect_self_test.dart \
            clients/contract-manifest.json
          if git diff --cached --quiet; then
            echo 'No normalization changes remain.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'normalize-supabase-reactive-contracts'
          git push origin "HEAD:${GITHUB_REF_NAME}"

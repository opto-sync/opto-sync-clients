name: DEN-817 one-shot reactive CI repair

on:
  push:
    branches:
      - agent/background-reactive-sync

permissions:
  contents: write

concurrency:
  group: den-817-reactive-ci-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/background-reactive-sync
      - uses: dart-lang/setup-dart@v1
      - name: Apply deterministic CI repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('clients/reactive-ts/test/websocket-real.test.ts')
          source = path.read_text(encoding='utf-8')
          replacements = [
              (
                  "import type { Socket } from 'node:net';",
                  "import type { Duplex } from 'node:stream';",
              ),
              (
                  'const sockets = new Set<Socket>();',
                  'const sockets = new Set<Duplex>();',
              ),
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f'expected exactly one TypeScript occurrence: {old!r}')
              source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          PY

          dart format \
            clients/reactive-dart/lib/src/background_sync.dart \
            clients/reactive-dart/tool/background_contract_test.dart

          git diff --check
          git rm .github/workflows/den-817-ci-repair.yml
      - name: Commit the permanent repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            clients/reactive-ts/test/websocket-real.test.ts \
            clients/reactive-dart/lib/src/background_sync.dart \
            clients/reactive-dart/tool/background_contract_test.dart
          git commit -m 'fix(DEN-817): satisfy reactive TypeScript and Dart checks'
          git push origin HEAD:agent/background-reactive-sync

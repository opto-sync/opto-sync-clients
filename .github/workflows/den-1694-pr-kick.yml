name: DEN-1694 run lease materializer

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/den-1694-materialize-v2.yml'
      - '.github/workflows/den-1694-pr-kick.yml'

permissions:
  contents: write

concurrency:
  group: den-1694-pr-kick-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install repository toolchain
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Execute reviewed materialization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/den-1694-materialize-v2.yml').read_text().splitlines()
          marker = '      - name: Port and harden lease implementation onto current main'
          start = lines.index(marker)
          run_line = lines.index('        run: |', start)
          body = []
          for line in lines[run_line + 1:]:
              if line.startswith('      - name:'):
                  break
              if not line:
                  body.append('')
              elif line.startswith('          '):
                  body.append(line[10:])
              else:
                  raise SystemExit(f'unexpected indentation: {line!r}')
          script = '\n'.join(body) + '\n'
          write = "leased.write_text(source, encoding='utf-8')"
          patch = '''source = source.replace(
              "Some(libc::EAGAIN) | Some(libc::EWOULDBLOCK)",
              "Some(libc::EAGAIN)",
          )
          source = source.replace(
              '#[path = "report_publish.rs"]\\nmod legacy;',
              '#[allow(dead_code)]\\n#[path = "report_publish.rs"]\\nmod legacy;',
          )
          leased.write_text(source, encoding='utf-8')'''
          if script.count(write) != 1:
              raise SystemExit('expected one leased source write boundary')
          script = script.replace(write, patch, 1)
          test_write = "tests.write_text(source, encoding='utf-8')"
          test_patch = '''source = source.replace(
              "let error = cleanup_stale_publication_state(&root, Duration::ZERO)",
              "let _error = cleanup_stale_publication_state(&root, Duration::ZERO)",
          )
          source = source.replace(
              'message.contains("regular file")',
              'message.contains("regular file") || message.contains("Too many levels of symbolic links")',
          )
          tests.write_text(source, encoding='utf-8')'''
          if script.count(test_write) != 1:
              raise SystemExit('expected one test source write boundary')
          Path('/tmp/den-1694-materialize.sh').write_text(script.replace(test_write, test_patch, 1))
          PY
          bash /tmp/den-1694-materialize.sh

      - name: Commit implementation
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add formal/REPORT_PUBLICATION_LEASES.md tools/fmctl/src/report_publish_leased.rs tools/fmctl/src/result.rs tools/fmctl/tests/report_publish_leases.rs
          git commit -m 'DEN-1694 confine cross-platform publication leases'
          git push origin "HEAD:${BRANCH}"

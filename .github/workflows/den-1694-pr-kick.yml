name: DEN-1694 run lease materializer

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/den-1694-materialize-v2.yml'
      - '.github/workflows/den-1694-pr-kick.yml'

permissions:
  contents: write

concurrency:
  group: den-1694-pr-kick-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install repository toolchain
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Execute the reviewed materialization body
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/den-1694-materialize-v2.yml').read_text().splitlines()
          marker = '      - name: Port and harden lease implementation onto current main'
          start = source.index(marker)
          run_line = source.index('        run: |', start)
          body = []
          for line in source[run_line + 1:]:
              if line.startswith('      - name:'):
                  break
              if line == '':
                  body.append('')
                  continue
              if not line.startswith('          '):
                  raise SystemExit(f'unexpected materializer indentation: {line!r}')
              body.append(line[10:])
          script = '\n'.join(body) + '\n'
          leased_needle = "leased.write_text(source, encoding='utf-8')"
          leased_patch = '''source = source.replace(
              "Some(libc::EAGAIN) | Some(libc::EWOULDBLOCK)",
              "Some(libc::EAGAIN)",
          )
          source = source.replace(
              '#[path = "report_publish.rs"]\\nmod legacy;',
              '#[allow(dead_code)]\\n#[path = "report_publish.rs"]\\nmod legacy;',
          )
          leased.write_text(source, encoding='utf-8')'''
          if script.count(leased_needle) != 1:
              raise SystemExit('expected one leased source write boundary')
          script = script.replace(leased_needle, leased_patch, 1)

          tests_needle = "tests.write_text(source, encoding='utf-8')"
          tests_patch = '''source = source.replace(
              "let error = cleanup_stale_publication_state(&root, Duration::ZERO)",
              "let _error = cleanup_stale_publication_state(&root, Duration::ZERO)",
          )
          tests.write_text(source, encoding='utf-8')'''
          if script.count(tests_needle) != 1:
              raise SystemExit('expected one test source write boundary')
          script = script.replace(tests_needle, tests_patch, 1)
          Path('/tmp/den-1694-materialize.sh').write_text(script)
          PY
          bash /tmp/den-1694-materialize.sh

      - name: Commit clean implementation
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            formal/REPORT_PUBLICATION_LEASES.md \
            tools/fmctl/src/report_publish_leased.rs \
            tools/fmctl/src/result.rs \
            tools/fmctl/tests/report_publish_leases.rs
          git commit -m 'DEN-1694 confine cross-platform publication leases'
          git push origin "HEAD:${BRANCH}"
name: DEN-1684 align report tests with configured artifact root

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/den-1684-fix-artifact-root.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1684-cli-rpc-report-bundles
          fetch-depth: 0
          persist-credentials: true

      - name: Correct both static and generated test paths
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          tests = Path('tools/fmctl/tests/execution_report.rs')
          source = tests.read_text(encoding='utf-8')
          replacements = {
              '.join(".formal-artifacts/bundles")': '.join(".formal-artifacts/fmctl/bundles")',
              'let artifacts = fixture.directory.path().join(".formal-artifacts");':
                  'let artifacts = fixture.directory.path().join(".formal-artifacts/fmctl");',
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f'expected one static test path: {old}')
              source = source.replace(old, new, 1)
          tests.write_text(source, encoding='utf-8')

          workflow = Path('.github/workflows/den-1684-semantic-hardening.yml')
          source = workflow.read_text(encoding='utf-8')
          old = '.join(".formal-artifacts/bundles")'
          new = '.join(".formal-artifacts/fmctl/bundles")'
          if source.count(old) != 1:
              raise SystemExit('expected one generated test path')
          workflow.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check

      - name: Commit the fixture correction
        env:
          BRANCH: agent/den-1684-cli-rpc-report-bundles
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/fmctl/tests/execution_report.rs \
            .github/workflows/den-1684-semantic-hardening.yml
          git rm .github/workflows/den-1684-fix-artifact-root.yml
          git commit -m 'DEN-1684 align tests with fmctl artifact root'
          git push origin "HEAD:${BRANCH}"

name: DEN-4179 normalize Dart websocket

on:
  push:
    branches:
      - fix/den-4179-dart-websocket-generations
    paths:
      - '.github/workflows/den-4179-dart-normalize.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          submodules: recursive

      - name: Install Dart
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: '3.13.3'

      - name: Install contract generator dependencies
        run: >-
          python3 -m pip install --disable-pip-version-check
          jsonschema==4.25.1 tomlkit==0.13.3

      - name: Format, validate, regenerate, and commit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('clients/dart/test/ws_generation_hardening_test.dart')
          source = path.read_text(encoding='utf-8')
          old_type = 'Matcher transportError(String code, {bool? retryable}) {'
          new_type = 'TypeMatcher<SyncTransportException> transportError(String code, {bool? retryable}) {'
          if source.count(old_type) != 1:
              raise SystemExit('expected one transportError return type')
          source = source.replace(old_type, new_type)
          old_order = '\n'.join([
              "    final pending = transport.pull('0', 10, ProtocolCancellationToken());",
              '    await Future<void>.delayed(Duration.zero);',
              '    await transport.dispose();',
              '    await expectLater(',
              '      pending,',
              "      throwsA(transportError('WS_DISPOSED', retryable: false)),",
              '    );',
          ])
          new_order = '\n'.join([
              "    final pending = transport.pull('0', 10, ProtocolCancellationToken());",
              '    final rejection = expectLater(',
              '      pending,',
              "      throwsA(transportError('WS_DISPOSED', retryable: false)),",
              '    );',
              '    await Future<void>.delayed(Duration.zero);',
              '    await transport.dispose();',
              '    await rejection;',
          ])
          if source.count(old_order) != 1:
              raise SystemExit('expected one disposal test sequence')
          path.write_text(source.replace(old_order, new_order), encoding='utf-8')
          PY
          (cd clients/dart && dart pub get)
          dart format clients/dart/lib/src/transport/ws.dart \
            clients/dart/test/ws_generation_hardening_test.dart
          (cd clients/dart && dart analyze lib/src/transport/ws.dart \
            test/ws_generation_hardening_test.dart)
          (cd clients/dart && dart test test/ws_transport_test.dart \
            test/ws_generation_hardening_test.dart)
          python3 scripts/harden_client_contract.py \
            --root . \
            --schema clients/client-api.schema.json \
            --org opto-sync \
            --repo opto-sync-clients \
            --prefix opto-sync \
            --write
          git rm .github/workflows/den-4179-dart-normalize.yml
          git add -- \
            clients/dart/lib/src/transport/ws.dart \
            clients/dart/test/ws_generation_hardening_test.dart \
            clients/contract-manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'normalize-dart-websocket-state'
          git push origin "HEAD:${GITHUB_REF_NAME}"

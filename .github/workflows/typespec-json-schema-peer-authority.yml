name: TypeSpec and JSON Schema peer-authority parity

on:
  pull_request:
    paths:
      - "test/fixtures/schema-authority-canary/**"
      - "contract-admission/**"
      - "clients/ts/src/forms/**"
      - "clients/ts/browser/forms/**"
      - "clients/ts/test/forms*.test.mjs"
      - "clients/ts/package.json"
      - ".github/workflows/typespec-json-schema-peer-authority.yml"
  push:
    branches: [main, dev]
    paths:
      - "test/fixtures/schema-authority-canary/**"
      - "contract-admission/**"
      - "clients/ts/src/forms/**"
      - "clients/ts/browser/forms/**"
      - "clients/ts/test/forms*.test.mjs"
      - "clients/ts/package.json"
      - ".github/workflows/typespec-json-schema-peer-authority.yml"
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schema-peer-authority-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify checked-out revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Test client envelope integrity and literal digest regressions
        run: node --test contract-admission/*.test.mjs
      - name: Generate Schema B and compare both peer authorities
        uses: ORESoftware/typespec-json-schema-validator@4a5d049218adc2740d4cf78f612caf7f38f6f64c
        with:
          typespec: test/fixtures/schema-authority-canary/main.tsp
          schema: test/fixtures/schema-authority-canary/authored.schema.json
          report: .typespec-json-schema-validator/report.json
          contract_ir: .typespec-json-schema-validator/contract-ir.json
          output_dir: .typespec-json-schema-validator/generated
          max_probes: "64"
      - name: Require current admission and nineteen canonical refusals
        uses: ORESoftware/typespec-json-schema-validator/actions/test-consumer-admission@4a5d049218adc2740d4cf78f612caf7f38f6f64c
        with:
          contract_ir: .typespec-json-schema-validator/contract-ir.json
          report: .typespec-json-schema-validator/report.json
          typespec: test/fixtures/schema-authority-canary/main.tsp
          schema: test/fixtures/schema-authority-canary/authored.schema.json
          generated_schema: .typespec-json-schema-validator/generated/typespec.generated.schema.json
          expected_declarations: '["OreSchemaAuthority.AuthorityKind","OreSchemaAuthority.PeerAuthorityRegistration"]'
          verification: .typespec-json-schema-validator/consumer-verification.json
      - name: Verify authored authorities were not modified
        shell: bash
        run: git diff --exit-code -- test/fixtures/schema-authority-canary/
      - name: Retain diagnostic receipt, IR, comparison witness and admission evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: schema-peer-authority-${{ github.event.repository.name }}-${{ github.run_id }}
          path: .typespec-json-schema-validator/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  form-envelope-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact head and pinned reconciliation core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: recursive
      - name: Verify checked-out revision and pinned core
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git submodule status --cached syncer.c
          test -f syncer.c/core/include/syncer.h
      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: clients/ts/package-lock.json
      - name: Generate form Schema B and compare peer authorities
        uses: ORESoftware/typespec-json-schema-validator@4a5d049218adc2740d4cf78f612caf7f38f6f64c
        with:
          typespec: contract-admission/forms/main.tsp
          schema: contract-admission/forms/authored.schema.json
          report: .typespec-json-schema-validator/forms/report.json
          contract_ir: .typespec-json-schema-validator/forms/contract-ir.json
          output_dir: .typespec-json-schema-validator/forms/generated
          max_probes: "128"
      - name: Require complete form admission and nineteen canonical refusals
        uses: ORESoftware/typespec-json-schema-validator/actions/test-consumer-admission@4a5d049218adc2740d4cf78f612caf7f38f6f64c
        with:
          contract_ir: .typespec-json-schema-validator/forms/contract-ir.json
          report: .typespec-json-schema-validator/forms/report.json
          typespec: contract-admission/forms/main.tsp
          schema: contract-admission/forms/authored.schema.json
          generated_schema: .typespec-json-schema-validator/forms/generated/typespec.generated.schema.json
          expected_declarations: '["OptoSync.Forms.FormSchemaVersion","OptoSync.Forms.FormMode","OptoSync.Forms.FormEnvelopeIdentity"]'
          verification: .typespec-json-schema-validator/forms/consumer-verification.json
      - name: Verify authored form authorities were not modified
        shell: bash
        run: git diff --exit-code -- contract-admission/forms/
      - name: Install locked native binding dependencies first
        run: npm ci --prefix syncer.c/bindings/typescript --no-audit --no-fund
      - name: Install TypeScript client dependencies and trusted local bootstrap
        run: npm ci --prefix clients/ts --no-audit --no-fund
      - name: Build TypeScript client outputs
        run: npm --prefix clients/ts run build
      - name: Prove form runtime behavior stays aligned
        run: npm --prefix clients/ts run test:node
      - name: Retain form contract receipt, IR, comparison witness and admission evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: form-schema-peer-authority-${{ github.event.repository.name }}-${{ github.run_id }}
          path: .typespec-json-schema-validator/forms/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

name: DEN-1623 repair materializer anchor

on:
  pull_request:
    branches:
      - agent/den-1617-manifest-shape-limits
    paths:
      - '.github/workflows/den-1623-fix-materializer.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout the DEN-1623 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1623-execution-work-budgets
          fetch-depth: 0
          persist-credentials: true

      - name: Repair the Rustfmt-aware anchor
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('.github/workflows/den-1623-materialize.yml')
          source = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r"'''fn validate_collection_limit\(\n"
              r"\s+label: &str,\n"
              r"\s+actual: usize,\n"
              r"\s+maximum: usize,\n"
              r"\s+errors: &mut Vec<String>,\n"
              r"\s+\) \{\n"
              r"\s+'''"
          )
          replacement = "'''fn validate_collection_limit(label: &str, actual: usize, maximum: usize, errors: &mut Vec<String>) {\n          '''"
          source, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit(f'expected one Rustfmt-aware collection-limit anchor, found {count}')

          old_condition = "    if: github.actor != 'github-actions[bot]'\n"
          new_condition = "    if: github.event_name == 'push' || github.actor != 'github-actions[bot]'\n"
          if source.count(old_condition) != 1:
              raise SystemExit('expected one materializer actor condition')
          path.write_text(source.replace(old_condition, new_condition, 1), encoding='utf-8')
          PY
          git diff --check

      - name: Commit the repaired materializer
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/den-1623-materialize.yml
          git commit -m 'DEN-1623 repair Rustfmt-aware materializer anchor'
          git push origin "HEAD:${BRANCH}"

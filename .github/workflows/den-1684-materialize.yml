name: DEN-1684 materialize CLI and RPC report integration

on:
  push:
    branches:
      - agent/den-1684-cli-rpc-report-bundles
    paths:
      - '.github/workflows/den-1684-materialize.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/den-1684-materialize.yml'
      - 'tools/fmctl/**'
      - 'formal/EXECUTION_REPORT_BUNDLES.md'

permissions:
  contents: write

concurrency:
  group: den-1684-materialize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: true
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout the DEN-1684 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1684-cli-rpc-report-bundles
          fetch-depth: 0
          persist-credentials: true

      - name: Install the repository Nix toolchain
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Wire the publisher into the shared execution path
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_one(path, old, new):
              file = Path(path)
              source = file.read_text(encoding='utf-8')
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}: {old[:100]!r}')
              file.write_text(source.replace(old, new, 1), encoding='utf-8')

          replace_one(
              'tools/fmctl/Cargo.toml',
              'serde_json = { version = "=1.0.134" }\nthiserror = "=2.0.9"\n',
              'serde_json = { version = "=1.0.134" }\nsha2 = "=0.10.9"\nthiserror = "=2.0.9"\n',
          )

          replace_one(
              'tools/fmctl/src/lib.rs',
              'pub mod error;\n',
              'pub mod error;\npub mod execution_report;\n',
          )

          replace_one(
              'tools/fmctl/src/error.rs',
              '    #[error("invalid JSON-RPC request: {0}")]\n    InvalidRpc(String),\n',
              '    #[error("report publication failed: {0}")]\n    ReportPublication(String),\n\n    #[error("invalid JSON-RPC request: {0}")]\n    InvalidRpc(String),\n',
          )
          replace_one(
              'tools/fmctl/src/error.rs',
              '    pub fn exit_code(&self) -> u8 {\n',
              '    pub fn report_publication(source: FmError) -> Self {\n        Self::ReportPublication(source.to_string())\n    }\n\n    pub fn exit_code(&self) -> u8 {\n',
          )
          replace_one(
              'tools/fmctl/src/error.rs',
              '            Self::Io { .. } | Self::Json(_) => 5,\n',
              '            Self::Io { .. } | Self::Json(_) => 5,\n            Self::ReportPublication(_) => 6,\n',
          )

          replace_one(
              'tools/fmctl/src/main.rs',
              'use fmctl::error::FmError;\n',
              'use fmctl::error::FmError;\nuse fmctl::execution_report::PublishedExecution;\n',
          )
          replace_one(
              'tools/fmctl/src/main.rs',
              '    let outcome = app.execute(&operation)?;\n    print_outcome(format, &outcome)?;\n    Ok(outcome.stable_exit_code())\n',
              '    let execution = app.execute_with_report_bundle(&operation)?;\n    print_execution(format, &execution)?;\n    Ok(execution.stable_exit_code())\n',
          )
          old_print = r'''fn print_outcome(format: OutputFormat, outcome: &CommandOutcome) -> Result<(), FmError> {
              match format {
                  OutputFormat::Json => print_serialized(format, outcome),
                  OutputFormat::Human => {
                      let mut stdout = io::stdout().lock();
                      let mut stderr = io::stderr().lock();
                      if !outcome.stdout.is_empty() {
                          stdout
                              .write_all(outcome.stdout.as_bytes())
                              .map_err(|source| FmError::io("<stdout>", source))?;
                          if !outcome.stdout.ends_with('\n') {
                              stdout
                                  .write_all(b"\n")
                                  .map_err(|source| FmError::io("<stdout>", source))?;
                          }
                      }
                      if !outcome.stderr.is_empty() {
                          stderr
                              .write_all(outcome.stderr.as_bytes())
                              .map_err(|source| FmError::io("<stderr>", source))?;
                          if !outcome.stderr.ends_with('\n') {
                              stderr
                                  .write_all(b"\n")
                                  .map_err(|source| FmError::io("<stderr>", source))?;
                          }
                      }
                      eprintln!(
                          "fmctl {}: {} ({} ms; result {})",
                          outcome.operation,
                          if outcome.success { "passed" } else { "failed" },
                          outcome.duration_millis,
                          outcome.artifacts.result.display()
                      );
                      Ok(())
                  }
              }
          }
          '''
          new_print = r'''fn print_execution(
              format: OutputFormat,
              execution: &PublishedExecution,
          ) -> Result<(), FmError> {
              match format {
                  OutputFormat::Json => print_serialized(format, execution),
                  OutputFormat::Human => {
                      let outcome = &execution.outcome;
                      let mut stdout = io::stdout().lock();
                      let mut stderr = io::stderr().lock();
                      if !outcome.stdout.is_empty() {
                          stdout
                              .write_all(outcome.stdout.as_bytes())
                              .map_err(|source| FmError::io("<stdout>", source))?;
                          if !outcome.stdout.ends_with('\n') {
                              stdout
                                  .write_all(b"\n")
                                  .map_err(|source| FmError::io("<stdout>", source))?;
                          }
                      }
                      if !outcome.stderr.is_empty() {
                          stderr
                              .write_all(outcome.stderr.as_bytes())
                              .map_err(|source| FmError::io("<stderr>", source))?;
                          if !outcome.stderr.ends_with('\n') {
                              stderr
                                  .write_all(b"\n")
                                  .map_err(|source| FmError::io("<stderr>", source))?;
                          }
                      }
                      eprintln!(
                          "fmctl {}: {} ({} ms; result {}; bundle {})",
                          outcome.operation,
                          if outcome.success { "passed" } else { "failed" },
                          outcome.duration_millis,
                          outcome.artifacts.result.display(),
                          execution.bundle.directory.display()
                      );
                      Ok(())
                  }
              }
          }
          '''
          replace_one('tools/fmctl/src/main.rs', old_print, new_print)
          replace_one(
              'tools/fmctl/src/main.rs',
              'use fmctl::runner::{command_display, CommandOutcome};\n',
              'use fmctl::runner::command_display;\n',
          )

          replace_one(
              'tools/fmctl/src/rpc.rs',
              '                let outcome = app.execute(&operation).map_err(RpcFault::from_fm)?;\n                Ok(json!({ "kind": "outcome", "outcome": outcome }))\n',
              '                let execution = app\n                    .execute_with_report_bundle(&operation)\n                    .map_err(RpcFault::from_fm)?;\n                Ok(json!({ "kind": "execution", "execution": execution }))\n',
          )
          replace_one(
              'tools/fmctl/src/rpc.rs',
              '            "execution": "serial"\n',
              '            "execution": "serial",\n            "report_bundle_schema": "fm.report-bundle.v1"\n',
          )
          PY

          nix develop --command cargo check \
            --manifest-path tools/fmctl/Cargo.toml \
            --all-targets \
            --all-features
          nix develop --command cargo fmt \
            --manifest-path tools/fmctl/Cargo.toml
          nix develop --command cargo clippy \
            --locked \
            --manifest-path tools/fmctl/Cargo.toml \
            --all-targets \
            --all-features \
            -- -D warnings
          nix develop --command cargo test \
            --locked \
            --manifest-path tools/fmctl/Cargo.toml \
            --all-targets \
            --all-features
          git diff --check

      - name: Commit the integrated execution path
        env:
          BRANCH: agent/den-1684-cli-rpc-report-bundles
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/fmctl/Cargo.toml \
            tools/fmctl/Cargo.lock \
            tools/fmctl/src/error.rs \
            tools/fmctl/src/lib.rs \
            tools/fmctl/src/main.rs \
            tools/fmctl/src/rpc.rs \
            tools/fmctl/src/execution_report.rs \
            tools/fmctl/tests/execution_report.rs \
            formal/EXECUTION_REPORT_BUNDLES.md
          git rm .github/workflows/den-1684-materialize.yml
          git commit -m 'DEN-1684 publish report bundles from CLI and RPC'
          git push origin "HEAD:${BRANCH}"

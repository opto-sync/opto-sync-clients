name: DEN-1631 diagnose all-target tests

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/den-1631-diagnose-tests.yml'
      - 'formal/RESOURCE_POLICY_RUNTIME.md'
      - 'tools/fmctl/src/lib.rs'
      - 'tools/fmctl/src/plan.rs'
      - 'tools/fmctl/src/runner.rs'

permissions:
  contents: read

concurrency:
  group: den-1631-diagnose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1631-enforce-local-resource-policy
          persist-credentials: false

      - name: Install repository Nix toolchain
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Run exact failing fmctl test command
        id: tests
        shell: bash
        run: |
          set +e
          set -o pipefail
          mkdir -p .diagnostics
          nix develop --command cargo test \
            --locked \
            --manifest-path tools/fmctl/Cargo.toml \
            --all-targets \
            --all-features \
            -- --nocapture 2>&1 | tee .diagnostics/cargo-test.log
          status=${PIPESTATUS[0]}
          printf 'status=%s\n' "$status" > .diagnostics/status.txt
          exit "$status"

      - name: Upload exact test log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: den-1631-cargo-test-log
          path: .diagnostics/
          if-no-files-found: error
          retention-days: 2

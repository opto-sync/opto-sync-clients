name: DEN-1631 enforce plan policy consistency

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/den-1631-plan-consistency.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout the DEN-1631 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1631-enforce-local-resource-policy
          fetch-depth: 0
          persist-credentials: true

      - name: Install the repository's Nix toolchain
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Reject inconsistent plans before artifacts or process launch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/fmctl/src/runner.rs')
          source = path.read_text(encoding='utf-8')

          old = '''pub fn execute_plan(plan: &CommandPlan) -> Result<CommandOutcome, FmError> {
              for directory in &plan.create_directories {
          '''
          new = '''fn validate_plan_resource_limits(plan: &CommandPlan) -> Result<(), FmError> {
              let expected_timeout = plan.resource_policy.effective.scalar.timeout_seconds;
              if plan.timeout_seconds != expected_timeout {
                  return Err(FmError::Validation(format!(
                      "command plan timeout {} does not match effective resource policy {}",
                      plan.timeout_seconds, expected_timeout
                  )));
              }
              let expected_output = usize::try_from(
                  plan.resource_policy.effective.scalar.max_output_bytes,
              )
              .map_err(|_| {
                  FmError::Validation(
                      "effective resource policy output limit exceeds usize".to_owned(),
                  )
              })?;
              if plan.max_output_bytes != expected_output {
                  return Err(FmError::Validation(format!(
                      "command plan output limit {} does not match effective resource policy {}",
                      plan.max_output_bytes, expected_output
                  )));
              }
              Ok(())
          }

          pub fn execute_plan(plan: &CommandPlan) -> Result<CommandOutcome, FmError> {
              validate_plan_resource_limits(plan)?;
              for directory in &plan.create_directories {
          '''
          if source.count(old) != 1:
              raise SystemExit(f'expected one execute_plan boundary, found {source.count(old)}')
          source = source.replace(old, new, 1)

          closing = source.rfind('\n}')
          if closing < 0:
              raise SystemExit('runner test module closing brace not found')
          test = r'''

              #[test]
              fn inconsistent_plan_policy_fails_before_artifact_or_process_creation() {
                  let directory = TempDir::new().expect("tempdir");
                  let workspace = fs::canonicalize(directory.path()).expect("canonical workspace");
                  let artifacts = workspace.join("must-not-exist");
                  let resource_policy = ResourceProfile::local_v1()
                      .resolve(ResourceRequest {
                          timeout_seconds: Some(1),
                          max_output_bytes: Some(1024),
                          ..ResourceRequest::absent()
                      })
                      .expect("test policy");
                  let plan = CommandPlan {
                      schema_version: 1,
                      project: "example".to_owned(),
                      model: "machine".to_owned(),
                      operation: "check".to_owned(),
                      program: "this-executable-must-not-run".to_owned(),
                      args: Vec::new(),
                      workspace: workspace.clone(),
                      cwd: workspace,
                      environment: BTreeMap::new(),
                      stdin: None,
                      timeout_seconds: 2,
                      max_output_bytes: 1024,
                      resource_policy,
                      create_directories: vec![artifacts.clone()],
                      artifacts: CommandArtifacts {
                          stdout: artifacts.join("stdout.log"),
                          stderr: artifacts.join("stderr.log"),
                          result: artifacts.join("result.json"),
                          trace_pattern: None,
                      },
                  };

                  let error = execute_plan(&plan).expect_err("inconsistent plan must fail");
                  assert!(error.to_string().contains("does not match effective resource policy"));
                  assert!(!artifacts.exists());
              }
          '''
          path.write_text(source[:closing] + test + source[closing:], encoding='utf-8')
          PY

          nix develop --command cargo fmt \
            --manifest-path tools/fmctl/Cargo.toml
          nix develop --command cargo clippy \
            --locked \
            --manifest-path tools/fmctl/Cargo.toml \
            --all-targets \
            --all-features \
            -- -D warnings
          nix develop --command cargo test \
            --locked \
            --manifest-path tools/fmctl/Cargo.toml \
            runner::tests
          git diff --check

      - name: Commit only the permanent runner guard
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/fmctl/src/runner.rs
          git commit -m 'DEN-1631 reject plans inconsistent with resource policy'
          git push origin HEAD:agent/den-1631-enforce-local-resource-policy

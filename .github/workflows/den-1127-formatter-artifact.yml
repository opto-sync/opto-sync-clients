name: DEN-1127 formatter artifact

on:
  pull_request:
    branches: [main]
    paths:
      - 'clients/reactive-dart/lib/src/sqlite_desktop.dart'
      - 'clients/reactive-dart/lib/opto_sync_reactive_sqlite.dart'
      - 'clients/reactive-dart/tool/sqlite_desktop_child.dart'
      - 'clients/reactive-dart/tool/sqlite_desktop_self_test.dart'
      - '.github/workflows/den-1127-formatter-artifact.yml'

permissions:
  contents: read

concurrency:
  group: den-1127-formatter-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    if: github.event.pull_request.head.ref == 'agent/den-1127-dart-sqlite-coordinator'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Apply canonical Dart formatting
        working-directory: clients/reactive-dart
        run: |
          set -euo pipefail
          dart pub get
          dart format \
            lib/src/sqlite_desktop.dart \
            lib/opto_sync_reactive_sqlite.dart \
            tool/sqlite_desktop_child.dart \
            tool/sqlite_desktop_self_test.dart

      - name: Stage formatted product files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p formatted/clients/reactive-dart/lib/src
          mkdir -p formatted/clients/reactive-dart/lib
          mkdir -p formatted/clients/reactive-dart/tool
          cp clients/reactive-dart/lib/src/sqlite_desktop.dart \
            formatted/clients/reactive-dart/lib/src/sqlite_desktop.dart
          cp clients/reactive-dart/lib/opto_sync_reactive_sqlite.dart \
            formatted/clients/reactive-dart/lib/opto_sync_reactive_sqlite.dart
          cp clients/reactive-dart/tool/sqlite_desktop_child.dart \
            formatted/clients/reactive-dart/tool/sqlite_desktop_child.dart
          cp clients/reactive-dart/tool/sqlite_desktop_self_test.dart \
            formatted/clients/reactive-dart/tool/sqlite_desktop_self_test.dart

      - uses: actions/upload-artifact@v4
        with:
          name: den-1127-formatted-dart
          path: formatted
          if-no-files-found: error
          retention-days: 1

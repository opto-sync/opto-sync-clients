name: PHP client

on:
  push:
    paths:
      - "clients/php/**"
      - ".github/workflows/php-client.yml"
  pull_request:
    paths:
      - "clients/php/**"
      - ".github/workflows/php-client.yml"

permissions:
  contents: read

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Validate package metadata
        working-directory: clients/php
        run: composer validate --strict
      - name: Install package
        working-directory: clients/php
        run: composer install --no-interaction --no-progress
      - name: Verify PHP syntax
        working-directory: clients/php
        run: |
          php -l src/Client.php
          php -l tests/contract.php
      - name: Run executable protocol contract
        working-directory: clients/php
        run: composer test

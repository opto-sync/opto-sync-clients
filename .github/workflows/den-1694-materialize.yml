name: DEN-1694 materialize cross-platform publication leases

on:
  push:
    branches:
      - agent/den-1694-cross-platform-publication-leases
    paths:
      - '.github/workflows/den-1694-materialize.yml'

permissions:
  contents: write

concurrency:
  group: den-1694-materialize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1694-cross-platform-publication-leases
          fetch-depth: 0
          persist-credentials: true

      - name: Install repository Nix toolchain
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Add OS-backed publication leases and cleanup probes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_one(path, old, new):
              file = Path(path)
              source = file.read_text(encoding='utf-8')
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}: {old[:120]!r}')
              file.write_text(source.replace(old, new, 1), encoding='utf-8')

          replace_one(
              'tools/fmctl/Cargo.toml',
              'clap = { version = "=4.5.23", features = ["derive"] }\nlibc = "=0.2.189"\n',
              'clap = { version = "=4.5.23", features = ["derive"] }\nfs2 = "=0.4.3"\nlibc = "=0.2.189"\n',
          )

          report = Path('tools/fmctl/src/report_publish.rs')
          source = report.read_text(encoding='utf-8')
          old = 'use serde::Serialize;\n\nuse crate::error::FmError;\n'
          new = 'use fs2::FileExt;\nuse serde::Serialize;\n\nuse crate::error::FmError;\n'
          if source.count(old) != 1:
              raise SystemExit('report publisher import boundary drifted')
          source = source.replace(old, new, 1)
          old = 'const RESERVATION_PREFIX: &str = ".fm-report-reservation-";\n'
          new = 'const RESERVATION_PREFIX: &str = ".fm-report-reservation-";\nconst ROOT_GUARD_FILE: &str = ".fm-report-publication-guard";\n'
          if source.count(old) != 1:
              raise SystemExit('report publisher constant boundary drifted')
          source = source.replace(old, new, 1)

          start = source.index('struct Reservation {')
          end = source.index('\npub fn publish_report_bundle(', start)
          replacement = r'''struct RootGuard {
              file: Option<fs::File>,
          }

          impl RootGuard {
              fn acquire(root: &Path) -> Result<Self, FmError> {
                  let path = root.join(ROOT_GUARD_FILE);
                  let mut options = OpenOptions::new();
                  options.read(true).write(true).create(true);
                  #[cfg(unix)]
                  options.mode(0o600);
                  let file = options
                      .open(&path)
                      .map_err(|source| FmError::io(&path, source))?;
                  FileExt::lock_exclusive(&file)
                      .map_err(|source| FmError::io(&path, source))?;
                  Ok(Self { file: Some(file) })
              }
          }

          impl Drop for RootGuard {
              fn drop(&mut self) {
                  if let Some(file) = self.file.take() {
                      let _ = FileExt::unlock(&file);
                  }
              }
          }

          struct Reservation {
              path: PathBuf,
              file: Option<fs::File>,
              committed: bool,
          }

          impl Reservation {
              fn acquire(root: &Path, bundle_id: &str) -> Result<Self, FmError> {
                  // Serialize reservation creation with cleanup so the final
                  // reservation path is never visible before its lease is held.
                  let _root_guard = RootGuard::acquire(root)?;
                  let path = root.join(format!("{RESERVATION_PREFIX}{bundle_id}"));
                  let mut options = OpenOptions::new();
                  options.read(true).write(true).create_new(true);
                  #[cfg(unix)]
                  options.mode(0o600);
                  let file = options.open(&path).map_err(|source| {
                      if source.kind() == io::ErrorKind::AlreadyExists {
                          FmError::Validation(format!(
                              "report bundle id is already reserved or published: {bundle_id}"
                          ))
                      } else {
                          FmError::io(&path, source)
                      }
                  })?;
                  FileExt::lock_exclusive(&file)
                      .map_err(|source| FmError::io(&path, source))?;
                  let mut reservation = Self {
                      path,
                      file: Some(file),
                      committed: false,
                  };
                  let file = reservation.file.as_mut().expect("reservation file");
                  file.write_all(bundle_id.as_bytes())
                      .map_err(|source| FmError::io(&reservation.path, source))?;
                  file.sync_all()
                      .map_err(|source| FmError::io(&reservation.path, source))?;
                  Ok(reservation)
              }

              fn commit(&mut self) {
                  self.committed = true;
              }

              fn release_lock(&mut self) {
                  if let Some(file) = self.file.take() {
                      let _ = FileExt::unlock(&file);
                  }
              }
          }

          impl Drop for Reservation {
              fn drop(&mut self) {
                  self.release_lock();
                  if !self.committed {
                      let _ = fs::remove_file(&self.path);
                  }
              }
          }

          struct StagingDirectory {
              path: PathBuf,
              committed: bool,
          }

          impl StagingDirectory {
              fn create(root: &Path, bundle_id: &str) -> Result<Self, FmError> {
                  let sequence = STAGING_SEQUENCE.fetch_add(1, Ordering::Relaxed);
                  // The length prefix makes the active reservation identity
                  // recoverable even when bundle ids themselves contain '-'.
                  let name = format!(
                      "{STAGING_PREFIX}{}-{bundle_id}-{}-{sequence}",
                      bundle_id.len(),
                      std::process::id()
                  );
                  let path = root.join(name);
                  create_private_directory(&path)?;
                  Ok(Self {
                      path,
                      committed: false,
                  })
              }

              fn commit(&mut self) {
                  self.committed = true;
              }
          }

          impl Drop for StagingDirectory {
              fn drop(&mut self) {
                  if !self.committed {
                      let _ = fs::remove_dir_all(&self.path);
                  }
              }
          }
          '''
          source = source[:start] + replacement + source[end:]

          cleanup_start = source.index('pub fn cleanup_stale_publication_state(')
          cleanup_end = source.index('\npub(crate) fn render_public_result_json', cleanup_start)
          cleanup = r'''pub fn cleanup_stale_publication_state(
              root: &Path,
              minimum_age: Duration,
          ) -> Result<CleanupReport, FmError> {
              let root = ensure_private_root(root)?;
              // Serialize cleanup workers and close the reservation create/lock
              // race while permitting unrelated active publications to proceed.
              let _root_guard = RootGuard::acquire(&root)?;
              let now = SystemTime::now();
              let mut report = CleanupReport::default();
              for entry in fs::read_dir(&root).map_err(|source| FmError::io(&root, source))? {
                  let entry = entry.map_err(|source| FmError::io(&root, source))?;
                  let name = entry.file_name();
                  let Some(name) = name.to_str() else {
                      continue;
                  };
                  let path = entry.path();
                  let metadata = match fs::symlink_metadata(&path) {
                      Ok(metadata) => metadata,
                      Err(source) if source.kind() == io::ErrorKind::NotFound => continue,
                      Err(source) => return Err(FmError::io(&path, source)),
                  };
                  if metadata.file_type().is_symlink()
                      || !is_old_enough(&metadata, now, minimum_age)
                  {
                      continue;
                  }

                  if name.starts_with(STAGING_PREFIX) && metadata.is_dir() {
                      if let Some(bundle_id) = staging_bundle_id(name) {
                          match probe_reservation_lock(&root, bundle_id)? {
                              LockProbe::Active => continue,
                              LockProbe::Acquired(_lock) => {
                                  if remove_dir_all_if_present(&path)? {
                                      report.staging_directories_removed += 1;
                                  }
                                  continue;
                              }
                              LockProbe::Missing => {}
                          }
                      }
                      // Legacy staging names have no recoverable reservation id;
                      // they retain the historical age-only cleanup behavior.
                      if remove_dir_all_if_present(&path)? {
                          report.staging_directories_removed += 1;
                      }
                      continue;
                  }

                  if let Some(bundle_id) = name.strip_prefix(RESERVATION_PREFIX) {
                      if !metadata.is_file() || root.join(bundle_id).exists() {
                          continue;
                      }
                      match probe_file_lock(&path)? {
                          LockProbe::Active | LockProbe::Missing => continue,
                          LockProbe::Acquired(lock) => {
                              lock.release();
                              if remove_file_if_present(&path)? {
                                  report.reservations_removed += 1;
                              }
                          }
                      }
                  }
              }
              sync_directory(&root)?;
              Ok(report)
          }

          enum LockProbe {
              Missing,
              Active,
              Acquired(CleanupLock),
          }

          struct CleanupLock {
              file: Option<fs::File>,
          }

          impl CleanupLock {
              fn release(mut self) {
                  if let Some(file) = self.file.take() {
                      let _ = FileExt::unlock(&file);
                  }
              }
          }

          impl Drop for CleanupLock {
              fn drop(&mut self) {
                  if let Some(file) = self.file.take() {
                      let _ = FileExt::unlock(&file);
                  }
              }
          }

          fn probe_reservation_lock(root: &Path, bundle_id: &str) -> Result<LockProbe, FmError> {
              probe_file_lock(&root.join(format!("{RESERVATION_PREFIX}{bundle_id}")))
          }

          fn probe_file_lock(path: &Path) -> Result<LockProbe, FmError> {
              let mut options = OpenOptions::new();
              options.read(true).write(true);
              let file = match options.open(path) {
                  Ok(file) => file,
                  Err(source) if source.kind() == io::ErrorKind::NotFound => {
                      return Ok(LockProbe::Missing)
                  }
                  Err(source) => return Err(FmError::io(path, source)),
              };
              match FileExt::try_lock_exclusive(&file) {
                  Ok(()) => Ok(LockProbe::Acquired(CleanupLock { file: Some(file) })),
                  Err(source) if source.kind() == io::ErrorKind::WouldBlock => {
                      Ok(LockProbe::Active)
                  }
                  Err(source) => Err(FmError::io(path, source)),
              }
          }

          fn staging_bundle_id(name: &str) -> Option<&str> {
              let value = name.strip_prefix(STAGING_PREFIX)?;
              let (length, remainder) = value.split_once('-')?;
              let length = length.parse::<usize>().ok()?;
              let bundle_id = remainder.get(..length)?;
              let suffix = remainder.get(length..)?;
              if !suffix.starts_with('-') || validate_report_bundle_id(bundle_id).is_err() {
                  return None;
              }
              Some(bundle_id)
          }

          fn remove_file_if_present(path: &Path) -> Result<bool, FmError> {
              match fs::remove_file(path) {
                  Ok(()) => Ok(true),
                  Err(source) if source.kind() == io::ErrorKind::NotFound => Ok(false),
                  Err(source) => Err(FmError::io(path, source)),
              }
          }

          fn remove_dir_all_if_present(path: &Path) -> Result<bool, FmError> {
              match fs::remove_dir_all(path) {
                  Ok(()) => Ok(true),
                  Err(source) if source.kind() == io::ErrorKind::NotFound => Ok(false),
                  Err(source) => Err(FmError::io(path, source)),
              }
          }
          '''
          source = source[:cleanup_start] + cleanup + source[cleanup_end:]
          report.write_text(source, encoding='utf-8')

          tests = Path('tools/fmctl/tests/report_publish.rs')
          source = tests.read_text(encoding='utf-8')
          source = source.replace(
              'use std::fs;\nuse std::io;\nuse std::path::PathBuf;\nuse std::sync::{Arc, Barrier};\nuse std::thread;\nuse std::time::Duration;\n',
              'use std::env;\nuse std::fs::{self, OpenOptions};\nuse std::io::{self, Write};\nuse std::path::{Path, PathBuf};\nuse std::process::{Command, Stdio};\nuse std::sync::{mpsc, Arc, Barrier};\nuse std::thread;\nuse std::time::{Duration, Instant};\n\nuse fs2::FileExt;\n',
              1,
          )
          marker = '#[test]\nfn cleanup_removes_only_old_abandoned_publication_state() {\n'
          addition = r'''#[test]
          fn zero_age_cleanup_skips_a_publisher_paused_after_every_staged_write() {
              let directory = TempDir::new().expect("tempdir");
              let root = directory.path().to_path_buf();
              let publisher_root = root.clone();
              let (step_tx, step_rx) = mpsc::sync_channel(0);
              let (resume_tx, resume_rx) = mpsc::sync_channel(0);
              let publisher = thread::spawn(move || {
                  publish_report_bundle_with_hook(
                      &fixture_outcome(),
                      &publisher_root,
                      "paused-001",
                      |step| {
                          step_tx
                              .send(step)
                              .map_err(|_| io::Error::other("step receiver disconnected"))?;
                          resume_rx
                              .recv()
                              .map_err(|_| io::Error::other("resume sender disconnected"))?;
                          Ok(())
                      },
                  )
              });

              for expected in [
                  PublishStep::Result,
                  PublishStep::Junit,
                  PublishStep::Sarif,
                  PublishStep::ArtifactManifest,
                  PublishStep::Provenance,
                  PublishStep::BeforeRename,
              ] {
                  assert_eq!(
                      step_rx.recv_timeout(Duration::from_secs(5)).expect("publish step"),
                      expected
                  );
                  let report = cleanup_stale_publication_state(&root, Duration::ZERO)
                      .expect("cleanup while active");
                  assert_eq!(report.staging_directories_removed, 0);
                  assert_eq!(report.reservations_removed, 0);
                  assert!(root.join(".fm-report-reservation-paused-001").is_file());
                  assert!(fs::read_dir(&root)
                      .expect("publication root")
                      .filter_map(Result::ok)
                      .any(|entry| entry.file_name().to_string_lossy().starts_with(".fm-report-staging-")));
                  resume_tx.send(()).expect("resume publisher");
              }

              let published = publisher
                  .join()
                  .expect("publisher thread")
                  .expect("publication succeeds");
              assert!(published.result.is_file());
          }

          #[test]
          fn process_death_releases_the_reservation_lease_for_cleanup() {
              let directory = TempDir::new().expect("tempdir");
              let reservation = directory
                  .path()
                  .join(".fm-report-reservation-dead-child");
              let ready = directory.path().join("child-ready");
              let mut child = Command::new(env::current_exe().expect("current test executable"))
                  .args(["--exact", "reservation_lock_holder_child", "--nocapture"])
                  .env("FMCTL_REPORT_LOCK_PATH", &reservation)
                  .env("FMCTL_REPORT_LOCK_READY", &ready)
                  .stdin(Stdio::null())
                  .stdout(Stdio::null())
                  .stderr(Stdio::null())
                  .spawn()
                  .expect("spawn lock holder");

              let deadline = Instant::now() + Duration::from_secs(10);
              while !ready.exists() {
                  if let Some(status) = child.try_wait().expect("child status") {
                      panic!("lock holder exited before ready: {status}");
                  }
                  assert!(Instant::now() < deadline, "lock holder did not become ready");
                  thread::sleep(Duration::from_millis(10));
              }

              let active = cleanup_stale_publication_state(directory.path(), Duration::ZERO)
                  .expect("cleanup active child");
              assert_eq!(active.reservations_removed, 0);
              assert!(reservation.exists());

              child.kill().expect("kill lock holder");
              child.wait().expect("wait for lock holder");
              let abandoned = cleanup_stale_publication_state(directory.path(), Duration::ZERO)
                  .expect("cleanup dead child");
              assert_eq!(abandoned.reservations_removed, 1);
              assert!(!reservation.exists());
          }

          #[test]
          fn reservation_lock_holder_child() {
              let Some(path) = env::var_os("FMCTL_REPORT_LOCK_PATH") else {
                  return;
              };
              let ready = PathBuf::from(
                  env::var_os("FMCTL_REPORT_LOCK_READY").expect("ready path"),
              );
              let mut options = OpenOptions::new();
              options.read(true).write(true).create_new(true);
              let mut file = options.open(PathBuf::from(path)).expect("reservation file");
              FileExt::lock_exclusive(&file).expect("reservation lease");
              file.write_all(b"dead-child").expect("reservation contents");
              file.sync_all().expect("reservation sync");
              fs::write(ready, b"ready").expect("ready marker");
              loop {
                  thread::sleep(Duration::from_secs(60));
              }
          }

          #[test]
          fn concurrent_cleanup_workers_are_serialized_and_idempotent() {
              let directory = TempDir::new().expect("tempdir");
              let root = directory.path().to_path_buf();
              for index in 0..16 {
                  fs::create_dir(root.join(format!(
                      ".fm-report-staging-abandoned-{index}-1"
                  )))
                  .expect("staging directory");
                  fs::write(
                      root.join(format!(".fm-report-reservation-orphan-{index}")),
                      b"orphan",
                  )
                  .expect("reservation");
              }

              let barrier = Arc::new(Barrier::new(3));
              let handles = (0..2)
                  .map(|_| {
                      let root = root.clone();
                      let barrier = Arc::clone(&barrier);
                      thread::spawn(move || {
                          barrier.wait();
                          cleanup_stale_publication_state(&root, Duration::ZERO)
                      })
                  })
                  .collect::<Vec<_>>();
              barrier.wait();
              let reports = handles
                  .into_iter()
                  .map(|handle| handle.join().expect("cleanup thread").expect("cleanup"))
                  .collect::<Vec<_>>();
              assert_eq!(
                  reports
                      .iter()
                      .map(|report| report.staging_directories_removed)
                      .sum::<usize>(),
                  16
              );
              assert_eq!(
                  reports
                      .iter()
                      .map(|report| report.reservations_removed)
                      .sum::<usize>(),
                  16
              );
          }

          '''
          if source.count(marker) != 1:
              raise SystemExit('report publication test insertion point drifted')
          tests.write_text(source.replace(marker, addition + marker, 1), encoding='utf-8')

          doc = Path('formal/ATOMIC_REPORT_PUBLICATION.md')
          source = doc.read_text(encoding='utf-8')
          old = '''A create-new reservation file serializes concurrent publication of the same
          bundle identifier. Different identifiers may publish concurrently. A collision
          is a hard error; the previous bundle remains unchanged.

          Abandoned staging directories and orphan reservations can be removed by
          `cleanup_stale_publication_state` after a caller-selected minimum age. Cleanup
          never removes a reservation whose final bundle directory exists and ignores
          foreign files.
          '''
          new = '''A create-new reservation file serializes concurrent publication of the same
          bundle identifier. The publisher holds an exclusive cross-platform OS lock on
          that reservation for the entire staging and rename lifetime. A short-lived
          root guard serializes reservation creation with cleanup so the reservation path
          is never visible before its lease is active. Different identifiers still write
          concurrently after setup.

          New staging names carry a length-prefixed bundle id. Cleanup recovers that id
          and probes the corresponding reservation with a nonblocking exclusive lock.
          A lock conflict is live publication state and is skipped regardless of age.
          Reservation cleanup performs the same probe. OS locks are released by process
          death, after which the caller-selected age threshold controls removal. Legacy
          staging names retain age-only cleanup. A permanent root guard is ignored as
          foreign maintenance state and final immutable bundles contain no lease file.
          '''
          if source.count(old) != 1:
              raise SystemExit('atomic publication concurrency documentation drifted')
          source = source.replace(old, new, 1)
          old = '''- stale staging/orphan-reservation cleanup;
          - invalid identifiers;
          '''
          new = '''- stale staging/orphan-reservation cleanup;
          - zero-age cleanup at every paused publication step;
          - active reservation and staging liveness probes;
          - automatic lock release after child-process death;
          - serialized concurrent cleanup workers;
          - invalid identifiers;
          '''
          if source.count(old) != 1:
              raise SystemExit('atomic publication checked-boundary list drifted')
          doc.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

          nix develop --command cargo fmt \
            --manifest-path tools/fmctl/Cargo.toml
          nix develop --command cargo clippy \
            --manifest-path tools/fmctl/Cargo.toml \
            --all-targets \
            --all-features \
            -- -D warnings
          nix develop --command cargo test \
            --manifest-path tools/fmctl/Cargo.toml \
            --all-targets \
            --all-features
          git diff --check

      - name: Commit publication lease implementation
        env:
          BRANCH: agent/den-1694-cross-platform-publication-leases
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/fmctl/Cargo.toml \
            tools/fmctl/Cargo.lock \
            tools/fmctl/src/report_publish.rs \
            tools/fmctl/tests/report_publish.rs \
            formal/ATOMIC_REPORT_PUBLICATION.md
          git commit -m 'DEN-1694 protect active report publications with OS leases'
          git push origin "HEAD:${BRANCH}"

name: DEN-1406 bind manifest metadata to opened handle

on:
  push:
    branches:
      - agent/den-1406-bound-manifest-input
    paths:
      - '.github/workflows/den-1406-handle-metadata.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout the DEN-1406 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1406-bound-manifest-input
          fetch-depth: 0
          persist-credentials: true

      - name: Install the repository's Nix toolchain
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Bind metadata and reads to the same file handle
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/fmctl/src/manifest.rs')
          source = path.read_text(encoding='utf-8')
          old = '''    let metadata = fs::metadata(path).map_err(|source| FmError::io(path, source))?;
              if !metadata.is_file() {
          '''
          new = '''    let file = fs::File::open(path).map_err(|error| FmError::io(path, error))?;
              let metadata = file.metadata().map_err(|source| FmError::io(path, source))?;
              if !metadata.is_file() {
          '''
          if source.count(old) != 1:
              raise SystemExit('expected one path metadata block')
          source = source.replace(old, new, 1)

          old = '''    let file = fs::File::open(path).map_err(|error| FmError::io(path, error))?;
              let read_limit = u64::try_from(maximum).unwrap_or(u64::MAX).saturating_add(1);
          '''
          new = '''    let read_limit = u64::try_from(maximum).unwrap_or(u64::MAX).saturating_add(1);
          '''
          if source.count(old) != 1:
              raise SystemExit('expected one later file-open block')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')

          doc = Path('formal/RESOURCE_LIMITS.md')
          source = doc.read_text(encoding='utf-8')
          old = '''2. requires a regular file;
          3. checks metadata size before allocating the file body;
          4. opens the file and reads at most the ceiling plus one sentinel byte;
          '''
          new = '''2. opens the canonical path and requires that exact handle to be a regular file;
          3. checks metadata from the opened handle before allocating the file body;
          4. reads that same handle up to the ceiling plus one sentinel byte;
          '''
          if source.count(old) != 1:
              raise SystemExit('expected one manifest-boundary documentation block')
          doc.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

          nix develop --command cargo fmt \
            --manifest-path tools/fmctl/Cargo.toml
          nix develop --command cargo clippy \
            --locked \
            --manifest-path tools/fmctl/Cargo.toml \
            --all-targets \
            --all-features \
            -- -D warnings
          nix develop --command cargo test \
            --locked \
            --manifest-path tools/fmctl/Cargo.toml \
            manifest::tests
          git diff --check

      - name: Commit the handle-bound manifest reader
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/fmctl/src/manifest.rs formal/RESOURCE_LIMITS.md
          git commit -m 'DEN-1406 bind manifest metadata to opened handle'
          git push origin "HEAD:${BRANCH}"

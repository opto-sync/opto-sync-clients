name: Formal methods

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  opto-sync-protocol:
    name: Quint protocol model and client conformance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QUINT_PACKAGE: '@informalsystems/quint@0.32.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Java for TLC/Apalache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Typecheck the executable specification
        shell: bash
        run: |
          mkdir -p .formal-artifacts
          set +e
          npx --yes --package="$QUINT_PACKAGE" quint typecheck \
            formal/opto_sync_protocol.qnt 2>&1 \
            | tee .formal-artifacts/typecheck.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Simulate safety and reach failure-recovery witnesses
        shell: bash
        run: |
          set +e
          npx --yes --package="$QUINT_PACKAGE" quint run \
            formal/opto_sync_protocol.qnt \
            --max-samples=10000 \
            --max-steps=40 \
            --invariant=protocol_safety \
            --witnesses \
              ambiguous_commit_reached \
              duplicate_retry_reached \
              reset_crash_reached 2>&1 \
            | tee .formal-artifacts/simulation.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Exhaustively model-check the finite protocol state space
        shell: bash
        run: |
          set +e
          npx --yes --package="$QUINT_PACKAGE" quint verify \
            formal/opto_sync_protocol.qnt \
            --backend=tlc \
            --invariant=protocol_safety 2>&1 \
            | tee .formal-artifacts/tlc.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Generate model-based testing traces
        shell: bash
        run: |
          set +e
          npx --yes --package="$QUINT_PACKAGE" quint run \
            formal/opto_sync_protocol.qnt \
            --max-samples=500 \
            --max-steps=30 \
            --n-traces=8 \
            --mbt \
            --out-itf='.formal-artifacts/opto-sync-{seq}.itf.json' 2>&1 \
            | tee .formal-artifacts/trace-generation.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Normalize Quint MBT metadata for implementation adapters
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          traces=(.formal-artifacts/opto-sync-*.itf.json)
          if (( ${#traces[@]} == 0 )); then
            printf 'no Quint ITF traces were generated\n' >&2
            exit 1
          fi
          for trace in "${traces[@]}"; do
            temporary="${trace}.normalized"
            jq '
              .states |= map(
                . + {
                  action: .["mbt::actionTaken"],
                  nondetPicks: .["mbt::nondetPicks"]
                }
              )
            ' "$trace" > "$temporary"
            mv "$temporary" "$trace"
          done

      - name: Install and build the TypeScript client
        working-directory: clients/ts
        shell: bash
        run: |
          set +e
          set -o pipefail
          {
            npm ci
            npm run build
            node --check formal/quint-itf-replay.mjs
          } 2>&1 | tee ../../.formal-artifacts/typescript-build.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Replay ITF traces against TypeScript Dexie state
        working-directory: clients/ts
        shell: bash
        run: |
          set +e
          node formal/quint-itf-replay.mjs \
            ../../.formal-artifacts/opto-sync-*.itf.json 2>&1 \
            | tee ../../.formal-artifacts/typescript-itf-replay.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Upload formal-methods artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opto-sync-formal-methods
          path: .formal-artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

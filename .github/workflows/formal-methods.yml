name: Formal methods

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  opto-sync-protocol:
    name: fmctl + Quint protocol model
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Java for TLC and Apalache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt

      - name: Format-check fmctl
        working-directory: tools/fmctl
        run: cargo fmt --all --check

      - name: Lint fmctl
        working-directory: tools/fmctl
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test fmctl
        working-directory: tools/fmctl
        run: cargo test --all-targets --all-features

      - name: Build fmctl
        working-directory: tools/fmctl
        run: cargo build --release

      - name: Validate the formal-methods manifest
        run: |
          mkdir -p .formal-artifacts/fmctl
          tools/fmctl/target/release/fmctl --format json validate \
            | tee .formal-artifacts/fmctl/validate.json

      - name: Typecheck through fmctl
        run: tools/fmctl/target/release/fmctl check

      - name: Simulate safety and reach failure-recovery witnesses through fmctl
        run: tools/fmctl/target/release/fmctl simulate

      - name: Exhaustively model-check the finite protocol state space through fmctl
        run: tools/fmctl/target/release/fmctl verify

      - name: Generate model-based testing traces through fmctl
        run: tools/fmctl/target/release/fmctl trace

      - name: Exercise the JSON-RPC server over stdio
        shell: bash
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"fm.capabilities"}' \
            '{"jsonrpc":"2.0","id":2,"method":"fm.plan","params":{"operation":"verify"}}' \
            '{"jsonrpc":"2.0","id":3,"method":"fm.shutdown"}' \
            | tools/fmctl/target/release/fmctl serve \
            | tee .formal-artifacts/fmctl/rpc.jsonl
          python3 - <<'PY'
          import json
          from pathlib import Path

          responses = [
              json.loads(line)
              for line in Path('.formal-artifacts/fmctl/rpc.jsonl').read_text().splitlines()
              if line.strip()
          ]
          assert [response['id'] for response in responses] == [1, 2, 3]
          assert responses[0]['result']['adapter_protocol'] == 'fmctl.adapter.v1'
          assert responses[1]['result']['plan']['operation'] == 'verify'
          assert responses[2]['result']['shutdown'] is True
          PY

      - name: Upload verifier, trace, lockfile, and normalized fmctl artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opto-sync-formal-methods
          path: |
            .formal-artifacts/
            tools/fmctl/Cargo.lock
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

name: Formal methods

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  opto-sync-protocol:
    name: Quint protocol model and Rust conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QUINT_PACKAGE: '@informalsystems/quint@0.32.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Java for TLC/Apalache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install the Rust client compatibility toolchain
        uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
        with:
          toolchain: '1.88.0'
          components: clippy, rustfmt

      - name: Typecheck the executable specification
        shell: bash
        run: |
          mkdir -p .formal-artifacts
          set +e
          npx --yes --package="$QUINT_PACKAGE" quint typecheck \
            formal/opto_sync_protocol.qnt 2>&1 \
            | tee .formal-artifacts/typecheck.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Simulate safety and reach failure-recovery witnesses
        shell: bash
        run: |
          set +e
          npx --yes --package="$QUINT_PACKAGE" quint run \
            formal/opto_sync_protocol.qnt \
            --max-samples=10000 \
            --max-steps=40 \
            --invariant=protocol_safety \
            --witnesses \
              ambiguous_commit_reached \
              duplicate_retry_reached \
              reset_crash_reached 2>&1 \
            | tee .formal-artifacts/simulation.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Exhaustively model-check the finite protocol state space
        shell: bash
        run: |
          set +e
          npx --yes --package="$QUINT_PACKAGE" quint verify \
            formal/opto_sync_protocol.qnt \
            --backend=tlc \
            --invariant=protocol_safety 2>&1 \
            | tee .formal-artifacts/tlc.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Generate model-based testing traces
        shell: bash
        run: |
          set +e
          npx --yes --package="$QUINT_PACKAGE" quint run \
            formal/opto_sync_protocol.qnt \
            --backend=rust \
            --seed=0x4b27def6cf7f060b \
            --max-samples=16 \
            --max-steps=40 \
            --n-traces=16 \
            --mbt \
            --out-itf='.formal-artifacts/opto-sync-{seq}.itf.json' 2>&1 \
            | tee .formal-artifacts/trace-generation.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Validate the non-published Rust replay adapter
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt \
            --manifest-path formal/rust-itf-replay/Cargo.toml \
            -- --check
          cargo clippy \
            --locked \
            --manifest-path formal/rust-itf-replay/Cargo.toml \
            --all-targets \
            -- -D warnings
          cargo test \
            --locked \
            --manifest-path formal/rust-itf-replay/Cargo.toml \
            --all-targets

      - name: Replay generated traces against the Rust protocol queue
        shell: bash
        run: |
          set +e
          cargo run \
            --locked \
            --manifest-path formal/rust-itf-replay/Cargo.toml \
            --bin quint-itf-replay \
            -- .formal-artifacts/opto-sync-*.itf.json 2>&1 \
            | tee .formal-artifacts/rust-itf-replay.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Upload formal-methods artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opto-sync-formal-methods
          path: .formal-artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

name: DEN-1637 materialize report module

on:
  push:
    branches:
      - agent/den-1637-report-bundle
    paths:
      - '.github/workflows/den-1637-materialize.yml'

permissions:
  contents: write

concurrency:
  group: den-1637-materialize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout the DEN-1637 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1637-report-bundle
          fetch-depth: 0
          persist-credentials: true

      - name: Install the repository Nix toolchain
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Export the report API and run focused gates
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/fmctl/src/lib.rs')
          source = path.read_text(encoding='utf-8')
          marker = 'pub mod resource;\n'
          replacement = 'pub mod report;\npub mod resource;\n'
          if source.count('pub mod report;') == 0:
              if source.count(marker) != 1:
                  raise SystemExit('expected one resource module declaration')
              source = source.replace(marker, replacement, 1)
          elif source.count('pub mod report;') != 1:
              raise SystemExit('report module declaration is duplicated')
          path.write_text(source, encoding='utf-8')
          PY

          nix develop --command cargo fmt \
            --manifest-path tools/fmctl/Cargo.toml
          nix develop --command cargo clippy \
            --locked \
            --manifest-path tools/fmctl/Cargo.toml \
            --all-targets \
            --all-features \
            -- -D warnings
          nix develop --command cargo test \
            --locked \
            --manifest-path tools/fmctl/Cargo.toml \
            --all-targets \
            --all-features
          git diff --check

      - name: Commit the formatted report implementation
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/fmctl/src/lib.rs \
            tools/fmctl/src/report.rs \
            tools/fmctl/src/bin/fm-report-bundle.rs \
            tools/fmctl/tests/report_bundle.rs
          git commit -m 'DEN-1637 export and certify report bundle renderers'
          git push origin "HEAD:${BRANCH}"

name: DEN-1684 harden semantic failure publication

on:
  push:
    branches:
      - agent/den-1684-cli-rpc-report-bundles
    paths:
      - '.github/workflows/den-1684-semantic-hardening.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/den-1684-semantic-hardening.yml'
      - 'tools/fmctl/**'
      - 'formal/EXECUTION_REPORT_BUNDLES.md'

permissions:
  contents: write

concurrency:
  group: den-1684-semantic-hardening-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1684-cli-rpc-report-bundles
          fetch-depth: 0
          persist-credentials: true

      - name: Install repository Nix toolchain
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Publish semantic failures from the exact execution plan
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_one(path, old, new):
              file = Path(path)
              source = file.read_text(encoding='utf-8')
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}: {old[:100]!r}')
              file.write_text(source.replace(old, new, 1), encoding='utf-8')

          replace_one(
              'tools/fmctl/src/lib.rs',
              '    pub fn execute(&self, operation: &Operation) -> Result<CommandOutcome, FmError> {\n        let loaded = self.load()?;\n',
              '    pub fn execute(&self, operation: &Operation) -> Result<CommandOutcome, FmError> {\n        let (outcome, deferred_error) = self.execute_outcome(operation)?;\n        if let Some(error) = deferred_error {\n            return Err(error);\n        }\n        Ok(outcome)\n    }\n\n    pub(crate) fn execute_outcome(\n        &self,\n        operation: &Operation,\n    ) -> Result<(CommandOutcome, Option<FmError>), FmError> {\n        let loaded = self.load()?;\n',
          )
          replace_one(
              'tools/fmctl/src/lib.rs',
              '        if let Some(error) = deferred_error {\n            return Err(error);\n        }\n        Ok(outcome)\n    }\n\n    pub fn doctor',
              '        Ok((outcome, deferred_error))\n    }\n\n    pub fn doctor',
          )

          replace_one(
              'tools/fmctl/src/report_publish.rs',
              'fn render_public_result_json(outcome: &CommandOutcome) -> Result<Vec<u8>, FmError> {\n',
              'pub(crate) fn render_public_result_json(\n    outcome: &CommandOutcome,\n) -> Result<Vec<u8>, FmError> {\n',
          )

          execution = Path('tools/fmctl/src/execution_report.rs')
          source = execution.read_text(encoding='utf-8')
          old = 'use crate::result::publish::{publish_report_bundle, PublishedReportBundle};\n'
          new = 'use crate::result::publish::{\n    publish_report_bundle, render_public_result_json, PublishedReportBundle,\n};\n'
          if source.count(old) != 1:
              raise SystemExit('execution_report import drifted')
          source = source.replace(old, new, 1)
          old = '        let outcome = self.execute(operation)?;\n        let loaded = self.load()?;\n        let bundle_root = loaded\n            .resolve_output_path(&loaded.manifest.execution.artifacts_dir.join("bundles"))\n            .map_err(FmError::report_publication)?;\n'
          new = '        let (outcome, _deferred_error) = self.execute_outcome(operation)?;\n        let artifacts_dir = outcome.artifacts.result.parent().ok_or_else(|| {\n            FmError::report_publication(FmError::Validation(\n                "execution result artifact has no parent directory".to_owned(),\n            ))\n        })?;\n        let bundle_root = bundle_root_for_artifacts(artifacts_dir);\n'
          if source.count(old) != 1:
              raise SystemExit('execution_report bundle-root block drifted')
          source = source.replace(old, new, 1)
          old = '    let junit = render_junit_xml(outcome)?;\n    let sarif = render_sarif_json(outcome)?;\n'
          new = '    let result = render_public_result_json(outcome)?;\n    let junit = render_junit_xml(outcome)?;\n    let sarif = render_sarif_json(outcome)?;\n'
          if source.count(old) != 1:
              raise SystemExit('execution_report renderer block drifted')
          source = source.replace(old, new, 1)
          old = '    for payload in [\n        junit.as_bytes(),\n'
          new = '    for payload in [\n        result.as_slice(),\n        junit.as_bytes(),\n'
          if source.count(old) != 1:
              raise SystemExit('execution_report digest block drifted')
          source = source.replace(old, new, 1)
          start = source.index('fn operation_component(operation: &str) -> String {')
          end = source.index('\npub fn bundle_root_for_artifacts', start)
          replacement = '''fn operation_component(operation: &str) -> String {
              let mut value = String::new();
              for byte in operation.bytes() {
                  let byte = byte.to_ascii_lowercase();
                  if byte.is_ascii_alphanumeric() {
                      value.push(char::from(byte));
                  } else if !value.is_empty() && !value.ends_with('-') {
                      value.push('-');
                  }
                  if value.len() >= 48 {
                      break;
                  }
              }
              while value.ends_with('-') {
                  value.pop();
              }
              if value.is_empty() {
                  "operation".to_owned()
              } else {
                  value
              }
          }
          '''
          source = source[:start] + replacement + source[end:]
          execution.write_text(source, encoding='utf-8')

          tests = Path('tools/fmctl/tests/execution_report.rs')
          source = tests.read_text(encoding='utf-8')
          marker = 'fn assert_complete_bundle(directory: &Path) {\n'
          addition = r'''#[test]
          fn trace_validation_failure_still_publishes_a_complete_bundle() {
              let fixture = Fixture::new();
              let execution = fixture
                  .app
                  .execute_with_report_bundle(&Operation::Trace { output: None })
                  .expect("semantic trace failure still publishes");
              assert!(!execution.outcome.success);
              assert_eq!(execution.stable_exit_code(), 2);
              assert!(execution
                  .outcome
                  .failure
                  .as_deref()
                  .is_some_and(|failure| failure.contains("expected 8")));
              assert_complete_bundle(&execution.bundle.directory);

              let legacy = fixture.app.execute(&Operation::Trace { output: None });
              assert!(matches!(legacy, Err(FmError::Validation(_))));
          }

          #[test]
          fn execution_uses_the_planned_artifact_root_if_the_manifest_changes_mid_run() {
              let fixture = Fixture::new();
              let script = fixture.directory.path().join("formal/fake-npx.sh");
              fs::write(
                  &script,
                  "#!/bin/sh\nprintf 'invalid = [' > formal/fm.toml\nprintf 'fake verifier passed\\n'\n",
              )
              .expect("rewrite fake verifier");
              let mut permissions = fs::metadata(&script).expect("script metadata").permissions();
              permissions.set_mode(0o700);
              fs::set_permissions(&script, permissions).expect("script permissions");

              let execution = fixture
                  .app
                  .execute_with_report_bundle(&Operation::Check)
                  .expect("bundle root comes from the executed plan");
              assert_complete_bundle(&execution.bundle.directory);
              assert!(execution
                  .bundle
                  .directory
                  .starts_with(fixture.directory.path().join(".formal-artifacts/bundles")));
          }

          #[test]
          fn public_result_changes_change_the_content_address() {
              let fixture = Fixture::new();
              let execution = fixture
                  .app
                  .execute_with_report_bundle(&Operation::Check)
                  .expect("published execution");
              let mut changed = execution.outcome.clone();
              changed.duration_millis = changed.duration_millis.saturating_add(1);
              let original = deterministic_bundle_id(&execution.outcome).expect("original id");
              let changed = deterministic_bundle_id(&changed).expect("changed id");
              assert_ne!(original, changed);
          }

          '''
          if source.count(marker) != 1:
              raise SystemExit('execution-report test insertion point drifted')
          tests.write_text(source.replace(marker, addition + marker, 1), encoding='utf-8')

          doc = Path('formal/EXECUTION_REPORT_BUNDLES.md')
          source = doc.read_text(encoding='utf-8')
          source += '''
          ## Semantic failures and manifest races

          Post-process failures such as malformed adapter responses or invalid trace
          corpora are recorded in the `CommandOutcome`, published as complete bundles,
          and returned with their stable nonzero exit code. The legacy `App::execute`
          API continues returning its structured error for compatibility.

          Bundle placement is derived from the result artifact path in the executed
          `CommandPlan`; the manifest is not reloaded after the child process runs.
          Therefore a process that edits the manifest cannot redirect or suppress the
          evidence from the already-authorized execution plan.
          '''
          doc.write_text(source, encoding='utf-8')
          PY

          nix develop --command cargo fmt \
            --manifest-path tools/fmctl/Cargo.toml
          nix develop --command cargo clippy \
            --locked \
            --manifest-path tools/fmctl/Cargo.toml \
            --all-targets \
            --all-features \
            -- -D warnings
          nix develop --command cargo test \
            --locked \
            --manifest-path tools/fmctl/Cargo.toml \
            --all-targets \
            --all-features
          git diff --check

      - name: Commit semantic hardening
        env:
          BRANCH: agent/den-1684-cli-rpc-report-bundles
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/fmctl/src/lib.rs \
            tools/fmctl/src/report_publish.rs \
            tools/fmctl/src/execution_report.rs \
            tools/fmctl/tests/execution_report.rs \
            formal/EXECUTION_REPORT_BUNDLES.md
          git rm .github/workflows/den-1684-semantic-hardening.yml
          git commit -m 'DEN-1684 publish semantic failures without manifest reload'
          git push origin "HEAD:${BRANCH}"

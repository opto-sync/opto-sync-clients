name: Background reactive sync

on:
  pull_request:
    paths:
      - 'clients/reactive-ts/**'
      - 'clients/reactive-dart/**'
      - 'clients/rust/tests/c_abi_differential.rs'
      - 'docs/BACKGROUND_REACTIVE_SYNC.md'
      - 'README.md'
      - '.github/workflows/background-reactive-sync.yml'
  push:
    branches: [main]
    paths:
      - 'clients/reactive-ts/**'
      - 'clients/reactive-dart/**'
      - 'clients/rust/tests/c_abi_differential.rs'
      - 'docs/BACKGROUND_REACTIVE_SYNC.md'
      - 'README.md'
      - '.github/workflows/background-reactive-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: background-reactive-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rxjs-service-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout clients and exact core
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: |
            clients/ts/package-lock.json
            clients/reactive-ts/package-lock.json

      - name: Build the pinned native/WASM TypeScript client
        run: |
          set -euo pipefail
          (cd syncer.c/bindings/typescript && npm ci)
          (cd clients/ts && npm ci && npm run build)

      - name: Install, type-check, and test RxJS orchestration
        working-directory: clients/reactive-ts
        run: |
          set -euo pipefail
          npm ci
          node ../ts/node_modules/typescript/bin/tsc -p tsconfig.json --noEmit
          npm test

      - name: Install Chromium and run the real two-tab Service Worker test
        run: |
          set -euo pipefail
          (cd clients/ts && npx playwright install --with-deps chromium)
          (cd clients/reactive-ts && npm run test:browser)

  rxdart-mobile-background:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout clients and exact core
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Resolve and test the RxDart package
        working-directory: clients/reactive-dart
        run: |
          set -euo pipefail
          dart pub get
          dart format --output=none --set-exit-if-changed lib tool
          dart analyze
          dart run tool/self_test.dart
          python3 tool/check_native_background_adapters.py

  rust-c-abi-differential:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout clients and exact core
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install the certified Rust toolchain
        uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0

      - name: Compare the safe Rust wrapper with the raw C ABI
        run: >-
          cargo test --locked
          --manifest-path clients/rust/Cargo.toml
          --no-default-features
          --test c_abi_differential

  postgres-supabase-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout this client branch
        uses: actions/checkout@v4
        with:
          path: opto-sync-clients
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Checkout the integration harness
        uses: actions/checkout@v4
        with:
          repository: opto-sync/opto-sync-e2e
          ref: main
          path: opto-sync-e2e
          persist-credentials: false

      - name: Materialize the exact sibling core used by this client commit
        run: |
          set -euo pipefail
          cp -a opto-sync-clients/syncer.c syncer.c
          test "$(git -C opto-sync-clients rev-parse HEAD:syncer.c)" = \
               "$(git -C opto-sync-clients/syncer.c rev-parse HEAD)"
          test -f syncer.c/core/include/syncer.h

      - name: Prepare the parent Docker build context
        run: |
          set -euo pipefail
          cp opto-sync-e2e/context.dockerignore .dockerignore
          test -f opto-sync-e2e/.env || cp opto-sync-e2e/.env.example opto-sync-e2e/.env
          (cd opto-sync-e2e && docker compose config --quiet)
          (cd opto-sync-e2e && docker compose -f docker-compose.yml -f docker-compose.supabase.yml config --quiet)

      - name: Postgres-backed HTTP protocol v1
        working-directory: opto-sync-e2e
        run: docker compose --profile protocol up --build --exit-code-from protocol

      - name: Tear down Postgres profile
        if: always()
        working-directory: opto-sync-e2e
        run: docker compose down -v --remove-orphans || true

      - name: Supabase/PostgREST synchronization contract
        working-directory: opto-sync-e2e
        run: |
          docker compose -f docker-compose.yml -f docker-compose.supabase.yml \
            up -d --build postgrest rust-mash
          docker compose -f docker-compose.yml -f docker-compose.supabase.yml \
            --profile supabasetest run --rm supabase-test

      - name: Collect integration logs
        if: failure()
        working-directory: opto-sync-e2e
        run: |
          docker compose -f docker-compose.yml -f docker-compose.supabase.yml \
            logs --no-color --timestamps > background-reactive-compose.log 2>&1 || true
          tail -n 250 background-reactive-compose.log || true

      - name: Upload integration logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: background-reactive-compose-logs
          path: opto-sync-e2e/background-reactive-compose.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down all profiles
        if: always()
        working-directory: opto-sync-e2e
        run: |
          docker compose -f docker-compose.yml -f docker-compose.supabase.yml \
            down -v --remove-orphans || true

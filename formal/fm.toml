# Provisional manifest for the planned Rust formal-methods orchestrator.
# The current GitHub Actions workflow executes these settings directly.
schema_version = 1
project = "opto-sync-clients"
model = "protocol-v1"
language = "quint"
spec = "formal/opto_sync_protocol.qnt"
main = "opto_sync_protocol"
init = "init"
step = "step"
invariants = ["protocol_safety"]
witnesses = [
  "ambiguous_commit_reached",
  "duplicate_retry_reached",
  "reset_crash_reached",
]

[toolchain]
quint = "0.32.0"
java = ">=17"
node = "22"

[simulation]
backend = "typescript"
max_samples = 10000
max_steps = 40

[verification]
backend = "tlc"
exhaustive_finite_model = true

[traces]
format = "itf"
model_based_testing_metadata = true
count = 8
max_steps = 30

[adapters.rust]
strategy = "itf-json-driver"
target = "clients/rust"
status = "in-review"
issue = "DEN-573"

[adapters.typescript]
strategy = "itf-json-driver"
target = "clients/ts"
driver = "clients/ts/formal/quint-itf-replay.mjs"
implementation = "OptoSyncClient + Dexie + fake-indexeddb"
projection = [
  "next_mutation_id",
  "pending_mutation_ids",
  "confirmed_mutation_ids",
  "allocated_mutation_ids",
  "in_flight_request_id",
  "response_identity_and_validity",
  "pull_checkpoint",
  "reset_replacement_phase",
]
status = "active"
issue = "DEN-583"

[adapters.dart]
strategy = "itf-json-driver"
target = "clients/dart"
status = "planned"

[adapters.go]
strategy = "itf-json-driver"
status = "planned-reference-sdk"

[adapters.gleam]
strategy = "itf-json-driver"
target = "clients/gleam"
status = "planned"

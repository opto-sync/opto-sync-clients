schema_version = 1
project = "opto-sync-clients"
model = "connectivity-override-v1"
language = "quint"
spec = "formal/connectivity_override.qnt"
main = "connectivity_override"
init = "init"
step = "step"
invariants = ["connectivity_safety"]
temporal_properties = []
witnesses = [
  "forced_override_reached",
  "cached_internet_reached",
  "cached_restore_reached",
]

[toolchain]
quint = "0.32.0"
java = ">=17"
node = "22"
rust = "1.88.0"
npx = "npx"

[execution]
timeout_seconds = 1200
max_output_bytes = 8388608
artifacts_dir = ".formal-artifacts/connectivity"

[simulation]
backend = "rust"
max_samples = 10000
max_steps = 24

[verification]
backend = "tlc"
exhaustive_finite_model = true

[traces]
format = "itf"
model_based_testing_metadata = true
backend = "rust"
seed = "0xd1b54a32d192ed03"
count = 64
max_steps = 24
max_samples = 64
required_actions = [
  "init",
  "idle",
  "publish_unknown",
  "publish_offline",
  "publish_link",
  "publish_internet",
  "force_offline",
  "restore_automatic",
]

[adapters.typescript]
strategy = "itf-json-driver"
target = "formal/typescript-connectivity-itf-replay.mjs"
working_directory = "."
command = ["node", "formal/typescript-connectivity-itf-replay.mjs"]
implementation = "clients/ts production ManualConnectivityWatcher"
observable_state = ["state", "mode", "verified", "emitted"]
status = "active"

[adapters.dart]
strategy = "itf-json-driver"
target = "clients/dart/tool/connectivity_itf_replay.dart"
working_directory = "clients/dart"
command = ["dart", "run", "tool/connectivity_itf_replay.dart"]
implementation = "clients/dart production ManualOptoSyncConnectivityWatcher"
observable_state = ["state", "mode", "verified", "emitted"]
status = "active"

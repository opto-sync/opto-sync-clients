[package]
name = "opto-sync-desktop"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Restart-safe desktop background synchronization contracts for opto-sync"
license = "MIT"
publish = false

[dependencies]
# 0.40.x pulls libsqlite3-sys 0.38.x, whose build script requires a newer
# compiler than this crate's deliberate Rust 1.88 MSRV. Keep the newest
# bundled SQLite stack verified against the repository toolchain.
rusqlite = { version = "=0.39.0", features = ["bundled"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

name: opto_sync_flutter_background
description: >-
  Background mutation-queue draining and UI-agnostic connectivity signals for
  opto-sync Flutter apps: Android WorkManager/ConnectivityManager and iOS
  BGTaskScheduler/NWPathMonitor adapters.
version: 0.1.1
publish_to: 'none'

environment:
  sdk: ^3.12.1
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  opto_sync_client:
    path: ../dart

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.optosync.background
        pluginClass: OptoSyncBackgroundPlugin
      ios:
        pluginClass: OptoSyncBackgroundPlugin

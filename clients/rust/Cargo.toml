[package]
name = "opto-sync-client"
version = "0.1.0"
edition = "2021"
description = "Client-side library for opto-sync: optimistic writes + CRDT-style reconciliation"

[features]
default = ["sqlite", "ws"]
sqlite = ["dep:rusqlite"]
ws = ["dep:tungstenite"]

[dependencies]
syncer-rs = { path = "../../syncer.c/bindings/rust" }
# The queue stores payloads as opaque JSON strings, so stamping `updatedAt`
# means parsing and re-serializing one object. Hand-rolling that is how a client
# ends up corrupting a payload it was only supposed to add a field to.
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# CSPRNG for node ids. Collision resistance is the requirement: two installs
# that land on the same node id lose the total order the id exists to provide.
getrandom = "0.3"
# 0.40.x raises the dependency graph beyond the Rust 1.88 compatibility target
# certified by the clean-room matrix. Keep the last graph proven on Linux,
# macOS, and Windows until the project's declared MSRV is raised deliberately.
rusqlite = { version = "=0.39.0", features = ["bundled"], optional = true }
# Blocking WebSocket client for the realtime sync transport (and the in-process
# mock server in tests). Default features only — no TLS backend is pulled in;
# the e2e stack and the reference server speak plain `ws://`. Pinned for the
# same MSRV discipline as rusqlite above.
tungstenite = { version = "=0.28.0", optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
